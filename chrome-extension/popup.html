<!DOCTYPE html>
<html lang="en" style="width:764px;height:528px;min-width:764px;min-height:528px;max-width:764px;max-height:528px;overflow:hidden">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=764,initial-scale=1">
<title>Geek Games</title>
<style>
  /* Bundled pixel font — kept local so the popup renders offline and
     dodges MV3's flaky external-font behavior. */
  @font-face{
    font-family:"Press Start 2P";
    src:url("fonts/PressStart2P.woff2") format("woff2");
    font-weight:400;
    font-style:normal;
    font-display:block;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  /* Fixed popup size (Chrome auto-shrinks otherwise) */
  html{
    width:764px !important;
    height:528px !important;
    min-width:764px;
    min-height:528px;
    overflow:hidden;
  }

  /* ─── Geek Games cyberpunk neon theme ───
     Palette: deep navy base, electric cyan + hot pink accents, arcade
     yellow for bonuses. Pixel font ("Press Start 2P") for the brand,
     clean sans-serif for body. Subtle scanlines give the CRT feel
     without hurting legibility. */
  body{
    width:764px;
    height:528px;
    color:#e2e8f0;
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    user-select:none;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(circle at 20% 0%, rgba(255,46,136,.22), transparent 55%),
      radial-gradient(circle at 100% 100%, rgba(0,229,255,.18), transparent 55%),
      #060a16;
    position:relative;
  }
  /* CRT scanline overlay on top of everything */
  body::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:999;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0,
      rgba(255,255,255,0) 2px,
      rgba(0,0,0,.055) 3px,
      rgba(0,0,0,.055) 4px
    );
  }

  /* ─── Top bar ─── */
  .bar{
    flex-shrink:0;
    height:38px;
    display:flex;
    align-items:center;
    padding:0 12px;
    background:linear-gradient(180deg,#0a1024 0%, #050814 100%);
    border-bottom:1px solid rgba(0,229,255,.35);
    box-shadow:0 1px 0 rgba(255,46,136,.15), 0 2px 12px rgba(0,229,255,.1);
    gap:8px;
  }
  .bar .title{
    flex:1;
    font-family:"Press Start 2P",monospace;
    font-size:11px;
    letter-spacing:1.5px;
    background:linear-gradient(90deg,#FF2E88 10%, #a855f7 50%, #00E5FF 90%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    text-shadow:0 0 20px rgba(0,229,255,.3);
    display:flex;align-items:center;gap:7px;
    padding-left:2px;
  }
  .bar .title .mask{
    font-size:14px;line-height:1;
    filter:drop-shadow(0 0 4px rgba(0,229,255,.7));
  }
  .bar button{
    all:unset;
    cursor:pointer;
    width:26px;height:24px;
    border-radius:5px;
    background:rgba(0,229,255,.1);
    color:#e2e8f0;
    font-size:14px;font-weight:700;
    text-align:center;line-height:24px;
    transition:all .15s;
    border:1px solid rgba(0,229,255,.25);
  }
  .bar button:hover{
    background:rgba(0,229,255,.2);
    border-color:rgba(0,229,255,.6);
    box-shadow:0 0 10px rgba(0,229,255,.4);
  }
  .bar button.close{
    background:rgba(255,46,136,.18);
    color:#fff;
    border-color:rgba(255,46,136,.5);
  }
  .bar button.close:hover{
    background:rgba(255,46,136,.4);
    box-shadow:0 0 12px rgba(255,46,136,.6);
  }
  .bar button:focus-visible{outline:2px solid #00E5FF;outline-offset:2px}
  .card:focus-visible{outline:2px solid #00E5FF;outline-offset:2px;box-shadow:0 0 0 3px rgba(0,229,255,.35)}
  .ftr a:focus-visible{outline:2px solid #00E5FF;outline-offset:2px}
  .bar .back{display:none}
  body.playing .bar .back{display:inline-block}
  body.playing .bar .title{display:none}
  .bar .game-title{
    display:none;flex:1;
    font-family:"Press Start 2P",monospace;
    font-size:10px;letter-spacing:1px;color:#00E5FF;
    text-shadow:0 0 8px rgba(0,229,255,.5);
  }
  body.playing .bar .game-title{display:block}

  /* ─── Menu view ─── */
  .menu{
    flex:1;
    overflow:auto;
    padding:14px;
    position:relative;
    z-index:1;
  }
  body.playing .menu{display:none}
  .grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
  }
  .card{
    all:unset;
    box-sizing:border-box;
    display:block;
    position:relative;
    aspect-ratio:1/1;
    width:100%;
    border-radius:10px;
    cursor:pointer;
    overflow:hidden;
    border:1px solid rgba(0,229,255,.15);
    background:transparent;
    color:inherit;
    font:inherit;
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s;
  }
  .card:hover{
    transform:translateY(-3px) scale(1.05);
    border-color:rgba(0,229,255,.75);
    box-shadow:
      0 6px 16px rgba(0,0,0,.65),
      0 0 0 1px rgba(0,229,255,.6),
      0 0 18px rgba(0,229,255,.4);
    z-index:2;
  }
  .card:active{transform:translateY(-1px) scale(1.02)}
  .card .bg{
    position:absolute;inset:0;
    background:linear-gradient(160deg,var(--c1),var(--c2));
    opacity:.9;
  }
  .card:hover .bg{opacity:1}
  .card .inner{
    position:relative;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6px 4px;
    text-align:center;
  }
  .card .emoji{
    font-size:30px;line-height:1;
    margin-bottom:5px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));
  }
  .card .name{
    font-size:10px;font-weight:800;
    letter-spacing:.4px;color:#fff;
    line-height:1.1;
    text-shadow:0 1px 2px rgba(0,0,0,.8);
  }
  /* LIVE badge — cyan neon */
  .card.live::after{
    content:"LIVE";
    position:absolute;top:4px;right:4px;
    background:rgba(0,229,255,.95);color:#042f2e;
    font-family:"Press Start 2P",monospace;
    font-size:6px;font-weight:900;letter-spacing:.5px;
    padding:3px 5px;border-radius:3px;
    box-shadow:0 0 8px rgba(0,229,255,.8);
  }
  /* HOT badge — neon pink pulsing */
  .card.hot .hotTag{
    position:absolute;top:4px;right:4px;z-index:3;
    display:inline-flex;align-items:center;gap:2px;
    font-family:"Press Start 2P",monospace;
    font-size:6px;font-weight:900;letter-spacing:.5px;
    padding:3px 5px;border-radius:999px;
    background:rgba(255,46,136,.95);color:#fff;
    border:1px solid rgba(255,220,180,.6);
    box-shadow:0 0 10px rgba(255,46,136,.8);
    animation:hotPulse 1.3s ease-in-out infinite;
    pointer-events:none;
  }
  .card.hot.live::after{top:auto;bottom:4px}
  @keyframes hotPulse{
    0%,100%{transform:scale(1);box-shadow:0 0 10px rgba(255,46,136,.7)}
    50%{transform:scale(1.1);box-shadow:0 0 20px rgba(255,46,136,1)}
  }

  /* ─── Promo row ─── */
  .promo{
    margin-top:14px;
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .promo button{
    all:unset;
    cursor:pointer;
    font-size:11px;
    font-weight:700;
    letter-spacing:.3px;
    padding:6px 14px;
    border-radius:999px;
    color:#00E5FF;
    background:rgba(0,229,255,.06);
    border:1px solid rgba(0,229,255,.4);
    transition:all .15s;
    white-space:nowrap;
  }
  .promo button:hover{
    background:rgba(0,229,255,.18);
    box-shadow:0 0 12px rgba(0,229,255,.4);
    transform:translateY(-1px);
  }
  .promo button:active{transform:translateY(0)}
  .promo .rate{
    color:#FFD60A;
    border-color:rgba(255,214,10,.5);
    background:rgba(255,214,10,.06);
  }
  .promo .rate:hover{
    background:rgba(255,214,10,.18);
    box-shadow:0 0 12px rgba(255,214,10,.5);
  }
  .promo button:focus-visible{outline:2px solid #00E5FF;outline-offset:2px}
  .promo .toast{
    position:fixed;
    left:50%;
    bottom:16px;
    transform:translateX(-50%);
    background:#042f2e;
    color:#5eead4;
    font-family:"Press Start 2P",monospace;
    font-size:9px;letter-spacing:1px;
    padding:9px 14px;border-radius:6px;
    border:1px solid rgba(0,229,255,.5);
    box-shadow:0 0 18px rgba(0,229,255,.4);
    z-index:9999;
    pointer-events:none;
    opacity:0;
    transition:opacity .2s;
  }
  .promo .toast.show{opacity:1}

  /* ─── Footer ─── */
  .ftr{
    margin-top:10px;
    text-align:center;
    border-top:1px solid rgba(0,229,255,.12);
    padding-top:8px;
  }
  .ftr a{
    display:inline-block;
    color:#67e8f9;
    font-size:11px;
    text-decoration:none;
    padding:5px 12px;
    border-radius:6px;
    transition:all .15s;
    cursor:pointer;
  }
  .ftr a:hover{
    background:rgba(0,229,255,.1);
    color:#00E5FF;
    text-shadow:0 0 8px rgba(0,229,255,.6);
  }
  .ftr .sep{color:#1e293b;margin:0 4px}

  /* ─── Game view ─── */
  .game{
    flex:1;
    display:none;
    width:764px;height:490px;
    overflow:hidden;
    background:#060a16;
    position:relative;
    z-index:1;
  }
  body.playing .game{display:block}
  .game iframe{
    display:block;
    border:0;
    background:#060a16;
  }
</style>
</head>
<body>
  <div class="bar">
    <button class="back" id="back" title="Back to games">←</button>
    <div class="title"><span class="mask">🎭</span><span>GEEK GAMES</span></div>
    <div class="game-title" id="gameTitle"></div>
    <button id="newTab" title="Open in new tab">⤢</button>
    <button class="close" id="close" title="Close">×</button>
  </div>

  <div class="menu">
    <div class="grid" id="grid"></div>
    <div class="promo">
      <button class="invite" id="inviteBtn" title="Copy install link to clipboard">👯 Invite a friend</button>
      <button class="rate" id="rateBtn" title="Open our Chrome Web Store page">⭐ Love it? Rate 5 stars</button>
      <div class="toast" id="toast"></div>
    </div>
    <div class="ftr">
      <a data-action="full">🌐 Full site</a>
      <span class="sep">·</span>
      <a data-action="privacy">Privacy</a>
    </div>
  </div>

  <div class="game">
    <iframe id="gameFrame" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"></iframe>
  </div>

  <script src="hot.js"></script>
  <script src="popup.js"></script>
</body>
</html>
