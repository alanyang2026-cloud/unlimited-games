<!DOCTYPE html>
<html lang="en" style="width:764px;height:528px;min-width:764px;min-height:528px;max-width:764px;max-height:528px;overflow:hidden">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=764,initial-scale=1">
<title>Unlimited Games</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Chrome sizes the popup to the <html> element; forcing both html
     and body to exactly 764×528 (no min/max variance) prevents Chrome
     from auto-shrinking to fit content when the grid doesn't fill
     the whole box. */
  html{
    width:764px !important;
    height:528px !important;
    min-width:764px;
    min-height:528px;
    overflow:hidden;
  }
  body{
    width:764px;
    height:528px;
    background:#07070d;
    color:#fff;
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    user-select:none;
  }
  body{
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(circle at 30% 0%, rgba(168,85,247,.35), transparent 60%),
      radial-gradient(circle at 100% 100%, rgba(236,72,153,.25), transparent 50%),
      #07070d;
  }

  /* ─── Top bar (persistent) ─── */
  .bar{
    flex-shrink:0;
    height:36px;
    display:flex;
    align-items:center;
    padding:0 12px;
    background:linear-gradient(180deg, #1e1b4b, #0a0612);
    border-bottom:1px solid rgba(168,85,247,.3);
    gap:8px;
  }
  .bar .title{
    flex:1;
    font-size:13px;
    font-weight:800;
    letter-spacing:1px;
    background:linear-gradient(90deg,#fef3c7,#fbbf24);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
  }
  .bar .title .g{
    background:linear-gradient(90deg,#c4b5fd,#a855f7);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
  }
  .bar button{
    all:unset;
    cursor:pointer;
    width:24px;height:24px;
    border-radius:5px;
    background:rgba(255,255,255,.1);
    color:#fef3c7;
    font-size:14px;font-weight:700;
    text-align:center;line-height:24px;
    transition:background .15s;
  }
  .bar button:hover{background:rgba(255,255,255,.2)}
  .bar button.close{background:#dc2626;color:#fff}
  .bar button.close:hover{background:#ef4444}
  .bar .back{display:none}
  body.playing .bar .back{display:inline-block}
  body.playing .bar .title{display:none}
  .bar .game-title{
    display:none;flex:1;
    font-size:13px;font-weight:700;color:#fef3c7;
  }
  body.playing .bar .game-title{display:block}

  /* ─── Menu view ─── */
  .menu{
    flex:1;
    overflow:auto;
    padding:14px;
  }
  body.playing .menu{display:none}
  .grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
  }
  .card{
    position:relative;
    aspect-ratio:1/1;
    border-radius:12px;
    cursor:pointer;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.06);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 6px 14px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.2);
    z-index:2;
  }
  .card:active{transform:translateY(-1px) scale(1.02)}
  .card .bg{
    position:absolute;inset:0;
    background:linear-gradient(160deg,var(--c1),var(--c2));
    opacity:.92;
  }
  .card:hover .bg{opacity:1}
  .card .inner{
    position:relative;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6px 4px;
    text-align:center;
  }
  .card .emoji{
    font-size:30px;line-height:1;
    margin-bottom:5px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));
  }
  .card .name{
    font-size:10px;font-weight:800;
    letter-spacing:.4px;color:#fff;
    line-height:1.1;
    text-shadow:0 1px 2px rgba(0,0,0,.7);
  }
  .card.live::after{
    content:"LIVE";
    position:absolute;top:4px;right:4px;
    background:#ec4899;color:#fff;
    font-size:8px;font-weight:900;letter-spacing:.5px;
    padding:1.5px 4px;border-radius:3px;
    box-shadow:0 0 6px rgba(236,72,153,.6);
  }

  .ftr{
    margin-top:14px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.07);
    padding-top:10px;
  }
  .ftr a{
    display:inline-block;
    color:#c4b5fd;
    font-size:11px;
    text-decoration:none;
    padding:5px 12px;
    border-radius:6px;
    transition:background .15s;
    cursor:pointer;
  }
  .ftr a:hover{background:rgba(168,85,247,.15);color:#fff}
  .ftr .sep{color:#374151;margin:0 4px}

  /* ─── Game view ─── */
  .game{
    flex:1;
    display:none;
    background:#07070d;
  }
  body.playing .game{display:flex}
  .game iframe{
    flex:1;width:100%;
    border:0;
    background:#07070d;
  }
</style>
</head>
<body>
  <div class="bar">
    <button class="back" id="back" title="Back to games">←</button>
    <div class="title">🎮 Unlimited <span class="g">Games</span></div>
    <div class="game-title" id="gameTitle"></div>
    <button id="newTab" title="Open in new tab">⤢</button>
    <button class="close" id="close" title="Close">×</button>
  </div>

  <div class="menu">
    <div class="grid" id="grid"></div>
    <div class="ftr">
      <a data-action="full">🌐 Full site</a>
      <span class="sep">·</span>
      <a data-action="privacy">Privacy</a>
    </div>
  </div>

  <div class="game">
    <iframe id="gameFrame" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"></iframe>
  </div>

  <script src="popup.js"></script>
</body>
</html>
