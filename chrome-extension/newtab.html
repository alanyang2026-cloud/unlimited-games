<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    min-height:100vh;
    background:#1a1a1a;
    color:#e8eaed;
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:100px 20px 40px;
    background:
      radial-gradient(circle at 20% 10%, rgba(168,85,247,.10), transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(236,72,153,.08), transparent 50%),
      #1a1a1a;
  }

  /* ─── Google-style logo ─── */
  .logo{
    font-size:80px;
    font-weight:400;
    letter-spacing:-2px;
    margin-bottom:26px;
    font-family:"Product Sans",Arial,sans-serif;
    user-select:none;
  }
  .logo .b{color:#4285f4}
  .logo .r{color:#ea4335}
  .logo .y{color:#fbbc04}
  .logo .g{color:#34a853}

  /* ─── Search box ─── */
  .search{
    width:100%;
    max-width:584px;
    display:flex;
    align-items:center;
    height:46px;
    background:#303134;
    border:1px solid transparent;
    border-radius:24px;
    padding:0 18px;
    transition:background .15s, border-color .15s, box-shadow .15s;
  }
  .search:hover, .search:focus-within{
    background:#3c4043;
    box-shadow:0 1px 6px rgba(32,33,36,.28);
  }
  .search svg{flex-shrink:0;fill:#9aa0a6;margin-right:12px}
  .search input{
    flex:1;
    background:transparent;
    border:0;
    outline:0;
    color:#e8eaed;
    font-size:16px;
    font-family:inherit;
  }
  .search-hint{
    color:#5f6368;
    font-size:12px;
    margin-top:14px;
    letter-spacing:.2px;
  }

  /* ─── Game section ─── */
  .games-section{
    margin-top:56px;
    width:100%;
    max-width:820px;
    text-align:center;
  }
  .games-section h2{
    font-size:13px;
    font-weight:500;
    color:#9aa0a6;
    letter-spacing:2px;
    margin-bottom:18px;
    text-transform:uppercase;
  }
  .games-section h2 .badge{
    display:inline-block;
    margin-left:8px;
    padding:2px 8px;
    background:linear-gradient(90deg,#a855f7,#ec4899);
    color:#fff;
    border-radius:10px;
    font-size:10px;
    letter-spacing:1px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    gap:14px;
  }
  @media (max-width:700px){ .grid{grid-template-columns:repeat(4,1fr)} }
  .card{
    position:relative;
    aspect-ratio:1/1;
    border-radius:14px;
    cursor:pointer;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.06);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{
    transform:translateY(-4px) scale(1.06);
    box-shadow:0 8px 20px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.2);
    z-index:2;
  }
  .card .bg{
    position:absolute;inset:0;
    background:linear-gradient(160deg,var(--c1),var(--c2));
    opacity:.92;
  }
  .card:hover .bg{opacity:1}
  .card .inner{
    position:relative;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:8px 4px;
    text-align:center;
  }
  .card .emoji{
    font-size:32px;
    line-height:1;
    margin-bottom:6px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));
  }
  .card .name{
    font-size:10px;
    font-weight:800;
    letter-spacing:.4px;
    color:#fff;
    line-height:1.1;
    text-shadow:0 1px 2px rgba(0,0,0,.7);
  }
  .card.live::after{
    content:"LIVE";
    position:absolute;top:5px;right:5px;
    background:#ec4899;color:#fff;
    font-size:8px;font-weight:900;
    padding:1.5px 5px;border-radius:3px;
    box-shadow:0 0 8px rgba(236,72,153,.6);
  }

  .ftr{
    margin-top:auto;
    padding-top:40px;
    color:#5f6368;
    font-size:11px;
    letter-spacing:.5px;
  }
  .ftr a{color:#9aa0a6;text-decoration:none;margin:0 8px}
  .ftr a:hover{color:#e8eaed}
</style>
</head>
<body>

  <!-- Google-style logo (four coloured letters, purely presentational) -->
  <div class="logo">
    <span class="b">U</span><span class="r">n</span><span class="y">l</span><span class="b">i</span><span class="g">m</span><span class="r">i</span><span class="y">t</span><span class="b">e</span><span class="g">d</span>
  </div>

  <!-- Search box: submits to Google. Enter key = go. -->
  <form class="search" id="searchForm">
    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input id="q" type="text" autofocus autocomplete="off" placeholder="Search Google or type a URL">
  </form>
  <div class="search-hint">Press Enter to search · start typing to play</div>

  <!-- Game grid -->
  <div class="games-section">
    <h2>Pick a game <span class="badge">17 GAMES</span></h2>
    <div class="grid" id="grid"></div>
  </div>

  <div class="ftr">
    <a href="#" id="fullSite">Full site</a> · <a href="#" id="privacy">Privacy</a> · Built in New Zealand 🇳🇿
  </div>

  <script src="newtab.js"></script>
</body>
</html>
