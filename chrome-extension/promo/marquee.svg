<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#a855f7" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="35%" r="35%">
      <stop offset="0%"  stop-color="#ec4899" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="chipShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="chip" overflow="visible">
      <rect x="-56" y="-56" width="112" height="112" rx="18" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.18)"/>
    </symbol>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>
  <rect width="1400" height="560" fill="url(#glow)"/>
  <rect width="1400" height="560" fill="url(#glow2)"/>

  <g fill="#fde047" opacity=".55">
    <circle cx="120"  cy="80"  r="1.5"/>
    <circle cx="1250" cy="100" r="2"/>
    <circle cx="180"  cy="470" r="1.5"/>
    <circle cx="1310" cy="490" r="2.5"/>
    <circle cx="1180" cy="60"  r="1"/>
    <circle cx="60"   cy="300" r="1"/>
    <circle cx="1350" cy="320" r="1.5"/>
    <circle cx="700"  cy="40"  r="1"/>
    <circle cx="820"  cy="520" r="1.5"/>
  </g>

  <g transform="translate(70 180)">
    <text font-family="Impact, 'Arial Black', sans-serif"
          font-size="90" font-weight="900" fill="url(#title)" letter-spacing="2">UNLIMITED</text>
    <text y="90" font-family="Impact, 'Arial Black', sans-serif"
          font-size="90" font-weight="900" fill="url(#title)" letter-spacing="2">GAMES</text>
    <text y="155" font-family="Georgia, serif"
          font-size="26" letter-spacing="3" fill="#fbbf24" opacity=".95">17 FREE GAMES · ONE CLICK</text>
    <text y="192" font-family="Georgia, serif"
          font-size="19" letter-spacing="2" fill="#d8b4fe" opacity=".85">Pick a classic. Start playing. No downloads.</text>
  </g>

  <g transform="translate(920 280)" filter="url(#chipShadow)">
    <g transform="translate(-180 -180)"><use href="#chip"/><text y="18" font-family="Apple Color Emoji, Segoe UI Emoji" font-size="54" text-anchor="middle">🐍</text></g>
    <g transform="translate(0 -180)">   <use href="#chip"/><text y="18" font-family="Apple Color Emoji, Segoe UI Emoji" font-size="54" text-anchor="middle">🔢</text></g>
    <g transform="translate(180 -180)"> <use href="#chip"/><text y="18" font-family="Apple Color Emoji, Segoe UI Emoji" font-size="54" text-anchor="middle">🧱</text></g>
    <g transform="translate(-180 0)">   <use href="#chip"/><text y="18" font-family="Apple Color Emoji, Segoe UI Emoji" font-size="54" text-anchor="middle">💥</text></g>
    <g transform="translate(0 0)">
      <use href="#chip"/>
      <text y="18" font-family="Apple Color Emoji, Segoe UI Emoji" font-size="54" text-anchor="middle">♔</text>
      <g transform="translate(36 -40)">
        <ellipse cx="0" cy="0" rx="24" ry="14" fill="url(#hot)" stroke="#fff" stroke-width="1.5"/>
        <text y="4" font-family="Verdana, sans-serif" font-size="12" font-weight="900" text-anchor="middle" fill="#fff" letter-spacing="1.5">🔥 HOT</text>
      </g>
    </g>
    <g transform="translate(180 0)">   <use href="#chip"/><text y="18" font-family="Apple Color Emoji, Segoe UI Emoji" font-size="54" text-anchor="middle">🃏</text></g>
    <g transform="translate(-180 180)">  <use href="#chip"/><text y="18" font-family="Apple Color Emoji, Segoe UI Emoji" font-size="54" text-anchor="middle">⚰️</text></g>
    <g transform="translate(0 180)">    <use href="#chip"/><text y="18" font-family="Apple Color Emoji, Segoe UI Emoji" font-size="54" text-anchor="middle">💣</text></g>
    <g transform="translate(180 180)">   <use href="#chip"/><text y="18" font-family="Apple Color Emoji, Segoe UI Emoji" font-size="54" text-anchor="middle">⚔️</text></g>
  </g>
</svg>
