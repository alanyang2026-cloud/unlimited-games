<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280">
  <defs>
    <!-- Dark night-blue base with yellow backlight on the right -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="0.55" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#1a1408"/>
    </linearGradient>
    <radialGradient id="yellowGlow" cx="92%" cy="50%" r="55%">
      <stop offset="0" stop-color="#FFD60A" stop-opacity=".55"/>
      <stop offset="0.6" stop-color="#FF8A00" stop-opacity=".15"/>
      <stop offset="1" stop-color="#FFD60A" stop-opacity="0"/>
    </radialGradient>
    <!-- Cyan screen glow lighting the mask from below -->
    <radialGradient id="screenGlow" cx="50%" cy="78%" r="30%">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <!-- Pink/cyan gradient for the brand text -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E88"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <!-- Soft scanline overlay for CRT feel -->
    <pattern id="scan" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="2" fill="rgba(255,255,255,0.025)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="url(#bg)"/>
  <rect width="440" height="280" fill="url(#yellowGlow)"/>

  <!-- Floating pixel game icons in background -->
  <g opacity="0.55">
    <!-- Pixel heart top-left -->
    <g transform="translate(40 50)" fill="#FF2E88">
      <rect x="0"  y="4" width="4" height="4"/><rect x="4"  y="0" width="4" height="4"/>
      <rect x="8"  y="4" width="4" height="4"/><rect x="12" y="0" width="4" height="4"/>
      <rect x="16" y="4" width="4" height="4"/>
      <rect x="0"  y="8" width="20" height="4"/>
      <rect x="4"  y="12" width="12" height="4"/>
      <rect x="8"  y="16" width="4" height="4"/>
    </g>
    <!-- Pixel coin top-right -->
    <g transform="translate(360 40)" fill="#FFD60A">
      <rect x="4" y="0" width="8" height="2"/>
      <rect x="2" y="2" width="12" height="2"/>
      <rect x="0" y="4" width="16" height="8"/>
      <rect x="2" y="12" width="12" height="2"/>
      <rect x="4" y="14" width="8" height="2"/>
      <rect x="6" y="4" width="2" height="8" fill="#854d0e"/>
      <rect x="8" y="4" width="2" height="8" fill="#B45309"/>
    </g>
    <!-- Pixel star right -->
    <g transform="translate(395 130)" fill="#FFD60A">
      <rect x="6"  y="0" width="4" height="4"/>
      <rect x="4"  y="4" width="8" height="4"/>
      <rect x="0"  y="8" width="16" height="4"/>
      <rect x="2"  y="12" width="12" height="4"/>
      <rect x="0"  y="16" width="4" height="4"/><rect x="12" y="16" width="4" height="4"/>
    </g>
    <!-- Pixel invader bottom-left -->
    <g transform="translate(25 190)" fill="#00E5FF">
      <rect x="6"  y="0" width="3" height="3"/><rect x="18" y="0" width="3" height="3"/>
      <rect x="9"  y="3" width="9" height="3"/>
      <rect x="6"  y="6" width="15" height="3"/>
      <rect x="3"  y="9" width="3" height="3"/><rect x="21" y="9" width="3" height="3"/>
      <rect x="9"  y="9" width="3" height="3"/><rect x="15" y="9" width="3" height="3"/>
      <rect x="0"  y="12" width="27" height="3"/>
      <rect x="3"  y="15" width="3" height="3"/><rect x="21" y="15" width="3" height="3"/>
    </g>
    <!-- Pixel D-pad top-right -->
    <g transform="translate(380 200)" fill="#9CA3AF">
      <rect x="6" y="0" width="6" height="6"/>
      <rect x="0" y="6" width="18" height="6"/>
      <rect x="6" y="12" width="6" height="6"/>
    </g>
  </g>

  <!-- Hooded figure silhouette -->
  <g transform="translate(220 155)">
    <!-- Hood (big rounded dome + cowl sides) -->
    <path d="M -56 -40
             C -56 -78  -28 -96  0 -96
             C  28 -96   56 -78   56 -40
             L  56  40
             L -56  40 Z"
          fill="#0d1221" stroke="#1a2440" stroke-width="2"/>
    <!-- Inner hood shadow -->
    <path d="M -42 -32
             C -42 -64  -18 -78  0 -78
             C  18 -78   42 -64   42 -32
             L  42  10
             L -42  10 Z"
          fill="#060912"/>

    <!-- Mask — custom pixel face (NOT Guy Fawkes). Simple rounded rect + glowing square eyes -->
    <g>
      <!-- Soft cyan glow spill from laptop up onto face -->
      <circle cx="0" cy="-15" r="32" fill="url(#screenGlow)"/>
      <!-- Mask plate -->
      <rect x="-28" y="-40" width="56" height="52" rx="6" fill="#E5E7EB" stroke="#1a1a2e" stroke-width="2.5"/>
      <!-- Pixel eye slots (glowing blue) -->
      <rect x="-20" y="-28" width="14" height="10" fill="#0A0E1A"/>
      <rect x="  6" y="-28" width="14" height="10" fill="#0A0E1A"/>
      <!-- Glowing pupils -->
      <rect x="-16" y="-26" width="6" height="6" fill="#00E5FF"/>
      <rect x=" 10" y="-26" width="6" height="6" fill="#00E5FF"/>
      <!-- Outer glow dots -->
      <rect x="-19" y="-25" width="12" height="4" fill="#00E5FF" opacity="0.35"/>
      <rect x="  7" y="-25" width="12" height="4" fill="#00E5FF" opacity="0.35"/>
      <!-- Pixel smirk -->
      <rect x="-8"  y="-2" width="4" height="4" fill="#0A0E1A"/>
      <rect x="-4"  y="2"  width="4" height="4" fill="#0A0E1A"/>
      <rect x=" 0"  y="2"  width="4" height="4" fill="#0A0E1A"/>
      <rect x=" 4"  y="-2" width="4" height="4" fill="#0A0E1A"/>
    </g>

    <!-- Laptop — angled, screen glowing cyan -->
    <g transform="translate(0 72)">
      <!-- Base -->
      <path d="M -72 10 L 72 10 L 86 22 L -86 22 Z" fill="#1F2937" stroke="#0F172A" stroke-width="1.5"/>
      <!-- Screen -->
      <path d="M -60 10 L 60 10 L 60 -20 L -60 -20 Z" fill="#0F172A" stroke="#1F2937" stroke-width="2"/>
      <!-- Screen content: tiny pixel heart + arrow keys hint = playing a game -->
      <rect x="-50" y="-16" width="100" height="22" fill="#00252e"/>
      <g transform="translate(-8 -10)" fill="#FF2E88">
        <rect x="0" y="2" width="2" height="2"/><rect x="2" y="0" width="2" height="2"/>
        <rect x="4" y="2" width="2" height="2"/><rect x="6" y="0" width="2" height="2"/>
        <rect x="8" y="2" width="2" height="2"/>
        <rect x="0" y="4" width="10" height="2"/>
        <rect x="2" y="6" width="6" height="2"/>
        <rect x="4" y="8" width="2" height="2"/>
      </g>
      <!-- "SCORE" text -->
      <text x="-45" y="2" font-family="monospace" font-size="6" fill="#00E5FF">SCORE 1337</text>
      <!-- Keyboard hint -->
      <rect x="-58" y="12" width="116" height="7" fill="#374151"/>
    </g>
  </g>

  <!-- Scanline overlay subtle -->
  <rect width="440" height="280" fill="url(#scan)"/>

  <!-- Brand text -->
  <text x="220" y="246" font-family="'Press Start 2P','Courier New',monospace"
        font-size="20" font-weight="900" text-anchor="middle" fill="url(#brand)" letter-spacing="2">
    GEEK GAMES
  </text>
  <text x="220" y="266" font-family="'Courier New',monospace"
        font-size="9" letter-spacing="6" text-anchor="middle" fill="#FFD60A" opacity="0.9">
    ★ FREE  ·  NO ADS  ·  NO SIGN-UP ★
  </text>
</svg>
