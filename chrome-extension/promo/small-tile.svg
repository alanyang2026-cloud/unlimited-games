<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%"  stop-color="#a855f7" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="lift">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="440" height="280" fill="url(#bg)"/>
  <rect width="440" height="280" fill="url(#glow)"/>

  <!-- Scattered stars -->
  <g fill="#fde047" opacity=".7">
    <circle cx="40"  cy="42"  r="1.5"/>
    <circle cx="395" cy="60"  r="2"/>
    <circle cx="60"  cy="220" r="1.5"/>
    <circle cx="410" cy="235" r="2.5"/>
    <circle cx="380" cy="195" r="1"/>
    <circle cx="30"  cy="160" r="1"/>
  </g>

  <!-- Row of game-emoji chips showing the variety -->
  <g font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif" font-size="30" text-anchor="middle" filter="url(#lift)">
    <text x="90"  y="110">🐍</text>
    <text x="155" y="110">🔢</text>
    <text x="220" y="110">🧱</text>
    <text x="285" y="110">♔</text>
    <text x="350" y="110">💣</text>
  </g>

  <!-- Hot badge floating above the middle chip -->
  <g transform="translate(220 72)">
    <ellipse cx="0" cy="0" rx="22" ry="12" fill="url(#hot)"/>
    <text x="0" y="4" font-family="Verdana, sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#fff" letter-spacing="1.5">🔥 HOT</text>
  </g>

  <!-- Big number "17" in gradient -->
  <text x="220" y="196" font-family="Impact, 'Arial Black', sans-serif"
        font-size="60" font-weight="900" text-anchor="middle" fill="url(#title)" letter-spacing="2">17 GAMES</text>

  <!-- Tagline -->
  <text x="220" y="228" font-family="Georgia, serif"
        font-size="14" letter-spacing="2" text-anchor="middle" fill="#fbbf24" opacity=".95">
    ONE CLICK · NO DOWNLOADS
  </text>
  <text x="220" y="255" font-family="Georgia, serif"
        font-size="13" letter-spacing="3" text-anchor="middle" fill="#c4b5fd" opacity=".9">
    UNLIMITED GAMES
  </text>
</svg>
