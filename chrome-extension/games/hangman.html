<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hangman</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* Old-west wanted-poster aesthetic — parchment on dark wood */
body{background:
  radial-gradient(ellipse at top,#3a2615 0%,#1a1008 70%,#0a0603 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;
  font-family:'Georgia','Times New Roman',serif;user-select:none;color:#fef3c7;padding:20px 12px 40px;gap:12px;overflow-x:hidden}
h1{color:#fde68a;font-size:1.9rem;font-weight:900;text-shadow:0 2px 0 #78350f,0 0 20px rgba(251,191,36,.3);letter-spacing:.08em;margin-top:28px}
.top{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.box{background:rgba(0,0,0,.35);border:1px solid rgba(251,191,36,.35);border-radius:8px;padding:6px 14px;text-align:center;backdrop-filter:blur(4px);min-width:62px}
.box .lbl{font-size:10px;color:#fde68a;text-transform:uppercase;letter-spacing:.15em}
.box .val{font-size:18px;font-weight:800;color:#fbbf24}
.diff{display:flex;gap:6px}
.diff button{background:rgba(0,0,0,.3);color:#fde68a;border:1px solid rgba(251,191,36,.3);padding:5px 12px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.08em;transition:.15s;text-transform:uppercase}
.diff button.active{background:linear-gradient(180deg,#fbbf24,#d97706);color:#4a2510;border-color:#78350f}
.diff button:hover:not(.active){background:rgba(120,53,15,.5)}

/* Parchment paper that holds the gallows + word */
.sheet{background:
  linear-gradient(180deg,#fefce8,#f5e6c8);
  border:2px solid #78350f;
  border-radius:4px;
  padding:16px 20px;
  box-shadow:
    0 8px 30px rgba(0,0,0,.6),
    inset 0 0 0 4px #e5d3ac,
    inset 0 0 60px rgba(120,53,15,.08);
  max-width:360px;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  color:#4a3618;position:relative}
.sheet::before,.sheet::after{content:"";position:absolute;width:24px;height:24px;background:
  radial-gradient(circle,#78350f 20%,transparent 60%);opacity:.55;border-radius:50%}
.sheet::before{top:4px;left:4px}
.sheet::after{bottom:4px;right:4px}

canvas{display:block;background:transparent}

.word{font-family:'Courier New',monospace;font-size:28px;font-weight:900;letter-spacing:.22em;color:#4a3618;text-align:center;min-height:36px;line-height:1.4;word-spacing:4px}
.hint{font-size:12px;color:#78350f;font-style:italic;text-align:center;letter-spacing:.05em}
.wrong-letters{font-family:'Courier New',monospace;font-size:14px;color:#991b1b;letter-spacing:.2em;min-height:18px;font-weight:800}

/* QWERTY key pad */
.kbd{display:flex;flex-direction:column;gap:5px;align-items:center;margin-top:4px}
.kbd-row{display:flex;gap:4px}
.key{background:linear-gradient(180deg,#fef9c3,#fde68a);border:1px solid #78350f;color:#4a2510;
  min-width:28px;height:34px;padding:0 6px;border-radius:5px;cursor:pointer;
  font-family:'Courier New',monospace;font-weight:900;font-size:15px;transition:.1s;
  box-shadow:0 2px 0 #78350f}
.key:hover:not(.used):not(:disabled){background:linear-gradient(180deg,#fef08a,#fbbf24);transform:translateY(-1px)}
.key:active:not(.used):not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 #78350f}
.key.used{opacity:.3;cursor:not-allowed;box-shadow:none}
.key.good{background:linear-gradient(180deg,#86efac,#22c55e);color:#052e16;border-color:#15803d}
.key.bad{background:linear-gradient(180deg,#fca5a5,#ef4444);color:#450a0a;border-color:#7f1d1d}

.btn{background:linear-gradient(180deg,#fbbf24,#d97706);color:#4a2510;border:1px solid #78350f;
  padding:10px 24px;border-radius:8px;font-weight:900;cursor:pointer;font-size:13px;
  transition:.15s;letter-spacing:.12em;text-transform:uppercase;font-family:inherit;box-shadow:0 3px 0 #78350f;margin-top:4px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #78350f,0 0 14px rgba(251,191,36,.5)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #78350f}

.ov{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(58,38,21,.96),rgba(10,6,3,.99));display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:1000;padding:20px}
.ov.show{display:flex}
.ov h2{font-size:2.4rem;color:#fbbf24;text-shadow:0 2px 0 #78350f,0 0 22px rgba(251,191,36,.5);letter-spacing:.06em}
.ov h2.lose{color:#f87171;text-shadow:0 2px 0 #7f1d1d,0 0 22px rgba(248,113,113,.4)}
.ov p{color:#fde68a;font-size:15px;text-align:center}
.ov .word-reveal{font-family:'Courier New',monospace;font-size:22px;letter-spacing:.2em;color:#fef3c7;background:rgba(0,0,0,.4);padding:8px 16px;border-radius:6px;border:1px solid rgba(251,191,36,.3)}

.hbtn{position:fixed;top:12px;left:12px;z-index:999;background:rgba(0,0,0,.55);color:#fde68a;text-decoration:none;padding:6px 14px;border-radius:20px;font-size:13px;font-family:'Georgia',serif;backdrop-filter:blur(8px);border:1px solid rgba(251,191,36,.35);transition:.2s}
.hbtn:hover{background:rgba(120,53,15,.7);color:#fef3c7}

@media (max-width:420px){
  .key{min-width:24px;height:30px;padding:0 4px;font-size:13px}
  .word{font-size:22px;letter-spacing:.18em}
  h1{font-size:1.5rem}
}
</style>
</head>
<body>
<a href="/" class="hbtn">← Games</a>
<h1>⚰️ Hangman</h1>

<div class="top">
  <div class="box"><div class="lbl">Score</div><div class="val" id="sc">0</div></div>
  <div class="box"><div class="lbl">Streak</div><div class="val" id="st">0</div></div>
  <div class="box"><div class="lbl">Best</div><div class="val" id="bst">0</div></div>
</div>

<div class="diff" id="diff">
  <button data-d="easy" class="active">Easy</button>
  <button data-d="normal">Normal</button>
  <button data-d="hard">Hard</button>
</div>

<div class="sheet">
  <canvas id="gal" width="220" height="200"></canvas>
  <div class="hint" id="hint">Category: Animal</div>
  <div class="word" id="word">_ _ _</div>
  <div class="wrong-letters" id="wrong"></div>
</div>

<div class="kbd" id="kbd"></div>
<button class="btn" data-h="newRound()">New Word</button>

<div class="ov" id="ov">
  <h2 id="ov-title">Nice Work!</h2>
  <p id="ov-msg">You cracked it in 3 guesses.</p>
  <div class="word-reveal" id="ov-word">E X A M P L E</div>
  <button class="btn" data-h="hideOv();newRound()">Next Word</button>
</div>

<script src="_esc-back.js"></script>
<script src="hangman.js"></script>
</body>
</html>
