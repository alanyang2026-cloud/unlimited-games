<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blocks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* NES / arcade look — dark blue chassis, red HUD readouts, pixel feel */
body{background:linear-gradient(180deg,#0a1e3a 0%,#050b1a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Press Start 2P','Courier New',monospace;user-select:none;color:#fef3c7}
h1{color:#fbbf24;font-size:1.8rem;font-weight:900;text-shadow:2px 2px 0 #ef4444,4px 4px 0 rgba(0,0,0,.5);margin-bottom:10px;letter-spacing:.1em;font-family:'Courier New',monospace}
.game{display:flex;gap:16px;align-items:flex-start}
canvas{border-radius:4px;border:4px solid #fbbf24;display:block;background:#0a1e3a;box-shadow:0 0 0 2px #0a1e3a,0 0 0 6px #ef4444,0 8px 20px rgba(0,0,0,.5)}
.side{display:flex;flex-direction:column;gap:10px;min-width:100px}
.panel{background:#050b1a;border:2px solid #fbbf24;border-radius:4px;padding:10px 14px;box-shadow:inset 0 0 8px rgba(0,0,0,.5)}
.panel .lbl{font-size:10px;color:#fbbf24;text-transform:uppercase;letter-spacing:.15em;margin-bottom:4px;font-family:inherit}
.panel .val{font-size:20px;font-weight:900;color:#ef4444;font-family:'Courier New',monospace;text-shadow:0 0 8px rgba(239,68,68,.6)}
.btn{background:#ef4444;color:#fff;border:2px solid #fbbf24;padding:9px 0;border-radius:4px;font-weight:900;cursor:pointer;font-size:12px;width:100%;transition:.15s;letter-spacing:.15em;text-transform:uppercase;font-family:inherit}
.btn:hover{background:#dc2626;transform:translateY(-1px);box-shadow:0 3px 0 rgba(0,0,0,.5)}
.hint{color:#fde047;font-size:13px;margin-top:10px;text-align:center;line-height:1.6;letter-spacing:.05em;font-family:inherit}
.ov{position:fixed;inset:0;background:rgba(10,30,58,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.ov h2{font-size:2rem;color:#ef4444;letter-spacing:.15em;text-shadow:2px 2px 0 #fbbf24}
.ov p{color:#fde047;font-size:15px}
.ov .btn2{background:#ef4444;color:#fff;border:2px solid #fbbf24;padding:11px 30px;border-radius:4px;font-size:14px;font-weight:900;cursor:pointer;letter-spacing:.15em;text-transform:uppercase;font-family:inherit}
.hbtn{position:fixed;top:12px;left:12px;z-index:999;background:rgba(5,11,26,.85);color:#fbbf24;text-decoration:none;padding:6px 14px;border-radius:20px;font-size:13px;font-family:inherit;backdrop-filter:blur(8px);border:1px solid #fbbf24;transition:.2s;letter-spacing:.1em}
.hbtn:hover{background:#ef4444;color:#fff}
</style>
</head>
<body>
<a href="/" class="hbtn">← Games</a>
<h1>🧱 Blocks</h1>
<div class="game">
  <canvas id="c" width="200" height="400"></canvas>
  <div class="side">
    <div class="panel"><div class="lbl">Score</div><div class="val" id="sc">0</div></div>
    <div class="panel"><div class="lbl">Level</div><div class="val" id="lv">1</div></div>
    <div class="panel"><div class="lbl">Lines</div><div class="val" id="ln">0</div></div>
    <div class="panel">
      <div class="lbl">Next</div>
      <canvas id="next" width="80" height="80"></canvas>
    </div>
    <button class="btn" id="startbtn" data-h="startGame()">Play</button>
  </div>
</div>
<p class="hint">← → Move &nbsp; ↑ Rotate<br>↓ Soft Drop &nbsp; Space Hard Drop</p>
<div class="ov" id="ov">
  <h2>Game Over</h2>
  <p>Score: <b id="ov-sc" style="color:#fbbf24"></b></p>
  <button class="btn2" data-h="startGame();document.getElementById('ov').style.display='none'">Play Again</button>
</div>
<script src="tetris.js"></script>
<script src="_esc-back.js"></script>
</body>
</html>
