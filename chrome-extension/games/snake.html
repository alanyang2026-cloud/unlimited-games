<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* Vintage CRT terminal — green-on-black, everything glows softly */
body{background:#020f04;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Courier New','Menlo',monospace;overflow:hidden;user-select:none;color:#4ade80}
.ui{color:#86efac;margin-bottom:12px;display:flex;gap:24px;font-size:15px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.ui span{color:#4ade80;text-shadow:0 0 8px rgba(74,222,128,.7)}
.wrap{position:relative}
canvas{display:block;border-radius:12px;border:2px solid #14532d;box-shadow:0 0 30px rgba(34,197,94,.15) inset,0 0 20px rgba(34,197,94,.25)}
.ov{position:absolute;inset:0;background:rgba(2,15,4,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;gap:10px}
.ov h2{font-size:2rem;color:#4ade80;text-shadow:0 0 20px rgba(74,222,128,.7);letter-spacing:.15em}
.ov p{color:#86efac;font-size:14px;letter-spacing:.1em}
.ov .big{font-size:18px;color:#bbf7d0}
.ov .big b{color:#4ade80;text-shadow:0 0 10px rgba(74,222,128,.6)}
.btn{background:#166534;color:#dcfce7;border:1px solid #22c55e;padding:10px 30px;border-radius:6px;font-size:14px;font-weight:700;font-family:inherit;letter-spacing:.15em;cursor:pointer;margin-top:6px;transition:.15s;text-transform:uppercase}
.btn:hover{background:#15803d;box-shadow:0 0 16px rgba(34,197,94,.5);transform:translateY(-1px)}
.hint{color:#4d7c0f;font-size:13px;margin-top:8px;letter-spacing:.15em;text-transform:uppercase;font-family:inherit}
.hbtn{position:fixed;top:12px;left:12px;z-index:999;background:rgba(2,15,4,.7);color:#86efac;text-decoration:none;padding:6px 14px;border-radius:20px;font-size:13px;font-family:inherit;backdrop-filter:blur(8px);border:1px solid rgba(74,222,128,.3);transition:.2s;letter-spacing:.1em}
.hbtn:hover{background:rgba(21,128,61,.6);color:#dcfce7}
</style>
</head>
<body>
<a href="/" class="hbtn">← Games</a>
<div class="ui">Score: <span id="sc">0</span>&nbsp;&nbsp;Best: <span id="bst">0</span></div>
<div class="wrap">
  <canvas id="c"></canvas>
  <div class="ov" id="ov">
    <h2>🐍 Snake</h2>
    <p>Arrow keys / WASD to move</p>
    <button class="btn" data-h="start()">Play Now</button>
  </div>
</div>
<p class="hint">Arrow keys · WASD · Swipe on mobile</p>
<script src="snake.js"></script>
<script src="_esc-back.js"></script>
</body>
</html>
