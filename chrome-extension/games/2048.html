<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* Warm-wood tile puzzle — cream board, natural tile progression */
body{background:linear-gradient(180deg,#f5e6c8 0%,#e5d3ac 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Georgia','Times New Roman',serif;user-select:none;color:#4a3618}
h1{color:#7c5220;font-size:2.8rem;font-weight:900;letter-spacing:-.02em;margin-bottom:8px;text-shadow:0 1px 0 #f5e6c8}
.top{display:flex;gap:12px;margin-bottom:14px;align-items:center}
.sbox{background:#b89968;border:1px solid #8b7048;border-radius:6px;padding:6px 16px;text-align:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.sbox .lbl{font-size:10px;color:#f5e6c8;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.sbox .val{font-size:20px;font-weight:900;color:#fff;font-family:'Georgia',serif}
.new-btn{background:#7c5220;color:#f5e6c8;border:none;padding:8px 20px;border-radius:6px;font-weight:900;cursor:pointer;font-size:13px;transition:.15s;letter-spacing:.1em;text-transform:uppercase;font-family:inherit;box-shadow:0 2px 0 #4a3618}
.new-btn:hover{background:#4a3618;transform:translateY(-1px);box-shadow:0 3px 0 #2a1e0e}
.new-btn:active{transform:translateY(1px);box-shadow:0 1px 0 #4a3618}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#b89968;border:3px solid #8b7048;padding:12px;border-radius:8px;width:340px;box-shadow:0 6px 0 #8b7048,0 8px 20px rgba(0,0,0,.2)}
.cell{width:72px;height:72px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:32px;transition:all .1s;background:rgba(139,112,72,.35);color:#4a3618;font-family:'Georgia',serif}
/* Tile progression — warm cream → gold → orange → red → jewel tones */
.c2   {background:#eee4da;color:#4a3618;font-size:32px}
.c4   {background:#ede0c8;color:#4a3618;font-size:32px}
.c8   {background:#f2b179;color:#fff;font-size:32px}
.c16  {background:#f59563;color:#fff;font-size:28px}
.c32  {background:#f67c5f;color:#fff;font-size:28px}
.c64  {background:#f65e3b;color:#fff;font-size:28px}
.c128 {background:#edcf72;color:#fff;font-size:24px;box-shadow:inset 0 0 12px rgba(255,255,255,.35)}
.c256 {background:#edcc61;color:#fff;font-size:24px;box-shadow:inset 0 0 14px rgba(255,255,255,.4)}
.c512 {background:#edc850;color:#fff;font-size:24px;box-shadow:inset 0 0 18px rgba(255,255,255,.45)}
.c1024{background:#edc53f;color:#fff;font-size:20px;box-shadow:inset 0 0 22px rgba(255,255,255,.5)}
.c2048{background:#edc22e;color:#fff;font-size:20px;box-shadow:0 0 24px rgba(237,194,46,.7),inset 0 0 24px rgba(255,255,255,.5)}
.pop{animation:pop .15s ease-out}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.ov{position:fixed;inset:0;background:rgba(245,230,200,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.ov h2{font-size:2.2rem;color:#7c5220}
.ov p{color:#4a3618;font-size:15px}
.ov .btn{background:#7c5220;color:#f5e6c8;border:none;padding:12px 32px;border-radius:6px;font-size:15px;font-weight:900;cursor:pointer;letter-spacing:.15em;text-transform:uppercase;font-family:inherit;box-shadow:0 3px 0 #4a3618}
.hint{color:#8b7048;font-size:14px;margin-top:10px;font-style:italic}
.hbtn{position:fixed;top:12px;left:12px;z-index:999;background:rgba(74,54,24,.85);color:#f5e6c8;text-decoration:none;padding:6px 14px;border-radius:20px;font-size:13px;font-family:'Georgia',serif;backdrop-filter:blur(8px);border:1px solid #8b7048;transition:.2s}
.hbtn:hover{background:#4a3618}
</style>
</head>
<body>
<a href="/" class="hbtn">← Games</a>
<h1>2048</h1>
<div class="top">
  <div class="sbox"><div class="lbl">Score</div><div class="val" id="sc">0</div></div>
  <div class="sbox"><div class="lbl">Best</div><div class="val" id="bst">0</div></div>
  <button class="new-btn" data-h="init()">New Game</button>
</div>
<div id="board"></div>
<p class="hint">Arrow keys / WASD · Swipe on mobile</p>
<div class="ov" id="ov">
  <h2 id="ov-title">Game Over!</h2>
  <p>Score: <b id="ov-sc" style="color:#7c5220"></b></p>
  <button class="btn" data-h="init();document.getElementById('ov').style.display='none'">Play Again</button>
</div>
<script src="2048.js"></script>
<script src="_esc-back.js"></script>
</body>
</html>
