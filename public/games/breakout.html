<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brick Buster</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* 80s synthwave arcade — magenta / cyan neon on deep purple grid */
body{background:radial-gradient(ellipse at bottom,#4a1063 0%,#180529 60%,#08020f 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Courier New','Menlo',monospace;user-select:none;overflow:hidden;color:#f0abfc}
canvas{border-radius:8px;border:2px solid #ec4899;display:block;cursor:none;box-shadow:0 0 30px rgba(236,72,153,.4),0 0 60px rgba(168,85,247,.3),inset 0 0 40px rgba(236,72,153,.1)}
.hint{color:#c4b5fd;font-size:14px;margin-top:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;text-shadow:0 0 8px rgba(196,181,253,.6)}
.hbtn{position:fixed;top:12px;left:12px;z-index:999;background:rgba(24,5,41,.75);color:#f0abfc;text-decoration:none;padding:6px 14px;border-radius:20px;font-size:13px;font-family:'Courier New',monospace;backdrop-filter:blur(8px);border:1px solid rgba(236,72,153,.5);transition:.2s;letter-spacing:.1em}
.hbtn:hover{background:rgba(236,72,153,.4);color:#fff;box-shadow:0 0 12px rgba(236,72,153,.5)}
</style>
</head>
<body>
<a href="/" class="hbtn">← Games</a>
<canvas id="c"></canvas>
<p class="hint">Mouse / Touch to move paddle · Space to launch</p>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
C.width=400;C.height=500;
const W=C.width,H=C.height;

const ROWS=6,COLS=8,BRICK_W=42,BRICK_H=18,BRICK_PAD=4,BRICK_TOP=50;
const PAD_W=80,PAD_H=12,PAD_Y=H-40,BALL_R=8;

// Synthwave brick palette — magenta to cyan through purple/pink
const COLORS=['#ec4899','#d946ef','#a855f7','#8b5cf6','#3b82f6','#06b6d4'];

let bricks, balls, pad, score, lives, state, particles, drops, buffs;

function init(){
  bricks=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=c*(BRICK_W+BRICK_PAD)+((W-(COLS*(BRICK_W+BRICK_PAD)-BRICK_PAD))/2);
    // Distribute brick types by row:
    //   top row (r=0) : tough (2 hp, shows crack once hit)
    //   every ~7th   : power (drops a random buff when broken)
    //   rest         : normal (1 hp)
    let hp = 1, kind = 'normal';
    if(r === 0) { hp = 2; kind = 'tough'; }
    else if((r*COLS + c) % 7 === 3) { kind = 'power'; }
    bricks.push({x,y:BRICK_TOP+r*(BRICK_H+BRICK_PAD),w:BRICK_W,h:BRICK_H,color:COLORS[r%COLORS.length],alive:true,hp,kind});
  }
  pad={x:W/2-PAD_W/2,w:PAD_W};
  // `balls` is now an array so multi-ball power-up can add more.
  balls=[{x:W/2,y:PAD_Y-BALL_R-2,vx:0,vy:0,launched:false}];
  score=0;lives=3;particles=[];drops=[];buffs={wide:0,laser:0};state='ready';
}
// Convenience — legacy `ball` refers to the "primary" ball for
// launch/aim handling (the one that follows the paddle).
Object.defineProperty(window, 'ball', { get: () => balls[0] });

function launch(){
  if(!ball.launched){ball.vx=3*(Math.random()>.5?1:-1);ball.vy=-5;ball.launched=true;state='play'}
}

function spawnParticles(x,y,color){
  for(let i=0;i<8;i++)particles.push({x,y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:1,color,r:Math.random()*4+2});
}

function update(){
  if(state!=='play')return;
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=0.04});
  particles=particles.filter(p=>p.life>0);

  // Tick down active buffs
  if(buffs.wide  > 0) buffs.wide--;
  if(buffs.laser > 0) buffs.laser--;
  const padW = buffs.wide > 0 ? PAD_W * 1.5 : PAD_W;
  pad.w = padW;

  // Drops fall toward paddle; caught = apply buff
  for(const d of drops){
    d.y += 2.2;
    if(d.y > PAD_Y && d.y < PAD_Y + PAD_H + 10 && d.x > pad.x && d.x < pad.x + pad.w){
      d.caught = true;
      if(d.type === 'wide') buffs.wide = 60 * 10;
      else if(d.type === 'laser') buffs.laser = 60 * 10;
      else if(d.type === 'multi'){
        // Duplicate every currently-live ball with mirrored velocities
        const live = balls.filter(b => b.launched);
        for(const b of live){
          balls.push({ x: b.x, y: b.y, vx: -b.vx * 0.9, vy: b.vy, launched: true });
          balls.push({ x: b.x, y: b.y, vx:  b.vx * 0.5, vy: -Math.abs(b.vy), launched: true });
        }
      }
      spawnParticles(d.x, d.y, '#fbbf24');
      score += 20;
    }
  }
  drops = drops.filter(d => !d.caught && d.y < H + 20);

  // Move + resolve every ball
  const primary = balls[0];
  if(!primary.launched){ primary.x = pad.x + pad.w/2; }
  for(const b of balls){
    if(!b.launched) continue;
    b.x += b.vx; b.y += b.vy;
    if(b.x - BALL_R < 0){ b.x = BALL_R; b.vx *= -1; }
    if(b.x + BALL_R > W){ b.x = W - BALL_R; b.vx *= -1; }
    if(b.y - BALL_R < 0){ b.y = BALL_R; b.vy *= -1; }
    // Paddle
    if(b.vy > 0 && b.y + BALL_R >= PAD_Y && b.y + BALL_R <= PAD_Y + PAD_H && b.x > pad.x && b.x < pad.x + pad.w){
      b.vy = -(Math.abs(b.vy) + 0.05);
      b.vx += ((b.x - (pad.x + pad.w/2)) / (pad.w/2)) * 2;
      b.vx = Math.max(-6, Math.min(6, b.vx));
      spawnParticles(b.x, PAD_Y, '#a855f7');
    }
    // Bricks — deal 1 damage; break at 0 hp
    for(const brick of bricks){
      if(!brick.alive) continue;
      if(b.x + BALL_R > brick.x && b.x - BALL_R < brick.x + brick.w && b.y + BALL_R > brick.y && b.y - BALL_R < brick.y + brick.h){
        brick.hp--;
        if(brick.hp <= 0){
          brick.alive = false;
          score += brick.kind === 'tough' ? 25 : 10;
          spawnParticles(brick.x + brick.w/2, brick.y + brick.h/2, brick.color);
          if(brick.kind === 'power'){
            const type = ['wide','laser','multi'][Math.floor(Math.random()*3)];
            drops.push({ x: brick.x + brick.w/2, y: brick.y + brick.h/2, type });
          }
        } else {
          score += 5;      // partial damage bonus for tough bricks
        }
        const fromTop = b.y - BALL_R < brick.y || b.y + BALL_R > brick.y + brick.h;
        if(fromTop) b.vy *= -1; else b.vx *= -1;
        break;
      }
    }
  }
  // Cull balls that fall off the bottom (each one costs a life
  // ONLY if it was the last remaining ball).
  balls = balls.filter(b => b.y - BALL_R <= H);
  if(balls.length === 0){
    lives--;
    if(lives <= 0){ state = 'dead'; return; }
    // Reset with a fresh primary ball
    balls = [{ x: pad.x + pad.w/2, y: PAD_Y - BALL_R - 2, vx: 0, vy: 0, launched: false }];
  }
  if(bricks.every(b => !b.alive)) state = 'win';
}

function draw(){
  // Deep synthwave sky — purple bottom fading up into black
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#08020f');sky.addColorStop(0.7,'#180529');sky.addColorStop(1,'#4a1063');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // Neon horizon grid
  ctx.strokeStyle='rgba(236,72,153,0.15)';ctx.lineWidth=1;
  for(let y=H*0.65;y<H;y+=14){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }
  for(let x=0;x<=W;x+=32){ ctx.beginPath();ctx.moveTo(x,H*0.65);ctx.lineTo(W/2 + (x-W/2)*2, H);ctx.stroke(); }
  // Star specks
  ctx.fillStyle='rgba(196,181,253,0.5)';
  [[30,20],[100,15],[200,25],[310,10],[380,30],[60,80],[280,60]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill()});
  // bricks — tough bricks show a bright outline while at full hp,
  // and a dark crack overlay after taking the first hit.
  bricks.forEach(b=>{
    if(!b.alive)return;
    ctx.fillStyle=b.color;ctx.shadowBlur=6;ctx.shadowColor=b.color;
    ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,4);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(b.x+2,b.y+2,b.w-4,4);
    if(b.kind==='tough' && b.hp===2){
      ctx.strokeStyle='#fef3c7';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.roundRect(b.x+1,b.y+1,b.w-2,b.h-2,3);ctx.stroke();
    } else if(b.kind==='tough' && b.hp===1){
      ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(b.x+b.w*.25,b.y+2);
      ctx.lineTo(b.x+b.w*.4,b.y+b.h*.55);
      ctx.lineTo(b.x+b.w*.7,b.y+b.h*.35);
      ctx.lineTo(b.x+b.w*.85,b.y+b.h-2);
      ctx.stroke();
    }
    if(b.kind==='power'){
      // Tiny star to signal a drop lives inside
      ctx.fillStyle='#fef3c7';ctx.font='bold 12px "Courier New",monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('★', b.x + b.w/2, b.y + b.h/2 + 1);
      ctx.textBaseline='alphabetic';
    }
  });
  // drops — falling power-up capsules
  drops.forEach(d=>{
    const color = d.type==='wide' ? '#22d3ee' : d.type==='laser' ? '#ef4444' : '#fbbf24';
    ctx.fillStyle=color;ctx.shadowBlur=10;ctx.shadowColor=color;
    ctx.beginPath();ctx.roundRect(d.x-10,d.y-6,20,12,4);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#08020f';ctx.font='bold 9px "Courier New",monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(d.type==='wide'?'W':d.type==='laser'?'L':'M', d.x, d.y+1);
    ctx.textBaseline='alphabetic';
  });
  // particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });
  // paddle — hot cyan neon bar (wider when the wide buff is active)
  const pg=ctx.createLinearGradient(pad.x,PAD_Y,pad.x+pad.w,PAD_Y);
  pg.addColorStop(0,'#06b6d4');pg.addColorStop(1,'#22d3ee');
  ctx.fillStyle=pg;ctx.shadowBlur=14;ctx.shadowColor='#22d3ee';
  ctx.beginPath();ctx.roundRect(pad.x,PAD_Y,pad.w,PAD_H,6);ctx.fill();
  ctx.shadowBlur=0;
  // Laser turrets on the paddle when laser buff is active
  if(buffs.laser>0){
    ctx.fillStyle='#ef4444';ctx.shadowBlur=8;ctx.shadowColor='#ef4444';
    ctx.fillRect(pad.x+4, PAD_Y-4, 4, 6);
    ctx.fillRect(pad.x+pad.w-8, PAD_Y-4, 4, 6);
    ctx.shadowBlur=0;
  }
  // balls — hot pink core, white glow (render every live ball)
  ctx.fillStyle='#f0abfc';ctx.shadowBlur=18;ctx.shadowColor='#ec4899';
  for(const b of balls){
    ctx.beginPath();ctx.arc(b.x,b.y,BALL_R,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;
  // HUD
  ctx.fillStyle='#f0abfc';ctx.font='bold 14px "Courier New",monospace';ctx.textAlign='left';
  ctx.fillText(`SCORE: ${score}`,10,20);
  ctx.textAlign='right';ctx.fillText('❤️'.repeat(lives),W-10,20);
  // Buff timers (bottom-left)
  ctx.textAlign='left';ctx.font='bold 11px "Courier New",monospace';
  let by = H - 8;
  if(buffs.wide > 0){ ctx.fillStyle='#22d3ee'; ctx.fillText(`WIDE ${Math.ceil(buffs.wide/60)}s`, 10, by); by -= 14; }
  if(buffs.laser > 0){ ctx.fillStyle='#ef4444'; ctx.fillText(`LASER ${Math.ceil(buffs.laser/60)}s`, 10, by); by -= 14; }
  if(balls.length > 1){ ctx.fillStyle='#fbbf24'; ctx.fillText(`×${balls.length} BALLS`, 10, by); }
  // overlays
  if(state==='ready'){overlay('🧱 BRICK BUSTER','Click or Space to launch')}
  if(state==='win'){overlay('🎉 YOU WIN!',`Score: ${score} · Click to play again`)}
  if(state==='dead'){overlay('💀 GAME OVER',`Score: ${score} · Click to play again`)}
}

function overlay(title,sub){
  ctx.fillStyle='rgba(8,2,15,.85)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ec4899';ctx.shadowBlur=18;ctx.shadowColor='#ec4899';
  ctx.font='bold 36px "Courier New",monospace';ctx.textAlign='center';
  ctx.fillText(title,W/2,H/2-20);ctx.shadowBlur=0;
  ctx.fillStyle='#c4b5fd';ctx.font='14px "Courier New",monospace';ctx.fillText(sub,W/2,H/2+20);
}

function loop(){requestAnimationFrame(loop);update();draw()}

// controls
document.addEventListener('mousemove',e=>{
  const r=C.getBoundingClientRect();
  pad.x=Math.max(0,Math.min(W-pad.w,e.clientX-r.left-pad.w/2));
});
document.addEventListener('touchmove',e=>{
  const r=C.getBoundingClientRect();
  pad.x=Math.max(0,Math.min(W-pad.w,e.touches[0].clientX-r.left-pad.w/2));
},{passive:true});
document.addEventListener('click',()=>{
  if(state==='ready'||!ball.launched)launch();
  else if(state==='win'||state==='dead')init();
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();
    if(state==='ready'||!ball.launched)launch();
    else if(state==='win'||state==='dead')init();
  }
  if(e.key==='ArrowLeft')pad.x=Math.max(0,pad.x-20);
  if(e.key==='ArrowRight')pad.x=Math.min(W-pad.w,pad.x+20);
});

init();loop();
</script>
</body>
</html>
