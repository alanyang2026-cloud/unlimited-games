<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arcade Brawl — Stickman Fight</title>
<style>canvas{max-width:100vw!important;max-height:100vh!important;height:auto!important}body{overflow-x:hidden!important;overflow-y:auto}</style>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:
  radial-gradient(ellipse at top,#1e293b 0%,#0a0b14 70%,#030305 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;
  font-family:'Impact','Arial Black',system-ui,sans-serif;color:#fff;user-select:none;padding-top:10px;overflow-x:hidden}
canvas{display:block;border-radius:10px;border:2px solid #475569;background:#0f172a;
  box-shadow:0 0 40px rgba(71,85,105,.4)}

.hbtn{position:fixed;top:12px;left:12px;z-index:999;background:rgba(0,0,0,.75);color:#e2e8f0;
  text-decoration:none;padding:6px 14px;border-radius:20px;font-size:13px;font-family:system-ui;
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);transition:.2s}
.hbtn:hover{background:rgba(220,38,38,.5)}

.wrap{position:relative;max-width:100vw}

/* HUD */
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;
  align-items:flex-start;gap:14px;pointer-events:none;z-index:5;font-family:system-ui}
.hpbox{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);
  border-radius:10px;padding:8px 14px;min-width:170px}
.hpbox .row{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.15em;
  text-transform:uppercase;font-weight:700;margin-bottom:4px}
.hpbox .w{font-size:10px;color:#fbbf24;font-weight:900;letter-spacing:.1em}
.hpbox .barwrap{height:12px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden;
  border:1px solid rgba(255,255,255,.1)}
.hpbox .bar{height:100%;transition:width .18s ease}
.hpbox .bar.ok  {background:linear-gradient(90deg,#4ade80,#16a34a)}
.hpbox .bar.mid {background:linear-gradient(90deg,#fbbf24,#ea580c)}
.hpbox .bar.low {background:linear-gradient(90deg,#f87171,#991b1b);animation:lowP 0.5s ease-in-out infinite}
@keyframes lowP{0%,100%{opacity:1}50%{opacity:.5}}
.hpbox .num{font-family:'JetBrains Mono',monospace;font-weight:900;font-size:14px;margin-top:3px}
.hpbox.p1 .name{color:#60a5fa}
.hpbox.p2 .name{color:#f87171}
.hpbox.p3 .name{color:#a78bfa}

/* Overlays */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(5,5,15,.88);backdrop-filter:blur(6px);z-index:50;font-family:system-ui;padding:22px;
  border-radius:10px;text-align:center}
.ov.hidden{display:none}
.ov h1{font-size:3.2rem;font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(135deg,#f43f5e,#a855f7,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(168,85,247,.35);margin-bottom:4px}
.ov .tag{color:#94a3b8;font-size:14px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:18px}
.ov p{color:#cbd5e1;font-size:14px;line-height:1.6;max-width:540px;margin-bottom:10px}
.ks{display:grid;grid-template-columns:auto auto;gap:4px 18px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 16px;margin:8px 0 14px;
  font-size:12px;color:#cbd5e1;text-align:left}
.ks b{color:#a855f7;font-weight:700;font-family:'JetBrains Mono',monospace}
.modes,.weps{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.modebtn,.wepbtn{background:rgba(30,30,58,.75);color:#e2e8f0;border:2px solid rgba(255,255,255,.12);
  padding:10px 20px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:system-ui;transition:.15s;letter-spacing:.03em}
.modebtn.active,.wepbtn.active{background:linear-gradient(135deg,#a855f7,#7c3aed);border-color:#c084fc;
  box-shadow:0 0 20px rgba(168,85,247,.5)}
.modebtn:hover:not(.active),.wepbtn:hover:not(.active){border-color:rgba(255,255,255,.3);transform:translateY(-1px)}
.wepbtn{width:120px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 10px}
.wepbtn .ico{font-size:28px;line-height:1}
.wepbtn .lbl{font-size:12px;letter-spacing:.05em}
.wepbtn .dmg{font-size:10px;color:#94a3b8;font-family:'JetBrains Mono',monospace}
.btn{background:linear-gradient(135deg,#f43f5e,#a855f7);color:#fff;border:none;padding:14px 38px;
  border-radius:12px;font-size:17px;font-weight:800;cursor:pointer;letter-spacing:.05em;
  transition:.15s;font-family:system-ui;box-shadow:0 4px 24px rgba(168,85,247,.45)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(244,63,94,.55)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.winbanner{font-size:3.5rem;font-weight:900;letter-spacing:.04em;margin-bottom:12px;
  text-shadow:0 0 40px currentColor}
.winbanner.p1{color:#60a5fa}
.winbanner.p2{color:#f87171}
.winbanner.p3{color:#a78bfa}
.winbanner.draw{color:#94a3b8}
.sectionlabel{color:#cbd5e1;font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:4px 0 8px}
</style>
</head>
<body>
<a href="/" class="hbtn">← Games</a>

<div class="wrap">
  <canvas id="c" width="960" height="540"></canvas>

  <!-- HUD -->
  <div class="hud" id="hud">
    <div class="hpbox p1">
      <div class="row"><span class="name" id="n1">You</span><span class="w" id="w1">FIST</span></div>
      <div class="barwrap"><div class="bar ok" id="b1" style="width:100%"></div></div>
      <div class="num" id="hp1">100</div>
    </div>
    <div class="hpbox p2">
      <div class="row"><span class="name" id="n2">Red Bot</span><span class="w" id="w2">FIST</span></div>
      <div class="barwrap"><div class="bar ok" id="b2" style="width:100%"></div></div>
      <div class="num" id="hp2">100</div>
    </div>
    <div class="hpbox p3" id="box3" style="display:none">
      <div class="row"><span class="name" id="n3">Purple Bot</span><span class="w" id="w3">FIST</span></div>
      <div class="barwrap"><div class="bar ok" id="b3" style="width:100%"></div></div>
      <div class="num" id="hp3">100</div>
    </div>
  </div>

  <!-- Intro menu -->
  <div class="ov" id="menu">
    <h1>Arcade Brawl</h1>
    <div class="tag">Stickman Fight</div>

    <div class="sectionlabel">Mode</div>
    <div class="modes">
      <button class="modebtn active" data-mode="1v1">🥊 1 vs 1</button>
      <button class="modebtn" data-mode="1v1v1">💥 1 vs 1 vs 1</button>
    </div>

    <div class="sectionlabel">Pick your weapon</div>
    <div class="weps" id="weps"></div>

    <div class="ks">
      <div>Move</div><div><b>A D</b> or <b>← →</b></div>
      <div>Jump</div><div><b>W</b> / <b>Space</b></div>
      <div>Attack</div><div><b>Mouse Click</b> or <b>J</b></div>
    </div>
    <button class="btn" id="startBtn" disabled>Pick a weapon</button>
  </div>

  <!-- Win overlay -->
  <div class="ov hidden" id="winOv">
    <div class="winbanner" id="winText">VICTORY</div>
    <p id="winSub">You crushed them.</p>
    <button class="btn" id="rematchBtn">Rematch</button>
  </div>
</div>

<script src="_esc-back.js"></script>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = C.width, H = C.height;

// ─── Config ───────────────────────────────────────────────
const G = 0.55;                 // gravity for jumps & projectiles
const GROUND_Y = 470;           // default feet-line

const COLORS = [
  { name: 'You',        line: '#60a5fa', skin: '#dbeafe', accent: '#1d4ed8' },
  { name: 'Red Bot',    line: '#f87171', skin: '#fecaca', accent: '#991b1b' },
  { name: 'Purple Bot', line: '#c084fc', skin: '#e9d5ff', accent: '#6b21a8' },
];

// Damage multiplier by body part
const PART_DMG = {
  head: 1.5, torso: 1.0, upperArm: 0.4, lowerArm: 0.4, upperLeg: 0.6, lowerLeg: 0.5,
};

// Weapons (base damage scaled by part multiplier on hit)
// Damage tuned so a fight lasts ~30-60 seconds, not 3 seconds.
// Rule of thumb: head shot should feel strong but not one-shot.
// head 1.5× · torso 1.0× · legs 0.5-0.6× · arms 0.4×
const WEAPONS = {
  fist:    { label: 'Fist',    icon: '✊', base: 5,  reach: 46,  cool: 16, swing: 14, color: '#fef3c7' },
  bat:     { label: 'Bat',     icon: '🏏', base: 12, reach: 76,  cool: 30, swing: 20, color: '#a16207' },
  sword:   { label: 'Sword',   icon: '🗡️', base: 18, reach: 88,  cool: 32, swing: 22, color: '#e2e8f0' },
  pistol:  { label: 'Pistol',  icon: '🔫', base: 14, reach: 480, cool: 20, swing: 10, color: '#334155', ranged: true, ammo: 8 },
  grenade: { label: 'Grenade', icon: '💣', base: 32, reach: 0,   cool: 85, swing: 18, color: '#16a34a', throws: true, radius: 120, fuse: 90 },
};

// Maps. Flat ground line plus optional floating platforms.
// `kill_x_min` / `kill_x_max` define horizontal kill lines (pits).
const MAPS = [
  { name: 'Desert Pit',  // all closed, best for first round
    bg: ctx => {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#f59e0b'); g.addColorStop(.7, '#b45309'); g.addColorStop(1, '#78350f');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(0,0,0,.15)';
      ctx.beginPath(); ctx.moveTo(0, 360);
      ctx.quadraticCurveTo(240, 300, 480, 360);
      ctx.quadraticCurveTo(720, 410, 960, 350);
      ctx.lineTo(960, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    },
    ground: 470, kills: { xMin: 20, xMax: 940 },
    groundColor: '#92400e',
    platforms: [],
  },
  { name: 'Factory',
    bg: ctx => {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#1e3a8a'); g.addColorStop(1, '#0c0a1f');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      for(let i = 0; i < 12; i++) ctx.fillRect(40 + i*75, 50 + (i%3)*20, 50, 160);
    },
    ground: 470, kills: { xMin: 300, xMax: 660 },  // central pit
    groundColor: '#334155',
    // Two ground slabs flank a pit from x=300 to x=660
    slabs: [{ x: 0, w: 300 }, { x: 660, w: 300 }],
    platforms: [{ x: 420, y: 340, w: 120 }],
  },
  { name: 'Rooftop',
    bg: ctx => {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#7c2d12'); g.addColorStop(1, '#431407');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#1c1917';
      for(let i = 0; i < 8; i++){ const bx = i*130 + 20, bh = 100 + ((i*73)%80); ctx.fillRect(bx, H - 180 - bh, 100, bh); }
    },
    ground: 470, kills: { xMin: 60, xMax: 900 },
    groundColor: '#57534e',
    platforms: [],
  },
  { name: 'Sky Isles',
    bg: ctx => {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0891b2'); g.addColorStop(1, '#083344');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      for(let i = 0; i < 5; i++){
        const cx = i*190 + 40, cy = 100 + (i%2)*50;
        ctx.beginPath(); ctx.arc(cx, cy, 30, 0, Math.PI*2);
        ctx.arc(cx+30, cy, 26, 0, Math.PI*2);
        ctx.arc(cx-30, cy+6, 22, 0, Math.PI*2); ctx.fill();
      }
    },
    ground: 470, kills: { xMin: 20, xMax: 940 },
    groundColor: '#78716c',
    slabs: [{ x: 60, w: 240 }, { x: 360, w: 240 }, { x: 660, w: 240 }],
    platforms: [],
  },
];

// ─── Game state ───────────────────────────────────────────
let fighters = [];
let projectiles = [];
let particles = [];
let currentMap = MAPS[0];
let mode = '1v1';
let playerWeapon = null;
let gameState = 'menu';
let frame = 0;

// ─── Input ────────────────────────────────────────────────
const keys = {};
let mouseX = 0, mouseY = 0, clickBuffered = false;
addEventListener('keydown', e => {
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if(e.code === 'KeyJ') clickBuffered = true;
});
addEventListener('keyup', e => keys[e.code] = false);
C.addEventListener('mousemove', e => {
  const r = C.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
  mouseY = (e.clientY - r.top) * (H / r.height);
});
C.addEventListener('mousedown', e => { if(e.button === 0) clickBuffered = true; });

// ─── Fighter factory ──────────────────────────────────────
function createFighter(x, colorIdx, isAI, weaponKind){
  return {
    id: colorIdx, name: COLORS[colorIdx].name, color: COLORS[colorIdx],
    x, y: GROUND_Y,                // y is feet position
    vx: 0, vy: 0,
    grounded: true,
    facing: isAI ? -1 : 1,
    hp: 100, maxHp: 100, alive: true,
    isAI,
    weapon: weaponKind, ammo: WEAPONS[weaponKind].ammo || Infinity,

    // Animation state (procedural)
    walkPhase: 0,                  // advances with movement, drives leg swing
    attackPhase: 0,                // 0 = idle, counts UP to swing frames when attacking
    hurtPhase: 0,                  // flinch timer
    cooldown: 0,                   // frames until next attack allowed
    jumpCool: 0,

    // KO ragdoll state (only populated after death)
    rag: null,

    // AI
    ai: { cool: 0, wantJump: 0, retarget: 0, targetIdx: null },
  };
}

// ─── Update ───────────────────────────────────────────────
function update(){
  if(gameState !== 'fight') return;

  // Player
  const p = fighters[0];
  if(p && p.alive) updatePlayer(p);
  // AI
  for(let i = 1; i < fighters.length; i++){
    const f = fighters[i];
    if(f.alive) updateAI(f);
  }
  // Physics (gravity / jumping) + idle animation
  for(const f of fighters){
    f.vy += G;
    f.x += f.vx;
    f.y += f.vy;

    // Landing on main ground or a slab
    const g = groundYAt(f.x);
    if(f.y >= g){
      f.y = g;
      f.vy = 0;
      f.grounded = true;
    } else {
      f.grounded = false;
    }

    // Walk animation phase
    if(Math.abs(f.vx) > 0.5) f.walkPhase += Math.abs(f.vx) * 0.12;

    // Decay attack / hurt / cool
    if(f.attackPhase > 0) f.attackPhase++;
    if(f.cooldown > 0) f.cooldown--;
    if(f.hurtPhase > 0) f.hurtPhase--;
    if(f.jumpCool > 0) f.jumpCool--;

    // Run melee hit check during active swing frames (now part of
    // physics update, so it fires every frame instead of being tied to
    // the render pass — fixes "only the first swing dealt damage").
    if(f.attackPhase > 0 && f.alive) checkMeleeHit(f);

    // End attack animation
    const swing = WEAPONS[f.weapon].swing;
    if(f.attackPhase > swing) f.attackPhase = 0;

    // Friction
    if(f.grounded) f.vx *= 0.82;

    // Keep within map
    if(f.x < 10) { f.x = 10; f.vx = 0; }
    if(f.x > W - 10) { f.x = W - 10; f.vx = 0; }

    // Pit death
    if(f.alive && f.y > H + 40){ killFighter(f); }
    // Alternately fall off left/right if those are kill zones
    if(f.alive && isInKillZone(f.x) && f.y > GROUND_Y + 10){ killFighter(f); }
  }
  // Update KO ragdolls (fallen bodies simulated as simple particles)
  for(const f of fighters){ if(f.rag) updateRagdoll(f.rag); }

  // Projectiles
  for(let i = projectiles.length - 1; i >= 0; i--){
    const pr = projectiles[i];
    if(pr.kind === 'bullet'){
      pr.x += pr.vx; pr.y += pr.vy; pr.life--;
      let hit = false;
      for(const other of fighters){
        if(!other.alive || other === pr.owner) continue;
        const parts = fighterPartsHitboxes(other);
        for(const part of parts){
          if(Math.abs(pr.x - part.x) < part.r && Math.abs(pr.y - part.y) < part.r + 2){
            applyHit(other, part.name, pr.dmg, pr.owner, Math.sign(pr.vx));
            spawnParticles(pr.x, pr.y, '#fbbf24', 6);
            hit = true; break;
          }
        }
        if(hit) break;
      }
      if(hit || pr.life <= 0 || pr.x < -20 || pr.x > W + 20) projectiles.splice(i, 1);
    } else if(pr.kind === 'grenade'){
      pr.vy += G * 0.7;
      pr.x += pr.vx; pr.y += pr.vy;
      // Bounce off ground
      const g = groundYAt(pr.x);
      if(pr.y > g){ pr.y = g; pr.vy = -pr.vy * 0.4; pr.vx *= 0.7; }
      if(pr.x < 10) { pr.x = 10; pr.vx *= -0.6; }
      if(pr.x > W - 10) { pr.x = W - 10; pr.vx *= -0.6; }
      pr.fuse--;
      if(pr.fuse <= 0){
        // Boom
        const r = WEAPONS.grenade.radius;
        for(const other of fighters){
          if(!other.alive) continue;
          const parts = fighterPartsHitboxes(other);
          for(const part of parts){
            const d = Math.hypot(part.x - pr.x, part.y - pr.y);
            if(d < r){
              const falloff = 1 - d / r;
              applyHit(other, part.name, WEAPONS.grenade.base * falloff, pr.owner, Math.sign(part.x - pr.x));
            }
          }
        }
        spawnParticles(pr.x, pr.y, '#fbbf24', 40);
        spawnParticles(pr.x, pr.y, '#ef4444', 20);
        projectiles.splice(i, 1);
      }
    }
  }

  // Particles
  for(const pa of particles){
    pa.x += pa.vx; pa.y += pa.vy; pa.vy += 0.3; pa.life--;
  }
  particles = particles.filter(pa => pa.life > 0);

  updateHUD();
}

function groundYAt(x){
  const m = currentMap;
  // Default ground
  let g = GROUND_Y;
  // Check slabs (if map has pits)
  if(m.slabs){
    let onSlab = false;
    for(const s of m.slabs){ if(x >= s.x && x <= s.x + s.w){ onSlab = true; break; } }
    if(!onSlab) g = H + 200;  // free fall through pit
  }
  return g;
}
function isInKillZone(x){
  const m = currentMap;
  if(m.slabs) return false;  // slabs already handle pits
  if(m.kills) return x < m.kills.xMin || x > m.kills.xMax;
  return false;
}

// ─── Player controller ────────────────────────────────────
function updatePlayer(p){
  const spec = WEAPONS[p.weapon];
  const left  = keys.KeyA || keys.ArrowLeft;
  const right = keys.KeyD || keys.ArrowRight;
  const speed = 3.2;
  if(left)  { p.vx = Math.max(p.vx - 0.6, -speed); p.facing = -1; }
  if(right) { p.vx = Math.min(p.vx + 0.6,  speed); p.facing = 1; }

  // Face mouse when attacking
  if(clickBuffered) p.facing = mouseX > p.x ? 1 : -1;

  // Jump
  if((keys.Space || keys.KeyW || keys.ArrowUp) && p.grounded && p.jumpCool === 0){
    p.vy = -10; p.grounded = false; p.jumpCool = 10;
  }

  // Attack
  if(clickBuffered && p.cooldown === 0 && p.attackPhase === 0){
    doAttack(p, mouseX, mouseY);
  }
  clickBuffered = false;
}

// ─── AI controller ────────────────────────────────────────
function updateAI(f){
  const ai = f.ai;
  const spec = WEAPONS[f.weapon];

  // Pick a target periodically
  if(ai.retarget-- <= 0){
    let best = null, bestD = Infinity;
    for(const other of fighters){
      if(other === f || !other.alive) continue;
      const d = Math.hypot(other.x - f.x, other.y - f.y);
      if(d < bestD){ bestD = d; best = other; }
    }
    ai.targetIdx = best ? fighters.indexOf(best) : null;
    ai.retarget = 30 + Math.floor(Math.random() * 40);
  }
  const target = ai.targetIdx !== null ? fighters[ai.targetIdx] : null;
  if(!target || !target.alive) return;

  const dx = target.x - f.x;
  const dist = Math.hypot(dx, target.y - f.y);
  f.facing = dx > 0 ? 1 : -1;

  // Keep optimal distance for weapon
  const sweet = spec.ranged ? 240 : spec.reach * 0.75;
  const speed = 2.6;
  if(dist > sweet + 30){
    f.vx = Math.max(Math.min(f.vx + Math.sign(dx) * 0.4, speed), -speed);
  } else if(dist < sweet - 30){
    f.vx = Math.max(Math.min(f.vx - Math.sign(dx) * 0.4, speed), -speed);
  } else {
    f.vx *= 0.7;
  }

  // Occasional jump
  if(f.grounded && ai.wantJump-- <= 0 && Math.random() < 0.02){
    f.vy = -9; f.grounded = false; ai.wantJump = 60;
  }

  // Attack when in reach. Most windows result in a swing; a small
  // human-feel miss chance keeps the AI from being unreactable.
  if(f.cooldown === 0 && f.attackPhase === 0){
    const inReach = spec.ranged ? dist < spec.reach : dist < spec.reach + 10;
    if(inReach){
      if(Math.random() < 0.85){ doAttack(f, target.x, target.y); }
      else { f.cooldown = 6; }
    }
  }
}

// ─── Attack dispatch ──────────────────────────────────────
function doAttack(f, aimX, aimY){
  const spec = WEAPONS[f.weapon];
  f.attackPhase = 1;
  f.attackHit = false;        // reset: each swing gets one fresh hit
  f.cooldown = spec.cool;

  if(spec.ranged){
    // Pistol: insta-fire bullet
    if(f.ammo <= 0){
      // Out of ammo — fall back to fist for the rest of the round
      f.weapon = 'fist'; f.ammo = Infinity; return;
    }
    f.ammo--;
    const ang = Math.atan2(aimY - (f.y - 60), aimX - f.x);
    projectiles.push({
      kind: 'bullet',
      x: f.x + Math.cos(ang) * 30, y: (f.y - 60) + Math.sin(ang) * 6,
      vx: Math.cos(ang) * 16, vy: Math.sin(ang) * 16,
      owner: f, dmg: spec.base, life: 50,
    });
    spawnParticles(f.x + Math.cos(ang) * 32, f.y - 60, '#fde68a', 4);
  } else if(spec.throws){
    // Grenade
    const ang = Math.atan2(aimY - (f.y - 50), aimX - f.x);
    projectiles.push({
      kind: 'grenade',
      x: f.x + Math.cos(ang) * 20, y: f.y - 60,
      vx: Math.cos(ang) * 9, vy: Math.sin(ang) * 9 - 3,
      fuse: spec.fuse, owner: f,
    });
  }
  // Melee hit detection happens in the middle of the swing animation
  // (handled in checkMeleeHit which runs each frame while attackPhase is active)
}

// Called during active frames of melee swing (frame 6-12 of the animation)
function checkMeleeHit(f){
  const spec = WEAPONS[f.weapon];
  if(spec.ranged || spec.throws) return;
  // Only in the sweet-spot of the swing (middle portion)
  const sweetStart = Math.floor(spec.swing * 0.35);
  const sweetEnd   = Math.floor(spec.swing * 0.75);
  if(f.attackPhase < sweetStart || f.attackPhase > sweetEnd) return;
  if(f.attackHit) return;   // only hit once per swing

  const hitX = f.x + f.facing * (spec.reach * 0.6);
  const hitY = f.y - 55 + Math.sin((f.attackPhase / spec.swing) * Math.PI) * 10;

  for(const other of fighters){
    if(other === f || !other.alive) continue;
    const parts = fighterPartsHitboxes(other);
    for(const part of parts){
      const d = Math.hypot(part.x - hitX, part.y - hitY);
      if(d < spec.reach * 0.45){
        applyHit(other, part.name, spec.base, f, f.facing);
        f.attackHit = true;
        return;
      }
    }
  }
}

// ─── Hit / damage ─────────────────────────────────────────
function applyHit(target, partName, base, source, knockDir){
  if(!target.alive) return;
  const mul = PART_DMG[partName] || 1;
  const dmg = Math.max(1, Math.round(base * mul));
  target.hp = Math.max(0, target.hp - dmg);
  target.hurtPhase = 12;
  // Little knockback
  target.vx += knockDir * (1 + base / 20);
  target.vy -= 2;
  spawnParticles(target.x, target.y - 50, '#dc2626', 6);
  // Damage number float
  particles.push({
    x: target.x + (Math.random() - .5) * 20, y: target.y - 80,
    vx: 0, vy: -1.5, life: 32,
    color: partName === 'head' ? '#fbbf24' : '#f87171',
    text: '-' + dmg, isText: true,
  });
  if(target.hp === 0) killFighter(target);
}

function killFighter(f){
  f.alive = false;
  // Spawn KO ragdoll — simple joint chain that falls with gravity
  f.rag = createRagdoll(f);
  spawnParticles(f.x, f.y - 60, '#dc2626', 20);
  setTimeout(() => {
    const alive = fighters.filter(x => x.alive);
    if(gameState === 'fight' && alive.length <= 1){
      gameState = 'ended';
      showWinScreen(alive[0] || null);
    }
  }, 600);
}

// ─── Hitboxes for a stickman (used by projectiles + melee) ──
function fighterPartsHitboxes(f){
  const s = buildSkeleton(f);  // positions of head/torso/limbs
  return [
    { name: 'head',      x: s.head.x,     y: s.head.y,     r: 12 },
    { name: 'torso',     x: s.torso.cx,   y: s.torso.cy,   r: 16 },
    { name: 'upperArm',  x: s.armUpR.x,   y: s.armUpR.y,   r: 7 },
    { name: 'lowerArm',  x: s.armLoR.x,   y: s.armLoR.y,   r: 7 },
    { name: 'upperArm',  x: s.armUpL.x,   y: s.armUpL.y,   r: 7 },
    { name: 'lowerArm',  x: s.armLoL.x,   y: s.armLoL.y,   r: 7 },
    { name: 'upperLeg',  x: s.legUpL.x,   y: s.legUpL.y,   r: 8 },
    { name: 'lowerLeg',  x: s.legLoL.x,   y: s.legLoL.y,   r: 8 },
    { name: 'upperLeg',  x: s.legUpR.x,   y: s.legUpR.y,   r: 8 },
    { name: 'lowerLeg',  x: s.legLoR.x,   y: s.legLoR.y,   r: 8 },
  ];
}

// ─── Skeleton builder (procedural animation) ──────────────
// Returns {head, torso, armUpL, armLoL, armUpR, armLoR, legUpL, legLoL, legUpR, legLoR}
// All in world coordinates. Pose depends on walk / attack / hurt phases.
function buildSkeleton(f){
  const spec = WEAPONS[f.weapon];
  const walk = Math.sin(f.walkPhase);               // -1..1, leg cadence
  const walk2 = Math.sin(f.walkPhase * 2);          // 2x speed, bob
  const moving = Math.abs(f.vx) > 0.5;
  const inAir = !f.grounded;

  // Idle breathing — always on, subtle
  const idle = Math.sin(frame * 0.05) * 1.4;
  // Body bob during walk — hips rise & fall
  const bob = moving ? Math.abs(walk) * -3 : 0;
  // Attack windup crouch — fighter dips slightly before the swing
  const windupT = f.attackPhase > 0 && f.attackPhase < 6 ? f.attackPhase / 6 : 0;
  const settleT = f.attackPhase > spec.swing - 6 ? (spec.swing - f.attackPhase) / 6 : 0;
  const crouch = windupT * 6 + settleT * 3;

  // Hurt: body leans AWAY from the hit, head jerks back further
  const hurtFrac = f.hurtPhase / 12;
  const hurtLean = f.hurtPhase > 0 ? -f.facing * hurtFrac * 7 : 0;
  const hurtHead = hurtLean * 1.6;

  // Lean slightly INTO the walking direction — feels like momentum
  const moveLean = moving ? Math.sign(f.vx) * 2 : 0;

  // Base points
  const hipY = f.y - 50 + bob + crouch + idle * 0.2;
  const torsoTop = hipY - 44;
  const headY = torsoTop - 16;

  const torso = {
    cx: f.x + hurtLean * 0.4 + moveLean * 0.5,
    cy: (hipY + torsoTop) / 2,
    topX: f.x + hurtLean + moveLean, topY: torsoTop,
    botX: f.x, botY: hipY,
  };
  const head = {
    x: torso.topX + hurtHead * 0.4,
    y: headY + hurtHead * 0.15 - Math.abs(walk) * 0.8,  // head bob
  };

  // Legs — exaggerated swing during walking, knees tuck in-air
  const legSwing = inAir ? 0.25 : (moving ? walk * 0.55 : 0);
  const kneeRise = moving ? Math.max(0, walk) * 6 : 0;
  const legUpL = { x: f.x - 4 - legSwing * 3, y: hipY + 14 - legSwing * 12 };
  const legUpR = { x: f.x + 4 + legSwing * 3, y: hipY + 14 + legSwing * 12 };
  const legLoL = { x: f.x - 4 + legSwing * 14, y: f.y - 2 - (inAir ? 14 : kneeRise * (walk > 0 ? 1 : 0)) };
  const legLoR = { x: f.x + 4 - legSwing * 14, y: f.y - 2 - (inAir ? 8  : kneeRise * (walk < 0 ? 1 : 0)) };

  // Arms — idle sway + walk counterswing + attack animation
  const idleArm = Math.sin(frame * 0.05 + f.id) * 0.1;
  const armSwing = -walk * 0.45 + idleArm;
  const shoulderL = { x: torso.topX - 10, y: torso.topY + 4 };
  const shoulderR = { x: torso.topX + 10, y: torso.topY + 4 };

  let armUpR = { x: shoulderR.x + armSwing * 10, y: shoulderR.y + 20 - Math.abs(armSwing) * 5 };
  let armLoR = { x: armUpR.x + armSwing * 14, y: armUpR.y + 20 };
  let armUpL = { x: shoulderL.x - armSwing * 10, y: shoulderL.y + 20 - Math.abs(armSwing) * 5 };
  let armLoL = { x: armUpL.x - armSwing * 14, y: armUpL.y + 20 };

  // Arms raised in air (cartoon jump pose)
  if(inAir){
    armUpR = { x: shoulderR.x + 6, y: shoulderR.y - 6 };
    armLoR = { x: armUpR.x + 10, y: armUpR.y - 14 };
    armUpL = { x: shoulderL.x - 6, y: shoulderL.y - 6 };
    armLoL = { x: armUpL.x - 10, y: armUpL.y - 14 };
  }

  // Attack animation (right arm — the weapon-holding one)
  let weaponAng = 0;
  if(f.attackPhase > 0){
    const t = f.attackPhase / spec.swing;              // 0..1
    const ease = Math.sin(t * Math.PI);                // 0 → 1 → 0, smooth
    if(spec.throws){
      // Overhand throw: back → overhead → release forward
      const a = -1.2 + t * 2.6;
      armUpR = { x: shoulderR.x + f.facing * Math.cos(a) * 16, y: shoulderR.y + Math.sin(a) * 16 };
      armLoR = { x: armUpR.x + f.facing * Math.cos(a + 0.5) * 20, y: armUpR.y + Math.sin(a + 0.5) * 20 };
      // Other arm cocks back for balance
      armUpL = { x: shoulderL.x - f.facing * 8, y: shoulderL.y + 4 };
      armLoL = { x: armUpL.x - f.facing * 10, y: armUpL.y + 14 };
    } else if(spec.ranged){
      // Pistol: aim forward, free hand supports
      armUpR = { x: shoulderR.x + f.facing * 12, y: shoulderR.y + 6 - ease * 2 };
      armLoR = { x: armUpR.x + f.facing * 16, y: armUpR.y + 2 - ease * 3 };
      armUpL = { x: shoulderL.x + f.facing * 2,  y: shoulderL.y + 10 };
      armLoL = { x: armUpL.x + f.facing * 10, y: armUpL.y + 6 };
    } else {
      // Melee: wide arc from above-behind → forward → below
      const a = -1.6 + t * 3.0;
      armUpR = { x: shoulderR.x + f.facing * Math.cos(a) * 16, y: shoulderR.y + Math.sin(a) * 16 };
      armLoR = { x: armUpR.x + f.facing * Math.cos(a + 0.3) * 22, y: armUpR.y + Math.sin(a + 0.3) * 22 };
      // Back arm cocks for torque
      armUpL = { x: shoulderL.x - f.facing * 6 * ease, y: shoulderL.y + 12 };
      armLoL = { x: armUpL.x - f.facing * 14 * ease, y: armUpL.y + 14 };
      weaponAng = a + 0.3;
      // Forward lunge
      torso.cx += f.facing * ease * 3;
      torso.topX += f.facing * ease * 3;
    }
  }

  return { head, torso, armUpL, armLoL, armUpR, armLoR,
           legUpL, legLoL, legUpR, legLoR, weaponAng, shoulderL, shoulderR };
}

// ─── Rendering ────────────────────────────────────────────
function draw(){
  currentMap.bg(ctx);

  // Ground
  if(currentMap.slabs){
    for(const s of currentMap.slabs){
      ctx.fillStyle = currentMap.groundColor;
      ctx.fillRect(s.x, currentMap.ground, s.w, H - currentMap.ground);
      ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2;
      ctx.strokeRect(s.x, currentMap.ground, s.w, H - currentMap.ground);
    }
  } else {
    ctx.fillStyle = currentMap.groundColor;
    ctx.fillRect(0, currentMap.ground, W, H - currentMap.ground);
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, currentMap.ground); ctx.lineTo(W, currentMap.ground); ctx.stroke();
  }
  // Floating platforms
  if(currentMap.platforms) for(const p of currentMap.platforms){
    ctx.fillStyle = '#475569';
    ctx.fillRect(p.x, p.y, p.w, 12);
  }

  // Fighters (sorted: alive ones in front)
  const order = [...fighters].sort((a, b) => (a.alive?1:0) - (b.alive?1:0));
  for(const f of order){
    if(f.alive) drawFighter(f);
    else if(f.rag) drawRagdoll(f);
  }

  // Projectiles
  for(const pr of projectiles){
    if(pr.kind === 'bullet'){
      ctx.strokeStyle = '#fef3c7'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(pr.x - pr.vx * 0.6, pr.y - pr.vy * 0.6); ctx.lineTo(pr.x, pr.y); ctx.stroke();
    } else if(pr.kind === 'grenade'){
      ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.arc(pr.x, pr.y, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#052e16'; ctx.lineWidth = 2; ctx.stroke();
      if(pr.fuse < 30 && Math.floor(pr.fuse / 4) % 2 === 0){
        ctx.fillStyle = '#fef3c7';
        ctx.beginPath(); ctx.arc(pr.x, pr.y - 10, 3, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  // Particles
  for(const pa of particles){
    if(pa.isText){
      ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = pa.color;
      ctx.globalAlpha = Math.min(1, pa.life / 20);
      ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 3;
      ctx.strokeText(pa.text, pa.x, pa.y);
      ctx.fillText(pa.text, pa.x, pa.y);
    } else {
      ctx.fillStyle = pa.color;
      ctx.globalAlpha = Math.min(1, pa.life / 20);
      ctx.beginPath(); ctx.arc(pa.x, pa.y, 2.5, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawFighter(f){
  const s = buildSkeleton(f);
  const col = f.color;
  const limbW = 5;
  const hurtFlash = f.hurtPhase > 0 && Math.floor(f.hurtPhase / 3) % 2 === 0;
  const lineCol = hurtFlash ? '#fecaca' : col.line;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(f.x, f.y + 6, 20, 5, 0, 0, Math.PI*2); ctx.fill();

  // Legs
  stroke(s.torso.botX - 4, s.torso.botY, s.legUpL.x, s.legUpL.y, lineCol, limbW);
  stroke(s.legUpL.x, s.legUpL.y, s.legLoL.x, s.legLoL.y, lineCol, limbW);
  stroke(s.torso.botX + 4, s.torso.botY, s.legUpR.x, s.legUpR.y, lineCol, limbW);
  stroke(s.legUpR.x, s.legUpR.y, s.legLoR.x, s.legLoR.y, lineCol, limbW);

  // Torso
  stroke(s.torso.topX, s.torso.topY, s.torso.botX, s.torso.botY, lineCol, limbW + 2);

  // Left arm (background)
  stroke(s.shoulderL.x, s.shoulderL.y, s.armUpL.x, s.armUpL.y, lineCol, limbW);
  stroke(s.armUpL.x, s.armUpL.y, s.armLoL.x, s.armLoL.y, lineCol, limbW);

  // Right arm (foreground — holds weapon)
  stroke(s.shoulderR.x, s.shoulderR.y, s.armUpR.x, s.armUpR.y, lineCol, limbW);
  stroke(s.armUpR.x, s.armUpR.y, s.armLoR.x, s.armLoR.y, lineCol, limbW);

  // Head
  ctx.fillStyle = col.skin;
  ctx.beginPath(); ctx.arc(s.head.x, s.head.y, 11, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = lineCol; ctx.lineWidth = 2.5; ctx.stroke();
  // Eye
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(s.head.x + f.facing * 3, s.head.y - 1, 1.8, 0, Math.PI*2); ctx.fill();

  // Weapon in hand
  drawWeapon(s.armLoR.x, s.armLoR.y, f, s);
}

function stroke(x1, y1, x2, y2, color, width){
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function drawWeapon(x, y, f, s){
  const spec = WEAPONS[f.weapon];
  if(f.weapon === 'fist') return;  // just a hand
  ctx.save();
  ctx.translate(x, y);
  // Compute weapon angle: along the forearm direction
  const ang = Math.atan2(s.armLoR.y - s.armUpR.y, s.armLoR.x - s.armUpR.x);
  ctx.rotate(ang);
  if(f.weapon === 'bat'){
    ctx.fillStyle = spec.color;
    ctx.fillRect(0, -4, 48, 8);
    ctx.fillStyle = '#44403c'; ctx.fillRect(0, -3, 10, 6);
  } else if(f.weapon === 'sword'){
    ctx.fillStyle = spec.color;
    ctx.beginPath();
    ctx.moveTo(0, -2); ctx.lineTo(42, -3); ctx.lineTo(46, 0); ctx.lineTo(42, 3); ctx.lineTo(0, 2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#78350f'; ctx.fillRect(-10, -3, 7, 6);
    ctx.fillStyle = '#854d0e'; ctx.fillRect(-14, -4, 4, 8);
  } else if(f.weapon === 'pistol'){
    ctx.fillStyle = spec.color;
    ctx.fillRect(0, -4, 22, 8);
    ctx.fillRect(-2, 2, 8, 10);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(20, -3, 4, 3);
  } else if(f.weapon === 'grenade'){
    ctx.fillStyle = spec.color;
    ctx.beginPath(); ctx.arc(8, 0, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#334155';
    ctx.fillRect(7, -11, 3, 5);
  }
  ctx.restore();
}

// ─── Ragdoll (KO) — simple particle chain with gravity ───
function createRagdoll(f){
  const s = buildSkeleton(f);
  const parts = {};
  for(const k of ['head','armUpL','armLoL','armUpR','armLoR','legUpL','legLoL','legUpR','legLoR']){
    const p = s[k];
    parts[k] = { x: p.x, y: p.y, vx: (Math.random() - .5) * 6, vy: -3 - Math.random() * 3 };
  }
  parts.torsoTop = { x: s.torso.topX, y: s.torso.topY, vx: (Math.random() - .5) * 2, vy: -4 };
  parts.torsoBot = { x: s.torso.botX, y: s.torso.botY, vx: (Math.random() - .5) * 2, vy: -2 };
  return { parts, color: f.color, limbW: 5, settled: false };
}
function updateRagdoll(rag){
  const g = GROUND_Y + 10;
  for(const k in rag.parts){
    const p = rag.parts[k];
    p.vy += 0.5; p.x += p.vx; p.y += p.vy;
    if(p.y > g){ p.y = g; p.vy *= -0.3; p.vx *= 0.7; }
    if(Math.abs(p.vx) < 0.05 && p.y === g) p.vx = 0;
  }
}
function drawRagdoll(f){
  const r = f.rag, p = r.parts, c = r.color, w = r.limbW;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(p.torsoBot.x, GROUND_Y + 10, 22, 4, 0, 0, Math.PI*2); ctx.fill();
  // Limbs
  stroke(p.torsoBot.x - 4, p.torsoBot.y, p.legUpL.x, p.legUpL.y, c.line, w);
  stroke(p.legUpL.x, p.legUpL.y, p.legLoL.x, p.legLoL.y, c.line, w);
  stroke(p.torsoBot.x + 4, p.torsoBot.y, p.legUpR.x, p.legUpR.y, c.line, w);
  stroke(p.legUpR.x, p.legUpR.y, p.legLoR.x, p.legLoR.y, c.line, w);
  stroke(p.torsoTop.x, p.torsoTop.y, p.torsoBot.x, p.torsoBot.y, c.line, w + 2);
  stroke(p.torsoTop.x - 8, p.torsoTop.y + 4, p.armUpL.x, p.armUpL.y, c.line, w);
  stroke(p.armUpL.x, p.armUpL.y, p.armLoL.x, p.armLoL.y, c.line, w);
  stroke(p.torsoTop.x + 8, p.torsoTop.y + 4, p.armUpR.x, p.armUpR.y, c.line, w);
  stroke(p.armUpR.x, p.armUpR.y, p.armLoR.x, p.armLoR.y, c.line, w);
  ctx.fillStyle = c.skin;
  ctx.beginPath(); ctx.arc(p.head.x, p.head.y, 11, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = c.line; ctx.lineWidth = 2.5; ctx.stroke();
  // X eyes
  ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2;
  const hx = p.head.x, hy = p.head.y;
  ctx.beginPath();
  ctx.moveTo(hx - 5, hy - 3); ctx.lineTo(hx - 1, hy + 1);
  ctx.moveTo(hx - 1, hy - 3); ctx.lineTo(hx - 5, hy + 1);
  ctx.moveTo(hx + 1, hy - 3); ctx.lineTo(hx + 5, hy + 1);
  ctx.moveTo(hx + 5, hy - 3); ctx.lineTo(hx + 1, hy + 1);
  ctx.stroke();
}

// ─── Utility ──────────────────────────────────────────────
function spawnParticles(x, y, color, n){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: 24 + Math.random() * 10, color });
  }
}

// ─── HUD ──────────────────────────────────────────────────
function updateHUD(){
  const names = ['n1','n2','n3'], bars = ['b1','b2','b3'], nums = ['hp1','hp2','hp3'], weps = ['w1','w2','w3'];
  document.getElementById('box3').style.display = mode === '1v1v1' ? '' : 'none';
  for(let i = 0; i < fighters.length; i++){
    const f = fighters[i];
    document.getElementById(names[i]).textContent = f.name;
    document.getElementById(weps[i]).textContent = WEAPONS[f.weapon].icon + ' ' + WEAPONS[f.weapon].label.toUpperCase();
    const pct = (f.hp / f.maxHp) * 100;
    const bar = document.getElementById(bars[i]);
    bar.style.width = pct + '%';
    bar.className = 'bar ' + (pct > 50 ? 'ok' : pct > 20 ? 'mid' : 'low');
    document.getElementById(nums[i]).textContent = f.hp + ' / ' + f.maxHp;
  }
}

// ─── Menu / weapon select ─────────────────────────────────
function renderWeaponButtons(){
  const container = document.getElementById('weps');
  container.innerHTML = '';
  for(const kind of Object.keys(WEAPONS)){
    const spec = WEAPONS[kind];
    const b = document.createElement('button');
    b.className = 'wepbtn';
    b.dataset.kind = kind;
    b.innerHTML = `<span class="ico">${spec.icon}</span>
                   <span class="lbl">${spec.label}</span>
                   <span class="dmg">${spec.base} dmg${spec.ranged ? ' · '+spec.ammo+' shots' : ''}</span>`;
    b.addEventListener('click', () => {
      document.querySelectorAll('.wepbtn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      playerWeapon = kind;
      const startBtn = document.getElementById('startBtn');
      startBtn.disabled = false;
      startBtn.textContent = 'Fight';
    });
    container.appendChild(b);
  }
}

document.querySelectorAll('.modebtn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.modebtn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    mode = b.dataset.mode;
  });
});

function startMatch(){
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('winOv').classList.add('hidden');
  currentMap = MAPS[Math.floor(Math.random() * MAPS.length)];
  fighters = []; projectiles = []; particles = [];
  if(mode === '1v1'){
    fighters.push(createFighter(220, 0, false, playerWeapon));
    fighters.push(createFighter(740, 1, true, randomAIWeapon()));
  } else {
    fighters.push(createFighter(180, 0, false, playerWeapon));
    fighters.push(createFighter(500, 1, true, randomAIWeapon()));
    fighters.push(createFighter(780, 2, true, randomAIWeapon()));
  }
  gameState = 'fight';
}
function randomAIWeapon(){
  const keys = Object.keys(WEAPONS);
  return keys[Math.floor(Math.random() * keys.length)];
}

document.getElementById('startBtn').addEventListener('click', () => {
  if(!playerWeapon) return;
  startMatch();
});
document.getElementById('rematchBtn').addEventListener('click', () => {
  document.getElementById('winOv').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
  gameState = 'menu';
});

function showWinScreen(winner){
  const ov = document.getElementById('winOv');
  const txt = document.getElementById('winText');
  const sub = document.getElementById('winSub');
  if(!winner){ txt.textContent = 'DRAW'; txt.className = 'winbanner draw'; sub.textContent = 'Nobody made it.'; }
  else {
    const isPlayer = winner === fighters[0];
    txt.textContent = isPlayer ? 'VICTORY' : 'KO';
    txt.className = 'winbanner p' + (winner.id + 1);
    sub.textContent = isPlayer ? 'You crushed them.' : winner.name + ' wins.';
  }
  ov.classList.remove('hidden');
}

// ─── Main loop ────────────────────────────────────────────
function loop(){
  frame++;
  update();
  draw();
  requestAnimationFrame(loop);
}
renderWeaponButtons();
loop();
</script>
</body>
</html>
