<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feeding Frenzy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:
  radial-gradient(ellipse at top,#0e4f8a 0%,#062a4f 60%,#02101f 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
  font-family:'Segoe UI','Verdana',sans-serif;user-select:none;color:#e0f2fe;padding:12px;overflow:hidden}
h1{display:none}

.wrap{position:relative}
canvas{display:block;border-radius:14px;border:3px solid #0891b2;
  box-shadow:0 0 50px rgba(8,145,178,.5),inset 0 0 40px rgba(14,165,233,.15);
  background:linear-gradient(180deg,#2dd4bf 0%,#0891b2 30%,#075985 70%,#082f49 100%);
  max-width:100vw!important;max-height:calc(100vh - 24px)!important;height:auto!important;touch-action:none}

/* HUD overlaid on top-left/right of the canvas */
.hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;font-family:'Verdana',sans-serif;z-index:5}
.hud .box{background:rgba(2,30,55,.7);border:1px solid rgba(94,234,212,.4);border-radius:10px;padding:6px 14px;backdrop-filter:blur(6px);color:#e0f7fa;font-weight:900;display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.05em}
.hud .box .lbl{color:#94e2d9;font-size:10px;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.hud .lives{display:flex;gap:2px;font-size:16px}
.hud .barwrap{width:120px;height:8px;background:rgba(0,0,0,.4);border-radius:4px;border:1px solid rgba(94,234,212,.3);overflow:hidden}
.hud .bar{height:100%;background:linear-gradient(90deg,#4ade80,#22d3ee);transition:width .25s}
.hud .hpwrap{width:88px;height:10px;background:rgba(0,0,0,.4);border-radius:5px;border:1px solid rgba(248,113,113,.4);overflow:hidden;position:relative}
.hud .hp{height:100%;background:linear-gradient(90deg,#f87171,#dc2626);transition:width .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.hud .hp.low{background:linear-gradient(90deg,#fbbf24,#ea580c);animation:pulse 0.6s ease-in-out infinite}
.hud .hp.crit{background:linear-gradient(90deg,#f87171,#991b1b);animation:pulse 0.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.ov{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(6,42,79,.9),rgba(2,16,31,.98));display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;padding:20px;border-radius:14px;text-align:center}
.ov.show{display:flex}
.ov h2{font-size:2.4rem;color:#5eead4;text-shadow:0 0 25px rgba(94,234,212,.5),0 2px 0 #042f2e;letter-spacing:.04em}
.ov h2.lose{color:#f87171;text-shadow:0 0 25px rgba(248,113,113,.4),0 2px 0 #450a0a}
.ov p{color:#a5f3fc;font-size:15px;line-height:1.5;max-width:420px}
.ov .btn{background:linear-gradient(180deg,#22d3ee,#0891b2);color:#042f2e;border:1px solid #155e75;
  padding:12px 28px;border-radius:10px;font-weight:900;cursor:pointer;font-size:14px;
  transition:.15s;letter-spacing:.1em;text-transform:uppercase;font-family:inherit;box-shadow:0 3px 0 #155e75}
.ov .btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #155e75,0 0 18px rgba(34,211,238,.4)}

.hbtn{position:fixed;top:12px;left:12px;z-index:999;background:rgba(2,16,31,.75);color:#a5f3fc;text-decoration:none;padding:6px 14px;border-radius:20px;font-size:13px;backdrop-filter:blur(8px);border:1px solid rgba(94,234,212,.3);transition:.2s}
.hbtn:hover{background:rgba(8,145,178,.5);color:#e0f7fa}

.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:#a5f3fc;font-size:12px;opacity:.8;letter-spacing:.05em;pointer-events:none;text-align:center;width:100%}
</style>
</head>
<body>
<a href="/" class="hbtn">← Games</a>
<div class="wrap">
  <canvas id="c" width="800" height="560"></canvas>

  <div class="hud">
    <div class="box">
      <span class="lbl">Grow</span>
      <div class="barwrap"><div class="bar" id="xpBar" style="width:0%"></div></div>
      <span id="tierTxt">Tier 1</span>
    </div>
    <div class="box">
      <span class="lbl">Score</span>
      <span id="sc">0</span>
    </div>
    <div class="box">
      <span class="lbl">HP</span>
      <div class="hpwrap"><div class="hp" id="hpBar" style="width:100%"></div></div>
      <span class="lives" id="lives">🐟🐟🐟</span>
    </div>
  </div>

  <div class="hint">Move: mouse/touch/arrows · Bite: click / SPACE / tap · Kill fish → drops 🍖 meat · Bite meat to grow</div>

  <div class="ov" id="ov">
    <h2 id="ov-title">🐠 Feeding Frenzy</h2>
    <p id="ov-msg">Eat smaller fish to grow. Dodge bigger ones, clams that snap shut, mines and submarines.</p>
    <button class="btn" id="ov-btn" onclick="hideOv();start()">Dive In</button>
  </div>
</div>

<script src="_esc-back.js"></script>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = C.width, H = C.height;              // on-screen viewport
// World is MUCH bigger than viewport — camera follows the player
// Mario-style so the ocean feels like a real place to explore.
const WORLD_W = 2400, WORLD_H = 1200;
const SURFACE_Y = 0;                          // water top edge
const FLOOR_Y = WORLD_H - 40;                 // sand starts here

// ─── Tier definitions ───────────────────────────────────────
// All attacks are BITES. A fish can bite anything whose size is close
// to its own size or smaller; bigger prey takes more bites to kill but
// is still bite-able. Bites deal damage proportional to the biter's
// size. When a fish's HP hits 0 it drops a MEAT chunk that must also
// be bitten to actually consume (no more instant-eat on touch).
const BITE_RANGE = 10;          // bite reach in px beyond the biter's own size
const BITE_COOL = 28;           // frames between bites
const BITE_ACTIVE = 10;         // frames the jaw is open
const TIERS = [
  { size: 18, xpNeeded: 60,  label: 'Tier 1', color:'#ff6b35', fin:'#c53030', hp: 3 },
  { size: 28, xpNeeded: 140, label: 'Tier 2', color:'#06b6d4', fin:'#0e7490', hp: 4 },
  { size: 42, xpNeeded: 260, label: 'Tier 3', color:'#eab308', fin:'#854d0e', hp: 6 },
  { size: 62, xpNeeded: 999, label: 'Tier 4', color:'#dc2626', fin:'#450a0a', hp: 9 },
];

// HP for any fish scales with its size; bigger = tougher but not
// invincible. Minimum 1 HP so the smallest minnow dies in one bite.
function fishMaxHp(size){ return Math.max(1, Math.ceil(size / 8)); }
// Bite damage = ceil(biter.size / 10), minimum 1.
function biteDmg(size){ return Math.max(1, Math.ceil(size / 10)); }

// ─── Enemy / prey archetype — soft chibi fish ───────────────
const FISH_KINDS = [
  { s: 10, color: '#fde047', fin: '#eab308', name: 'minnow' },     // yellow tiny
  { s: 14, color: '#fb923c', fin: '#c2410c', name: 'clown' },      // orange small
  { s: 18, color: '#f472b6', fin: '#be185d', name: 'pink' },       // pink
  { s: 22, color: '#60a5fa', fin: '#1d4ed8', name: 'blue' },       // blue medium
  { s: 28, color: '#a78bfa', fin: '#5b21b6', name: 'purple' },     // purple large
  { s: 36, color: '#34d399', fin: '#047857', name: 'green' },      // green bigger
  { s: 46, color: '#f87171', fin: '#991b1b', name: 'red-tuna' },   // big predator-ish
  { s: 58, color: '#64748b', fin: '#1e293b', name: 'shark-like' }, // huge
];

// Game state
let state;
let mouse = { x: W/2, y: H/2, active: false };
const keys = {};

function start(){
  const t0 = TIERS[0];
  state = {
    player: {
      x: WORLD_W/2, y: WORLD_H/2, vx: 0, vy: 0,
      size: t0.size, tier: 0,
      xp: 0, score: 0, lives: 3,
      facing: 1,
      alive: true, invuln: 0,
      wiggle: 0,
      hp: t0.hp, maxHp: t0.hp,
      biteCool: 0, biteActive: 0,
      wantBite: false,
    },
    cam: { x: WORLD_W/2 - W/2, y: WORLD_H/2 - H/2 },
    fish: [],
    meat: [],             // floating meat chunks dropped from dead fish
    clams: [],
    mines: [],
    subs: [],
    bubbles: [],
    particles: [],
    popups: [],
    pearls: [],
    warnings: [],         // pending boss spawns: {side,y,kind,countdown}
    phase: 'play',
    frame: 0,
    waveCool: 0,
    subCool: 240,
  };
  // Clams spread across the ENTIRE sea floor, not just the viewport
  const clamCount = Math.floor(WORLD_W / 400);
  for(let i = 0; i < clamCount; i++){
    state.clams.push({
      x: 200 + i * 400 + Math.random() * 120,
      y: FLOOR_Y - 4,
      state: 'closed',
      t: Math.random() * 240,
      pearl: true,
    });
  }
  // Fill the world with fish
  for(let i = 0; i < 40; i++) spawnFish(true);
  // Pre-fill bubbles everywhere in the world
  for(let i = 0; i < 40; i++) spawnBubble(true);
}

// ─── Spawning ───────────────────────────────────────────────
// Spawn weights per tier: [small 0-2, mid 3-4, big 5-6, BOSS 7].
// Higher tiers = fewer snacks, more predators — forces tight weaving.
const TIER_WEIGHTS = {
  0: [0.75, 0.18, 0.05, 0.02],
  1: [0.55, 0.25, 0.14, 0.06],
  2: [0.35, 0.28, 0.25, 0.12],
  3: [0.18, 0.22, 0.35, 0.25],  // Tier 4 player — ocean gets dangerous
};
function pickKindIndex(){
  const tier = state.player.tier;
  const weights = TIER_WEIGHTS[tier] || TIER_WEIGHTS[0];
  const r = Math.random();
  let acc = 0;
  for(let i = 0; i < weights.length; i++){
    acc += weights[i];
    if(r < acc){
      // Map bucket → FISH_KINDS indices
      if(i === 0) return Math.floor(Math.random() * 3);          // 0..2 (tiny-small)
      if(i === 1) return 3 + Math.floor(Math.random() * 2);      // 3..4 (medium)
      if(i === 2) return 5 + Math.floor(Math.random() * 2);      // 5..6 (large)
      return 7;                                                  // BOSS shark-like
    }
  }
  return 0;
}

function spawnFish(initial){
  const kindIndex = pickKindIndex();
  const kind = FISH_KINDS[kindIndex];
  // Boss fish (not initial fill) get a 90-frame warning instead of
  // spawning immediately — classic red "!" telegraph.
  if(!initial && kindIndex === 7){
    scheduleBossSpawn(kind);
    return;
  }
  const kind = FISH_KINDS[kindIndex];
  // Initial fill uses the whole world; subsequent spawns come from either
  // horizontal world edge and drift across.
  const fromLeft = Math.random() < 0.5;
  const x = initial ? Math.random() * WORLD_W
                    : (fromLeft ? -kind.s - 10 : WORLD_W + kind.s + 10);
  // Keep fish out of the surface sliver and the sand floor
  const y = 60 + Math.random() * (FLOOR_Y - 120);
  // Base speed rises for predators as the player tiers up — late game
  // sharks move noticeably faster than early-game ones.
  const predatorBoost = kindIndex >= 5 ? 1 + state.player.tier * 0.35 : 1;
  const sp = (0.15 + Math.random() * 0.45 + kind.s * 0.006) * predatorBoost;
  const maxHp = fishMaxHp(kind.s);
  state.fish.push({
    x, y,
    vx: fromLeft ? sp : -sp,
    vy: 0,
    baseSp: sp,          // AI steers by setting vx/vy relative to this
    size: kind.s,
    kind,
    wobble: Math.random() * Math.PI * 2,
    wobSpeed: 0.05 + Math.random() * 0.04,
    poisonous: kind.s === 28 && Math.random() < 0.15,
    puff: 0,
    // Combat state
    hp: maxHp, maxHp,
    hurtFlash: 0,
    biteCool: 30 + Math.random() * 60,
    biteActive: 0,
    aiCool: Math.floor(Math.random() * 30),
    target: null,        // {kind:'fish'|'meat', ref}
    fleeing: false,
  });
}

// Boss predator — telegraph before spawning so the player can reposition.
// Warning sits at the correct side edge of the viewport at the
// predator's incoming y-level, with a flashing red "!" and halo.
function scheduleBossSpawn(kind){
  const fromLeft = Math.random() < 0.5;
  const camCenterY = state.cam.y + H/2;
  const y = camCenterY + (Math.random() - 0.5) * (H * 0.7);
  state.warnings.push({
    side: fromLeft ? 'left' : 'right',
    y,
    kind,
    countdown: 90,       // ~1.8s at 50fps
  });
}

function spawnBubble(initial){
  state.bubbles.push({
    x: Math.random() * WORLD_W,
    y: initial ? Math.random() * WORLD_H : WORLD_H + 10,
    r: 2 + Math.random() * 6,
    vy: -0.2 - Math.random() * 0.5,
  });
}

function spawnSubmarine(){
  // Sub crosses the viewport near the player's y
  const fromLeft = Math.random() < 0.5;
  const camCenterY = state.cam.y + H/2;
  state.subs.push({
    x: fromLeft ? state.cam.x - 120 : state.cam.x + W + 120,
    y: camCenterY + (Math.random() - 0.5) * (H - 240),
    vx: fromLeft ? 1.4 : -1.4,
    w: 100, h: 44,
    bob: 0,
  });
}

function spawnMine(){
  // Mines bob around the player's current area for pressure
  state.mines.push({
    x: state.cam.x + 60 + Math.random() * (W - 120),
    y: Math.max(80, state.cam.y + 90) + Math.random() * (H - 180),
    r: 14,
    flash: 0,
    life: 600 + Math.random() * 400,
  });
}

// ─── Input ──────────────────────────────────────────────────
// Mouse tracked on the WHOLE window — leaving the canvas no longer
// kills control; the fish just follows wherever the cursor is, clamped
// by the viewport. Coords are stored in SCREEN space and translated to
// world space when consumed (mouse.x + cam.x) so the camera doesn't
// change the control feel.
function screenFromEvent(clientX, clientY){
  const r = C.getBoundingClientRect();
  mouse.x = (clientX - r.left) * (W / r.width);
  mouse.y = (clientY - r.top) * (H / r.height);
  mouse.active = true;
}
window.addEventListener('mousemove', e => screenFromEvent(e.clientX, e.clientY));
// Mouse click, spacebar and touch tap all trigger a BITE
C.addEventListener('mousedown', e => { if(e.button === 0 && state && state.player) state.player.wantBite = true; });
C.addEventListener('touchstart', e => {
  e.preventDefault();
  if(e.touches.length) screenFromEvent(e.touches[0].clientX, e.touches[0].clientY);
  if(state && state.player) state.player.wantBite = true;
}, { passive: false });
C.addEventListener('touchmove', e => {
  e.preventDefault();
  if(e.touches.length) screenFromEvent(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
// If the user alt-tabs back, don't let the player suddenly rocket
// toward a stale cursor position — clear control until next real move.
window.addEventListener('blur', () => mouse.active = false);
addEventListener('keydown', e => {
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if((e.code === 'Space' || e.code === 'KeyJ') && state && state.player){
    state.player.wantBite = true;
  }
});
addEventListener('keyup', e => keys[e.code] = false);

// ─── Core game logic ────────────────────────────────────────
function update(){
  if(state.phase !== 'play') return;
  const p = state.player;
  state.frame++;

  // Player movement — mouse lerp or arrow keys (keyboard wins while held)
  const kx = (keys.ArrowRight||keys.KeyD?1:0) - (keys.ArrowLeft||keys.KeyA?1:0);
  const ky = (keys.ArrowDown||keys.KeyS?1:0) - (keys.ArrowUp||keys.KeyW?1:0);
  if(kx || ky){
    const ln = Math.hypot(kx, ky) || 1;
    p.vx = (kx/ln) * 4.5;
    p.vy = (ky/ln) * 4.5;
  } else if(mouse.active){
    // Mouse is in SCREEN space → convert to world by adding camera offset
    const tx = mouse.x + state.cam.x;
    const ty = mouse.y + state.cam.y;
    const dx = tx - p.x, dy = ty - p.y;
    const d = Math.hypot(dx, dy);
    if(d > 6){
      const speed = Math.min(5, d * 0.08);
      p.vx = (dx/d) * speed;
      p.vy = (dy/d) * speed;
    } else {
      p.vx *= 0.8; p.vy *= 0.8;
    }
  } else {
    p.vx *= 0.9; p.vy *= 0.9;
  }
  p.x += p.vx; p.y += p.vy;
  // Clamp to WORLD bounds (not viewport). Also keep player under surface.
  p.x = Math.max(p.size, Math.min(WORLD_W - p.size, p.x));
  p.y = Math.max(SURFACE_Y + p.size, Math.min(FLOOR_Y - p.size, p.y));
  if(Math.abs(p.vx) > 0.3) p.facing = p.vx > 0 ? 1 : -1;
  p.wiggle += 0.3;
  if(p.invuln > 0) p.invuln--;

  // Camera smoothly follows the player (Mario-style), clamped to world
  const camTargetX = p.x - W/2;
  const camTargetY = p.y - H/2;
  state.cam.x += (camTargetX - state.cam.x) * 0.1;
  state.cam.y += (camTargetY - state.cam.y) * 0.1;
  state.cam.x = Math.max(0, Math.min(WORLD_W - W, state.cam.x));
  state.cam.y = Math.max(0, Math.min(WORLD_H - H, state.cam.y));

  // Fish update — AI steering + bite
  for(const f of state.fish){
    if(f.biteCool > 0) f.biteCool--;
    if(f.biteActive > 0) f.biteActive--;
    if(f.hurtFlash > 0) f.hurtFlash--;
    f.aiCool--;

    // Re-plan target every ~30 frames
    if(f.aiCool <= 0){
      f.aiCool = 30 + Math.floor(Math.random() * 20);
      planFishAI(f);
    }

    // Steer based on current target
    steerFish(f);

    f.x += f.vx;
    f.wobble += f.wobSpeed;
    f.y += Math.sin(f.wobble) * 0.3;
    // Clamp Y so AI fish don't swim into sky or sand
    f.y = Math.max(SURFACE_Y + 20, Math.min(FLOOR_Y - 20, f.y));
    if(f.poisonous){ f.puff = (f.puff + 1) % 180; }

    // Try bite if AI target in range
    if(f.biteCool === 0 && f.target && !f.fleeing){
      const tx = f.target.x, ty = f.target.y;
      const dx = tx - f.x, dy = ty - f.y;
      const d = Math.hypot(dx, dy);
      if(d < f.size + BITE_RANGE + 4){
        performBite(f, tx, ty);
      }
    }
  }
  // Prune fish that have swum off the WORLD edges or died this frame
  state.fish = state.fish.filter(f => !f._dead && f.x > -120 && f.x < WORLD_W + 120);

  // Tick boss-spawn warnings and release the predator when countdown ends
  for(const w of state.warnings){
    w.countdown--;
    // Keep the warning's y lined up with current camera center as the
    // player swims, so the arrow stays relevant.
    const camCenterY = state.cam.y + H/2;
    w.y += (camCenterY + (w._offsetY || 0) - w.y) * 0.05;
  }
  for(const w of state.warnings){
    if(w.countdown > 0) continue;
    const kind = w.kind;
    const fromLeft = w.side === 'left';
    const maxHp = fishMaxHp(kind.s);
    const sp = (0.15 + Math.random() * 0.45 + kind.s * 0.006) * (1 + state.player.tier * 0.4);
    state.fish.push({
      x: fromLeft ? state.cam.x - kind.s - 20 : state.cam.x + W + kind.s + 20,
      y: w.y, vx: fromLeft ? sp * 1.8 : -sp * 1.8, vy: 0,
      baseSp: sp, size: kind.s, kind,
      wobble: Math.random() * Math.PI * 2, wobSpeed: 0.05 + Math.random() * 0.04,
      poisonous: false, puff: 0,
      hp: maxHp, maxHp, hurtFlash: 0,
      biteCool: 30, biteActive: 0, aiCool: 0, target: null, fleeing: false,
      isBoss: true,
    });
    spawnBurst(fromLeft ? state.cam.x : state.cam.x + W, w.y, '#f87171', 15);
  }
  state.warnings = state.warnings.filter(w => w.countdown > 0);

  // Steady spawning — more fish because the world is bigger
  state.waveCool--;
  if(state.waveCool <= 0 && state.fish.length < 55){
    spawnFish();
    state.waveCool = 18 + Math.floor(Math.random() * 20);
  }

  // Bubbles (rise across whole world)
  for(const b of state.bubbles){
    b.y += b.vy;
    b.x += Math.sin(b.y * 0.02) * 0.2;
  }
  state.bubbles = state.bubbles.filter(b => b.y > -10);
  if(Math.random() < 0.15) spawnBubble();

  // Clams — slow open/close cycle. Closing while player is inside = death.
  for(const cl of state.clams){
    cl.t++;
    if(cl.state === 'closed' && cl.t > 240){ cl.state = 'opening'; cl.t = 0; }
    else if(cl.state === 'opening' && cl.t > 30){ cl.state = 'open'; cl.t = 0; }
    else if(cl.state === 'open' && cl.t > 150){ cl.state = 'closing'; cl.t = 0; }
    else if(cl.state === 'closing' && cl.t > 20){ cl.state = 'closed'; cl.t = 0; }
  }

  // Mines — bomb timer; occasionally spawn more as difficulty scales
  for(const m of state.mines){ m.flash += 0.14; m.life--; }
  state.mines = state.mines.filter(m => m.life > 0);
  if(p.tier >= 1 && state.mines.length < Math.min(1 + p.tier, 4) && Math.random() < 0.004) spawnMine();

  // Submarines — periodic cross-screen hazard, more frequent at higher tiers
  state.subCool--;
  if(state.subCool <= 0){
    spawnSubmarine();
    state.subCool = 400 - p.tier * 60 + Math.random() * 180;
  }
  for(const s of state.subs){ s.x += s.vx; s.bob += 0.08; s.y += Math.sin(s.bob) * 0.2; }
  // Subs despawn once they leave the player's viewport by a good margin
  state.subs = state.subs.filter(s =>
    s.x > state.cam.x - 300 && s.x < state.cam.x + W + 300);

  // Particles
  for(const pa of state.particles){
    pa.x += pa.vx; pa.y += pa.vy; pa.vy += 0.05; pa.life--;
  }
  state.particles = state.particles.filter(pa => pa.life > 0);

  // Score popups
  for(const pp of state.popups){ pp.y -= 0.7; pp.life--; }
  state.popups = state.popups.filter(pp => pp.life > 0);

  // ─── Player bite ─────────────────────────────────────────
  if(p.biteCool > 0) p.biteCool--;
  if(p.biteActive > 0) p.biteActive--;
  if(p.wantBite && p.biteCool === 0 && p.invuln === 0){
    // Bite in the direction the player is facing
    performBite(p, p.x + p.facing * (p.size + 6), p.y);
    p.wantBite = false;
  } else {
    p.wantBite = false;  // decay unused intent
  }

  // ─── Meat chunks — drift, decay, consumable by any fish ──
  for(const m of state.meat){
    m.vy += 0.015;
    if(m.vy > 0.6) m.vy = 0.6;
    m.x += m.vx; m.y += m.vy;
    m.vx *= 0.995;
    // Rest on floor
    if(m.y > FLOOR_Y - 6){ m.y = FLOOR_Y - 6; m.vy = 0; }
    m.life--;
    m.wobble += 0.04;
  }
  state.meat = state.meat.filter(m => m.life > 0 && m.hp > 0);

  // Poisonous pufferfish spikes — damage, not instant death
  if(p.invuln === 0){
    for(const f of state.fish){
      if(!f.poisonous || f.puff < 90) continue;
      const puffR = f.size + 8;
      const d = Math.hypot(p.x - f.x, p.y - f.y);
      if(d < p.size + puffR){ damagePlayer(2, f); break; }
    }
  }

  // Clams — contact with closed/closing clam at the pearl spot is lethal
  if(p.invuln === 0){
    for(const cl of state.clams){
      const d = Math.hypot(p.x - cl.x, p.y - (cl.y - 20));
      if(d < p.size + 8 && (cl.state === 'closing' || (cl.state === 'closed' && cl.t < 20))){
        return die('🦪 Snapped by a clam!');
      }
      // Eating the pearl (open state): +15
      if(cl.state === 'open' && cl.pearl !== false && d < p.size + 10){
        cl.pearl = false;
        p.score += 25; p.xp += 10;
        pushPopup(cl.x, cl.y - 24, '+25 🦪');
        spawnBurst(cl.x, cl.y - 20, '#fef3c7', 10);
      }
    }
    // Reset pearls when clam reopens
    for(const cl of state.clams) if(cl.state === 'opening' && cl.pearl === false) cl.pearl = true;
  }

  // Mines
  if(p.invuln === 0){
    for(const m of state.mines){
      if(Math.hypot(p.x - m.x, p.y - m.y) < p.size + m.r){
        return die('💥 Mine! Boom.');
      }
    }
  }

  // Submarines — big instant death (not fish-sized, treat as predator)
  if(p.invuln === 0){
    for(const s of state.subs){
      if(p.x > s.x - s.w/2 && p.x < s.x + s.w/2 &&
         p.y > s.y - s.h/2 && p.y < s.y + s.h/2){
        return die('🚤 Hit by a submarine!');
      }
    }
  }

  // Check tier-up
  const nextTier = TIERS[p.tier];
  if(nextTier && p.xp >= nextTier.xpNeeded && p.tier < TIERS.length - 1){
    p.tier++;
    p.xp = 0;
    const t = TIERS[p.tier];
    p.size = t.size;
    p.maxHp = t.hp;
    p.hp = t.hp;
    pushPopup(p.x, p.y - 40, '✨ EVOLVED!');
    spawnBurst(p.x, p.y, '#fde047', 30);
    p.invuln = 60;
  }

  updateHUD();
}

// ─── Combat helpers (bite / damage / meat) ─────────────────
// Triggers an "open jaws" state on the biter and damages any eligible
// target in a cone in front of them. Works for both player and AI fish.
function performBite(biter, atX, atY){
  biter.biteCool = BITE_COOL;
  biter.biteActive = BITE_ACTIVE;

  const reach = biter.size + BITE_RANGE;
  const biterSize = biter.size;
  const dmg = biteDmg(biterSize);

  // 1) Bite fish — the biter can hurt any fish of comparable or smaller
  //    size (within 1.5x of its own size). Larger whales shrug off its
  //    nibble. This is what lets a food chain exist.
  for(let i = state.fish.length - 1; i >= 0; i--){
    const t = state.fish[i];
    if(t === biter) continue;
    const d = Math.hypot(t.x - biter.x, t.y - biter.y);
    if(d > reach + t.size) continue;
    // Only bite within bite "cone" — target must be ahead of us
    const ahead = ((t.x - biter.x) * (atX - biter.x) + (t.y - biter.y) * (atY - biter.y));
    if(ahead < 0) continue;
    if(t.size > biterSize * 1.6) continue;  // way too big to hurt
    damageFish(t, dmg, biter);
  }

  // 2) Bite player (AI biting us) — handled in the fish-vs-player collision
  //    check below, but we fold it in here to reuse the cone logic.
  if(biter !== state.player){
    const p = state.player;
    if(p.invuln === 0){
      const d = Math.hypot(p.x - biter.x, p.y - biter.y);
      const ahead = ((p.x - biter.x) * (atX - biter.x) + (p.y - biter.y) * (atY - biter.y));
      if(d < reach + p.size && ahead >= 0 && biter.size >= p.size * 0.8){
        damagePlayer(dmg, biter);
      }
    }
  }

  // 3) Bite meat — any biter can consume meat, gives XP+score
  for(let i = state.meat.length - 1; i >= 0; i--){
    const m = state.meat[i];
    const d = Math.hypot(m.x - biter.x, m.y - biter.y);
    if(d > reach + m.r) continue;
    const ahead = ((m.x - biter.x) * (atX - biter.x) + (m.y - biter.y) * (atY - biter.y));
    if(ahead < 0) continue;
    m.hp -= dmg;
    spawnBurst(m.x, m.y, '#fda4af', 4);
    if(m.hp <= 0){
      if(biter === state.player){
        const pts = Math.round(m.originSize * 2);
        biter.score += pts;
        biter.xp += Math.max(2, Math.round(m.originSize / 3));
        pushPopup(m.x, m.y - 10, '+' + pts + ' 🍖');
      }
      spawnBurst(m.x, m.y, '#fda4af', 12);
      state.meat.splice(i, 1);
    }
  }

  // Visual: small burst of water/bubbles from jaw
  spawnBurst(atX, atY, 'rgba(255,255,255,.7)', 3);
}

function damageFish(target, dmg, source){
  target.hp -= dmg;
  target.hurtFlash = 8;
  // Knockback a touch
  const dx = target.x - source.x, dy = target.y - source.y;
  const d = Math.hypot(dx, dy) || 1;
  target.vx += (dx/d) * 1.2;
  target.vy += (dy/d) * 0.6;
  spawnBurst(target.x, target.y, '#ef4444', 4);
  if(target.hp <= 0){
    dropMeat(target);
    // Remove fish next frame to avoid splicing while iterating callers
    target._dead = true;
  }
}

function damagePlayer(dmg, source){
  const p = state.player;
  p.hp -= dmg;
  p.invuln = 24;  // brief i-frames so we don't get instagibbed by overlap
  // Knockback
  const dx = p.x - source.x, dy = p.y - source.y;
  const d = Math.hypot(dx, dy) || 1;
  p.vx += (dx/d) * 3;
  p.vy += (dy/d) * 1.5;
  spawnBurst(p.x, p.y, '#dc2626', 8);
  pushPopup(p.x, p.y - 20, '-' + dmg + ' HP');
  if(p.hp <= 0) die('🦈 Eaten by a bigger fish!');
}

function dropMeat(f){
  // Meat = chunk size based on original fish size, HP so it takes a few
  // bites to consume (bigger fish = more meat).
  const meatHp = Math.max(1, Math.ceil(f.size / 10));
  state.meat.push({
    x: f.x, y: f.y,
    vx: (Math.random() - 0.5) * 0.6,
    vy: -0.4,
    r: Math.max(6, f.size * 0.55),
    hp: meatHp, maxHp: meatHp,
    originSize: f.size,
    life: 900,          // ~18s at 50fps
    wobble: Math.random() * Math.PI * 2,
  });
  spawnBurst(f.x, f.y, '#fca5a5', 12);
}

// ─── Fish AI ───────────────────────────────────────────────
// Each fish picks a target: nearest MEAT if any, else nearest smaller
// FISH, else nearest PLAYER if it can bite us. If a MUCH bigger threat
// is close, flee instead.
function planFishAI(f){
  const SIGHT = 240;
  let bestTarget = null, bestD = Infinity, fleeTarget = null, fleeD = Infinity;

  // Scan meat
  for(const m of state.meat){
    const d = Math.hypot(m.x - f.x, m.y - f.y);
    if(d < bestD && d < SIGHT){ bestD = d; bestTarget = { x:m.x, y:m.y, ref:m, kind:'meat' }; }
  }
  // Scan fish
  for(const o of state.fish){
    if(o === f) continue;
    const d = Math.hypot(o.x - f.x, o.y - f.y);
    if(d > SIGHT) continue;
    if(o.size > f.size * 1.3){
      // Flee threat
      if(d < fleeD){ fleeD = d; fleeTarget = { x:o.x, y:o.y, ref:o, kind:'threat' }; }
    } else if(o.size <= f.size * 0.95 && d < bestD){
      bestD = d; bestTarget = { x:o.x, y:o.y, ref:o, kind:'fish' };
    }
  }
  // Player as prey? Only if player is clearly smaller
  const p = state.player;
  const pd = Math.hypot(p.x - f.x, p.y - f.y);
  if(pd < SIGHT){
    if(p.size < f.size * 0.95 && pd < bestD){
      bestTarget = { x:p.x, y:p.y, ref:p, kind:'player' };
      bestD = pd;
    } else if(p.size > f.size * 1.3 && pd < fleeD){
      // Player too big → flee
      fleeTarget = { x:p.x, y:p.y, ref:p, kind:'threat' };
      fleeD = pd;
    }
  }

  if(fleeTarget && fleeD < 100){
    f.target = fleeTarget;
    f.fleeing = true;
  } else {
    f.target = bestTarget;   // may be null → wander
    f.fleeing = false;
  }
}

function steerFish(f){
  // Per-fish wander noise & occasional pause
  if(f.wanderAngle === undefined){
    f.wanderAngle = Math.random() * Math.PI * 2;
    f.pauseT = 0;
    f.burstT = 0;
  }
  // Drift the wander angle (perlin-ish random walk)
  f.wanderAngle += (Math.random() - 0.5) * 0.4;

  // Rare idle pause — fish briefly slow down even mid-hunt, feels alive
  if(f.pauseT > 0) f.pauseT--;
  else if(!f.target && Math.random() < 0.004) f.pauseT = 40 + Math.random() * 40;

  // Panic-burst timer bleeds off
  if(f.burstT > 0) f.burstT--;

  const sp = f.baseSp + 0.3;
  const speedMul = f.pauseT > 0 ? 0.25 : (f.burstT > 0 ? 2.1 : 1);

  if(f.target){
    // Track live target position
    if(f.target.ref){ f.target.x = f.target.ref.x; f.target.y = f.target.ref.y; }
    const dx = f.target.x - f.x;
    const dy = f.target.y - f.y;
    const d = Math.hypot(dx, dy) || 1;
    const sign = f.fleeing ? -1 : 1;

    // Hunters zigzag toward prey (sideways wobble in the normal)
    const nx = -dy/d, ny = dx/d;
    const zig = sign > 0 ? Math.sin(state.frame * 0.12 + f.wobble) * 0.7 : 0;

    // Fleeing fish occasionally burst-sprint perpendicular to avoid hits
    if(f.fleeing && f.burstT === 0 && Math.random() < 0.02) f.burstT = 24;

    const desiredVx = ((dx/d) * sp * sign + nx * zig * sp) * speedMul;
    const desiredVy = ((dy/d) * sp * sign + ny * zig * sp) * speedMul;
    // Softer lerp = less snappy, more flowing
    const lerp = f.fleeing ? 0.18 : 0.08;
    f.vx += (desiredVx - f.vx) * lerp;
    f.vy += (desiredVy - f.vy) * lerp;
  } else {
    // Wander — drift in current wander direction, occasional direction reset
    const wvx = Math.cos(f.wanderAngle) * sp * 0.6 * speedMul;
    const wvy = Math.sin(f.wanderAngle) * sp * 0.3 * speedMul;
    f.vx += (wvx - f.vx) * 0.03;
    f.vy += (wvy - f.vy) * 0.05;
    // Rare sharp turn
    if(Math.random() < 0.004) f.wanderAngle += (Math.random() - 0.5) * 2;
  }

  // Clamp speed
  const v = Math.hypot(f.vx, f.vy);
  const vmax = sp * 2.6;
  if(v > vmax){ f.vx = (f.vx/v) * vmax; f.vy = (f.vy/v) * vmax; }
}

function die(msg){
  const p = state.player;
  spawnBurst(p.x, p.y, '#ef4444', 30);
  p.lives--;
  if(p.lives <= 0){
    state.phase = 'dead';
    showOv('💀 Game Over', `${msg}\n\nFinal score: ${p.score}\nTier reached: ${TIERS[p.tier].label}`, true);
    const key = 'frenzy_best';
    const best = +(localStorage[key] || 0);
    if(p.score > best){
      localStorage[key] = p.score;
      document.getElementById('ov-msg').textContent += '\n🏆 New best score!';
    } else {
      document.getElementById('ov-msg').textContent += `\nBest: ${best}`;
    }
  } else {
    // Respawn where the camera already is (center of viewport) so the
    // player doesn't get teleported across the whole world on each death.
    p.x = state.cam.x + W/2;
    p.y = state.cam.y + H/2;
    p.vx = 0; p.vy = 0;
    p.invuln = 90;
    p.hp = p.maxHp;
    pushPopup(p.x, p.y - 60, msg);
  }
}

function spawnBurst(x, y, color, n){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 3;
    state.particles.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 24 + Math.random()*16,
      color, r: 2 + Math.random() * 2,
    });
  }
}
function pushPopup(x, y, text){ state.popups.push({ x, y, text, life: 50 }); }

function updateHUD(){
  const p = state.player;
  const t = TIERS[p.tier];
  document.getElementById('sc').textContent = p.score;
  const pct = p.tier < TIERS.length - 1 ? Math.min(100, (p.xp / t.xpNeeded) * 100) : 100;
  document.getElementById('xpBar').style.width = pct + '%';
  document.getElementById('tierTxt').textContent = t.label;

  // Smooth HP bar + extra lives as fish icons beside it
  const hpPct = (p.hp / p.maxHp) * 100;
  const hpBar = document.getElementById('hpBar');
  hpBar.style.width = Math.max(0, hpPct) + '%';
  hpBar.classList.toggle('low', hpPct > 20 && hpPct <= 50);
  hpBar.classList.toggle('crit', hpPct <= 20);
  document.getElementById('lives').textContent = '🐟'.repeat(Math.max(0, p.lives - 1));
}

// ─── Rendering ──────────────────────────────────────────────
function drawFish(x, y, size, color, finColor, facing, wiggle, isPlayer, biting, hurtFlash){
  ctx.save();
  ctx.translate(x, y);
  if(facing < 0) ctx.scale(-1, 1);
  // Red flash when hit
  if(hurtFlash > 0) ctx.filter = 'brightness(1.6) saturate(2)';

  // Tail (sways with wiggle)
  const tailOff = Math.sin(wiggle) * 0.35;
  ctx.fillStyle = finColor;
  ctx.beginPath();
  ctx.moveTo(-size * 0.7, 0);
  ctx.lineTo(-size * 1.4, -size * 0.5 + tailOff * size);
  ctx.lineTo(-size * 1.2, 0);
  ctx.lineTo(-size * 1.4,  size * 0.5 - tailOff * size);
  ctx.closePath();
  ctx.fill();

  // Body — ellipse with soft shadow + highlight (micro 3D)
  const grad = ctx.createRadialGradient(-size*0.2, -size*0.3, size*0.1, 0, 0, size*1.1);
  grad.addColorStop(0, lighten(color, 0.35));
  grad.addColorStop(0.5, color);
  grad.addColorStop(1, darken(color, 0.3));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, size, size * 0.72, 0, 0, Math.PI*2);
  ctx.fill();

  // Outline
  ctx.strokeStyle = darken(color, 0.5);
  ctx.lineWidth = Math.max(1.5, size * 0.06);
  ctx.stroke();

  // Top fin
  ctx.fillStyle = finColor;
  ctx.beginPath();
  ctx.moveTo(-size * 0.2, -size * 0.65);
  ctx.quadraticCurveTo(0, -size * 1.05, size * 0.2, -size * 0.65);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Belly fin (small)
  ctx.beginPath();
  ctx.moveTo(-size * 0.05, size * 0.55);
  ctx.quadraticCurveTo(-size * 0.25, size * 0.9, -size * 0.35, size * 0.6);
  ctx.closePath();
  ctx.fill();

  // Eye — big white circle + black pupil, chibi style
  const eyeX = size * 0.42, eyeY = -size * 0.12, er = size * 0.26;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(eyeX, eyeY, er, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(eyeX + er*0.3, eyeY, er*0.55, 0, Math.PI*2); ctx.fill();
  // Shine
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.arc(eyeX + er*0.15, eyeY - er*0.3, er*0.3, 0, Math.PI*2); ctx.fill();

  // Mouth — open jaws during a bite, smile otherwise
  ctx.strokeStyle = darken(color, 0.55);
  ctx.lineWidth = Math.max(1.2, size * 0.05);
  if(biting){
    // Jaws apart with teeth
    ctx.fillStyle = '#1a0a0a';
    ctx.beginPath();
    ctx.ellipse(size*0.88, size*0.04, size*0.22, size*0.18, 0, 0, Math.PI*2);
    ctx.fill();
    // Teeth (3 little triangles top + bottom)
    ctx.fillStyle = '#fff';
    for(let i = -1; i <= 1; i++){
      ctx.beginPath();
      ctx.moveTo(size*(0.82 + i*0.06), size*0.00);
      ctx.lineTo(size*(0.85 + i*0.06), size*0.07);
      ctx.lineTo(size*(0.88 + i*0.06), size*0.00);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(size*(0.82 + i*0.06), size*0.08);
      ctx.lineTo(size*(0.85 + i*0.06), size*0.01);
      ctx.lineTo(size*(0.88 + i*0.06), size*0.08);
      ctx.closePath(); ctx.fill();
    }
  } else {
    ctx.beginPath();
    ctx.moveTo(size*0.75, size*0.08);
    ctx.quadraticCurveTo(size*0.88, size*0.14, size*0.96, size*0.04);
    ctx.stroke();
  }

  ctx.filter = 'none';
  ctx.restore();
}

// Fleshy pink chunk with little bones sticking out
function drawMeat(m){
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(Math.sin(m.wobble) * 0.1);
  // Body — soft pink gradient
  const g = ctx.createRadialGradient(-m.r*0.3, -m.r*0.3, m.r*0.2, 0, 0, m.r);
  g.addColorStop(0, '#fecdd3');
  g.addColorStop(1, '#be123c');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, m.r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#881337';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Little bones
  ctx.strokeStyle = '#f5f5f4';
  ctx.lineWidth = Math.max(1, m.r * 0.12);
  ctx.beginPath();
  ctx.moveTo(-m.r*0.5, 0); ctx.lineTo(m.r*0.5, 0);
  ctx.moveTo(-m.r*0.2, -m.r*0.5); ctx.lineTo(-m.r*0.2, m.r*0.5);
  ctx.stroke();
  // HP bar
  if(m.hp < m.maxHp){
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(-m.r, -m.r - 8, m.r*2, 3);
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(-m.r, -m.r - 8, m.r*2 * (m.hp/m.maxHp), 3);
  }
  ctx.restore();
}

// HP bar above damaged fish
function drawHpBar(x, y, w, hp, maxHp){
  if(hp >= maxHp) return;
  const h = 3;
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(x - w/2, y, w, h);
  ctx.fillStyle = hp / maxHp > 0.4 ? '#4ade80' : '#dc2626';
  ctx.fillRect(x - w/2, y, w * (hp/maxHp), h);
}

function lighten(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (n>>16) + Math.floor(255*amt));
  const g = Math.min(255, ((n>>8)&255) + Math.floor(255*amt));
  const b = Math.min(255, (n&255) + Math.floor(255*amt));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function darken(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, (n>>16) - Math.floor(255*amt));
  const g = Math.max(0, ((n>>8)&255) - Math.floor(255*amt));
  const b = Math.max(0, (n&255) - Math.floor(255*amt));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function drawClam(cl){
  const x = cl.x, y = cl.y;
  // Shell bottom
  ctx.fillStyle = '#92400e';
  ctx.beginPath();
  ctx.ellipse(x, y, 40, 14, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Open-ness: closed=0, opening/open=1, closing=0 (linear)
  let openness = 0;
  if(cl.state === 'opening') openness = cl.t / 30;
  else if(cl.state === 'open') openness = 1;
  else if(cl.state === 'closing') openness = 1 - (cl.t / 20);

  // Top shell lifts
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-openness * 0.9);
  // Draw as half-ellipse
  const gradS = ctx.createLinearGradient(0, -40, 0, 10);
  gradS.addColorStop(0, '#fde68a');
  gradS.addColorStop(1, '#b45309');
  ctx.fillStyle = gradS;
  ctx.beginPath();
  ctx.ellipse(0, 0, 40, 20, 0, Math.PI, 0);
  ctx.fill();
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Ridges
  ctx.strokeStyle = 'rgba(120,53,15,.55)';
  ctx.lineWidth = 1;
  for(let i = -3; i <= 3; i++){
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(i*6, -14 + Math.abs(i)*1.5, i*10, -18 + Math.abs(i)*3);
    ctx.stroke();
  }
  ctx.restore();

  // Pearl if open & not eaten yet
  if(openness > 0.5 && cl.pearl !== false){
    const pg = ctx.createRadialGradient(x - 2, y - 22, 1, x, y - 20, 7);
    pg.addColorStop(0, '#fff');
    pg.addColorStop(1, '#f1e9c7');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(x, y - 20, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Warning flash if closing soon
  if(cl.state === 'open' && cl.t > 120){
    ctx.strokeStyle = `rgba(239,68,68,${0.3 + Math.sin(cl.t * 0.3) * 0.3})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y - 10, 46, Math.PI, 0); ctx.stroke();
  }
}

function drawMine(m){
  const alpha = 0.6 + Math.sin(m.flash) * 0.4;
  ctx.save();
  ctx.translate(m.x, m.y);
  // Spikes
  ctx.fillStyle = '#334155';
  for(let i = 0; i < 8; i++){
    const a = (i / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * m.r, Math.sin(a) * m.r);
    ctx.lineTo(Math.cos(a + 0.12) * (m.r + 8), Math.sin(a + 0.12) * (m.r + 8));
    ctx.lineTo(Math.cos(a - 0.12) * (m.r + 8), Math.sin(a - 0.12) * (m.r + 8));
    ctx.closePath();
    ctx.fill();
  }
  // Core
  const grad = ctx.createRadialGradient(-3, -3, 2, 0, 0, m.r);
  grad.addColorStop(0, '#64748b');
  grad.addColorStop(1, '#1e293b');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, m.r, 0, Math.PI*2); ctx.fill();
  // Red LED
  ctx.fillStyle = `rgba(239,68,68,${alpha})`;
  ctx.beginPath(); ctx.arc(4, -3, 3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawSub(s){
  ctx.save();
  ctx.translate(s.x, s.y);
  if(s.vx < 0) ctx.scale(-1, 1);
  // Body
  const grad = ctx.createLinearGradient(0, -s.h/2, 0, s.h/2);
  grad.addColorStop(0, '#fef08a');
  grad.addColorStop(0.5, '#fbbf24');
  grad.addColorStop(1, '#a16207');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, s.w/2, s.h/2, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 3;
  ctx.stroke();
  // Window
  ctx.fillStyle = '#0891b2';
  ctx.beginPath(); ctx.arc(s.w*0.25, -2, 7, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#78350f'; ctx.lineWidth = 2; ctx.stroke();
  // Propeller
  ctx.fillStyle = '#334155';
  ctx.beginPath(); ctx.ellipse(-s.w/2 - 6, 0, 3, 10 + Math.sin(s.bob*4)*2, 0, 0, Math.PI*2); ctx.fill();
  // Periscope
  ctx.fillStyle = '#a16207';
  ctx.fillRect(-4, -s.h/2 - 10, 5, 10);
  ctx.beginPath(); ctx.arc(-1, -s.h/2 - 12, 4, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawPufferSpikes(f){
  if(f.puff < 90) return;
  const t = (f.puff - 90) / 90;
  const r = f.size + 4 + t * 4;
  ctx.strokeStyle = `rgba(167,139,250,${0.6 + Math.sin(f.puff*0.2)*0.3})`;
  ctx.lineWidth = 2;
  for(let i = 0; i < 12; i++){
    const a = (i/12) * Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(f.x + Math.cos(a) * f.size, f.y + Math.sin(a) * f.size);
    ctx.lineTo(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r);
    ctx.stroke();
  }
}

function draw(){
  // ── 1. Background (viewport-sized gradient, not world-translated so
  //     the deep-ocean colors stay consistent as you swim down).
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  const depthT = state.cam.y / WORLD_H;  // 0 near top, ~1 near floor
  sky.addColorStop(0, depthT < 0.1 ? '#67e8f9' : '#0891b2');
  sky.addColorStop(0.5, '#075985');
  sky.addColorStop(1, '#082f49');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Everything world-space from here is drawn translated by -cam
  ctx.save();
  ctx.translate(-Math.floor(state.cam.x), -Math.floor(state.cam.y));

  // ── 2. Sky above surface (visible when camera near top)
  if(state.cam.y < 80){
    const skyGrad = ctx.createLinearGradient(0, SURFACE_Y - 80, 0, SURFACE_Y);
    skyGrad.addColorStop(0, '#60a5fa');
    skyGrad.addColorStop(1, '#67e8f9');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(state.cam.x, SURFACE_Y - 100, W, 100);
    // Sun
    ctx.fillStyle = 'rgba(253, 224, 71, .85)';
    ctx.beginPath(); ctx.arc(state.cam.x + W * 0.78, SURFACE_Y - 60, 26, 0, Math.PI*2); ctx.fill();
  }

  // ── 3. Water surface — animated wavy line at world y=0
  if(state.cam.y < 120){
    ctx.fillStyle = 'rgba(34, 211, 238, 0.7)';
    ctx.beginPath();
    ctx.moveTo(state.cam.x - 10, SURFACE_Y - 2);
    for(let x = state.cam.x - 10; x <= state.cam.x + W + 10; x += 10){
      const h = Math.sin(x * 0.018 + state.frame * 0.04) * 3;
      ctx.lineTo(x, SURFACE_Y + h);
    }
    ctx.lineTo(state.cam.x + W + 10, SURFACE_Y + 14);
    ctx.lineTo(state.cam.x - 10, SURFACE_Y + 14);
    ctx.closePath();
    ctx.fill();
    // Foam/highlights on the ridges
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let x = state.cam.x - 10; x <= state.cam.x + W + 10; x += 10){
      const h = Math.sin(x * 0.018 + state.frame * 0.04) * 3;
      if(x === state.cam.x - 10) ctx.moveTo(x, SURFACE_Y + h);
      else ctx.lineTo(x, SURFACE_Y + h);
    }
    ctx.stroke();
  }

  // ── 4. Light rays (viewport-locked for a steady god-ray feel, but
  //     drawn in world space with cam offset applied).
  for(let i = 0; i < 3; i++){
    const x = state.cam.x + (i + 1) * W / 4;
    const topY = Math.max(SURFACE_Y, state.cam.y);
    const gr = ctx.createLinearGradient(x, topY, x, state.cam.y + H);
    gr.addColorStop(0, 'rgba(255,255,255,.14)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.moveTo(x - 50, topY);
    ctx.lineTo(x + 50, topY);
    ctx.lineTo(x + 120, state.cam.y + H);
    ctx.lineTo(x - 120, state.cam.y + H);
    ctx.closePath();
    ctx.fill();
  }

  // ── 5. Sand floor — wavy band across the full world width
  if(state.cam.y + H > FLOOR_Y - 60){
    ctx.fillStyle = '#d4a373';
    ctx.beginPath();
    const startX = Math.max(0, state.cam.x - 20);
    const endX = Math.min(WORLD_W, state.cam.x + W + 20);
    ctx.moveTo(startX, WORLD_H);
    for(let x = startX; x <= endX; x += 20){
      ctx.lineTo(x, FLOOR_Y - Math.sin(x * 0.03 + state.frame * 0.01) * 4);
    }
    ctx.lineTo(endX, WORLD_H);
    ctx.closePath();
    ctx.fill();
  }

  // ── 6. Bubbles (only those inside viewport are worth drawing)
  ctx.strokeStyle = 'rgba(255,255,255,.6)';
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  for(const b of state.bubbles){
    if(b.x < state.cam.x - 20 || b.x > state.cam.x + W + 20) continue;
    if(b.y < state.cam.y - 20 || b.y > state.cam.y + H + 20) continue;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }

  // ── 7. Clams on floor
  for(const cl of state.clams){
    if(cl.x < state.cam.x - 60 || cl.x > state.cam.x + W + 60) continue;
    drawClam(cl);
  }

  // ── 8. Mines
  for(const m of state.mines) drawMine(m);

  // ── 8b. Meat chunks
  for(const m of state.meat){
    if(m.x < state.cam.x - 60 || m.x > state.cam.x + W + 60) continue;
    drawMeat(m);
  }

  // ── 9. Fish — sorted by size so bigger render on top; skip off-screen
  state.fish.sort((a,b) => a.size - b.size);
  for(const f of state.fish){
    if(f.x < state.cam.x - 80 || f.x > state.cam.x + W + 80) continue;
    if(f.y < state.cam.y - 80 || f.y > state.cam.y + H + 80) continue;
    drawFish(f.x, f.y, f.size, f.kind.color, f.kind.fin, f.vx > 0 ? 1 : -1, f.wobble,
             false, f.biteActive > 0, f.hurtFlash);
    drawHpBar(f.x, f.y - f.size - 10, f.size * 1.3, f.hp, f.maxHp);
    if(f.poisonous) drawPufferSpikes(f);
  }

  // ── 10. Submarines
  for(const s of state.subs) drawSub(s);

  // ── 11. Player — blink while invulnerable, white halo so always visible
  const p = state.player;
  if(!(p.invuln > 0 && Math.floor(p.invuln / 5) % 2 === 0)){
    const tier = TIERS[p.tier];
    ctx.save();
    const halo = ctx.createRadialGradient(p.x, p.y, p.size * 0.6, p.x, p.y, p.size * 1.6);
    halo.addColorStop(0, 'rgba(255,255,255,0.4)');
    halo.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 1.6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    drawFish(p.x, p.y, p.size, tier.color, tier.fin, p.facing, p.wiggle,
             true, p.biteActive > 0, 0);
  }

  // ── 12. Particles
  for(const pa of state.particles){
    ctx.fillStyle = pa.color;
    ctx.globalAlpha = Math.min(1, pa.life / 24);
    ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ── 13. Score popups
  ctx.font = 'bold 15px Verdana';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(const pp of state.popups){
    const a = Math.min(1, pp.life / 30);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.strokeStyle = `rgba(0,0,0,${a*0.6})`;
    ctx.lineWidth = 3;
    ctx.strokeText(pp.text, pp.x, pp.y);
    ctx.fillText(pp.text, pp.x, pp.y);
  }

  ctx.restore();

  // ── 14. Boss-spawn warnings (viewport edges, pulsing red "!")
  for(const w of state.warnings){
    // Screen Y from world Y
    const sy = Math.max(30, Math.min(H - 30, w.y - state.cam.y));
    const sx = w.side === 'left' ? 24 : W - 24;
    const flash = 0.4 + Math.sin(state.frame * 0.4) * 0.4;
    // Pulsing halo
    ctx.fillStyle = `rgba(220, 38, 38, ${flash * 0.5})`;
    ctx.beginPath(); ctx.arc(sx, sy, 28, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = `rgba(239, 68, 68, ${flash})`;
    ctx.beginPath(); ctx.arc(sx, sy, 20, 0, Math.PI*2); ctx.fill();
    // Big "!"
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px Verdana';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('!', sx, sy + 2);
    // Side arrow pointing where the boss comes from
    ctx.fillStyle = `rgba(220, 38, 38, ${flash})`;
    ctx.beginPath();
    if(w.side === 'left'){
      ctx.moveTo(sx + 22, sy - 8);
      ctx.lineTo(sx + 36, sy);
      ctx.lineTo(sx + 22, sy + 8);
    } else {
      ctx.moveTo(sx - 22, sy - 8);
      ctx.lineTo(sx - 36, sy);
      ctx.lineTo(sx - 22, sy + 8);
    }
    ctx.closePath(); ctx.fill();
  }

  // ── 15. Minimap (viewport-space, not world-translated)
  drawMinimap();
}

function drawMinimap(){
  const mw = 110, mh = 55;
  const mx = W - mw - 12, my = H - mh - 12;
  ctx.fillStyle = 'rgba(2, 16, 31, 0.6)';
  ctx.strokeStyle = 'rgba(94, 234, 212, 0.5)';
  ctx.lineWidth = 1;
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeRect(mx, my, mw, mh);
  // Player dot
  const px = mx + (state.player.x / WORLD_W) * mw;
  const py = my + (state.player.y / WORLD_H) * mh;
  ctx.fillStyle = TIERS[state.player.tier].color;
  ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2); ctx.fill();
  // Viewport rectangle
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.strokeRect(
    mx + (state.cam.x / WORLD_W) * mw,
    my + (state.cam.y / WORLD_H) * mh,
    (W / WORLD_W) * mw,
    (H / WORLD_H) * mh
  );
}

// ─── UI overlays ────────────────────────────────────────────
function showOv(title, msg, lose){
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-title').className = lose ? 'lose' : '';
  document.getElementById('ov-msg').textContent = msg;
  document.getElementById('ov-btn').textContent = lose ? 'Try Again' : 'Dive In';
  document.getElementById('ov').classList.add('show');
}
function hideOv(){ document.getElementById('ov').classList.remove('show'); }

// ─── Main loop ──────────────────────────────────────────────
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

// Initial intro screen on page load
start();
state.phase = 'intro';
showOv('🐠 Feeding Frenzy', 'The ocean is alive — every fish hunts.\nClick / SPACE / tap to BITE. Chew enemies down, then eat the 🍖 they drop.\nAvoid clams, mines, pufferfish, and submarines.', false);
loop();
</script>
</body>
