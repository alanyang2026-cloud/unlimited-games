<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feeding Frenzy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:
  radial-gradient(ellipse at top,#0e4f8a 0%,#062a4f 60%,#02101f 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
  font-family:'Segoe UI','Verdana',sans-serif;user-select:none;color:#e0f2fe;padding:12px;overflow:hidden}
h1{display:none}

.wrap{position:relative}
canvas{display:block;border-radius:14px;border:3px solid #0891b2;
  box-shadow:0 0 50px rgba(8,145,178,.5),inset 0 0 40px rgba(14,165,233,.15);
  background:linear-gradient(180deg,#2dd4bf 0%,#0891b2 30%,#075985 70%,#082f49 100%);
  max-width:100vw!important;max-height:calc(100vh - 24px)!important;height:auto!important;touch-action:none}

/* HUD overlaid on top-left/right of the canvas */
.hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;font-family:'Verdana',sans-serif;z-index:5}
.hud .box{background:rgba(2,30,55,.7);border:1px solid rgba(94,234,212,.4);border-radius:10px;padding:6px 14px;backdrop-filter:blur(6px);color:#e0f7fa;font-weight:900;display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.05em}
.hud .box .lbl{color:#94e2d9;font-size:10px;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.hud .lives{display:flex;gap:2px;font-size:16px}
.hud .barwrap{width:120px;height:8px;background:rgba(0,0,0,.4);border-radius:4px;border:1px solid rgba(94,234,212,.3);overflow:hidden}
.hud .bar{height:100%;background:linear-gradient(90deg,#4ade80,#22d3ee);transition:width .25s}

.ov{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(6,42,79,.9),rgba(2,16,31,.98));display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;padding:20px;border-radius:14px;text-align:center}
.ov.show{display:flex}
.ov h2{font-size:2.4rem;color:#5eead4;text-shadow:0 0 25px rgba(94,234,212,.5),0 2px 0 #042f2e;letter-spacing:.04em}
.ov h2.lose{color:#f87171;text-shadow:0 0 25px rgba(248,113,113,.4),0 2px 0 #450a0a}
.ov p{color:#a5f3fc;font-size:15px;line-height:1.5;max-width:420px}
.ov .btn{background:linear-gradient(180deg,#22d3ee,#0891b2);color:#042f2e;border:1px solid #155e75;
  padding:12px 28px;border-radius:10px;font-weight:900;cursor:pointer;font-size:14px;
  transition:.15s;letter-spacing:.1em;text-transform:uppercase;font-family:inherit;box-shadow:0 3px 0 #155e75}
.ov .btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #155e75,0 0 18px rgba(34,211,238,.4)}

.hbtn{position:fixed;top:12px;left:12px;z-index:999;background:rgba(2,16,31,.75);color:#a5f3fc;text-decoration:none;padding:6px 14px;border-radius:20px;font-size:13px;backdrop-filter:blur(8px);border:1px solid rgba(94,234,212,.3);transition:.2s}
.hbtn:hover{background:rgba(8,145,178,.5);color:#e0f7fa}

.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:#a5f3fc;font-size:12px;opacity:.8;letter-spacing:.05em;pointer-events:none;text-align:center;width:100%}
</style>
</head>
<body>
<a href="/" class="hbtn">← Games</a>
<div class="wrap">
  <canvas id="c" width="800" height="560"></canvas>

  <div class="hud">
    <div class="box">
      <span class="lbl">Grow</span>
      <div class="barwrap"><div class="bar" id="xpBar" style="width:0%"></div></div>
      <span id="tierTxt">Tier 1</span>
    </div>
    <div class="box">
      <span class="lbl">Score</span>
      <span id="sc">0</span>
    </div>
    <div class="box">
      <span class="lbl">Lives</span>
      <span class="lives" id="lives">🐟🐟🐟</span>
    </div>
  </div>

  <div class="hint">Move: mouse / touch / arrows · Eat smaller · Dodge bigger & 💣 🦀</div>

  <div class="ov" id="ov">
    <h2 id="ov-title">🐠 Feeding Frenzy</h2>
    <p id="ov-msg">Eat smaller fish to grow. Dodge bigger ones, clams that snap shut, mines and submarines.</p>
    <button class="btn" id="ov-btn" onclick="hideOv();start()">Dive In</button>
  </div>
</div>

<script src="_esc-back.js"></script>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = C.width, H = C.height;

// ─── Tier definitions ───────────────────────────────────────
// Each tier = player's own body size. Player can EAT fish whose size
// is ≤ (own size - EAT_MARGIN); DIES on contact with fish whose size
// is ≥ (own size + DEATH_MARGIN); in between is just a harmless bump.
const EAT_MARGIN = 3;
const DEATH_MARGIN = 6;
const TIERS = [
  // Distinct player colors per tier so growth reads at a glance and
  // the player is never confusable with a prey fish of the same hue.
  { size: 18, xpNeeded: 60,  label: 'Tier 1', color:'#ff6b35', fin:'#c53030' }, // bright orange-red
  { size: 28, xpNeeded: 140, label: 'Tier 2', color:'#06b6d4', fin:'#0e7490' }, // cyan
  { size: 42, xpNeeded: 260, label: 'Tier 3', color:'#eab308', fin:'#854d0e' }, // gold
  { size: 62, xpNeeded: 999, label: 'Tier 4', color:'#dc2626', fin:'#450a0a' }, // crimson king
];

// ─── Enemy / prey archetype — soft chibi fish ───────────────
const FISH_KINDS = [
  { s: 10, color: '#fde047', fin: '#eab308', name: 'minnow' },     // yellow tiny
  { s: 14, color: '#fb923c', fin: '#c2410c', name: 'clown' },      // orange small
  { s: 18, color: '#f472b6', fin: '#be185d', name: 'pink' },       // pink
  { s: 22, color: '#60a5fa', fin: '#1d4ed8', name: 'blue' },       // blue medium
  { s: 28, color: '#a78bfa', fin: '#5b21b6', name: 'purple' },     // purple large
  { s: 36, color: '#34d399', fin: '#047857', name: 'green' },      // green bigger
  { s: 46, color: '#f87171', fin: '#991b1b', name: 'red-tuna' },   // big predator-ish
  { s: 58, color: '#64748b', fin: '#1e293b', name: 'shark-like' }, // huge
];

// Game state
let state;
let mouse = { x: W/2, y: H/2, active: false };
const keys = {};

function start(){
  state = {
    player: {
      x: W/2, y: H/2, vx: 0, vy: 0,
      size: TIERS[0].size, tier: 0,
      xp: 0, score: 0, lives: 3,
      facing: 1,           // 1 right, -1 left
      alive: true, invuln: 0,
      wiggle: 0, eatBlink: 0,
    },
    fish: [],
    clams: [],
    mines: [],
    subs: [],
    bubbles: [],
    particles: [],
    popups: [],           // floating "+5" "+10" score popups
    pearls: [],           // pearls temporarily visible inside open clams
    phase: 'play',
    frame: 0,
    waveCool: 0,
    subCool: 240,
  };
  // Seed a few clams on the "floor" and some mines in the mid-water
  for(let i = 0; i < 3; i++){
    state.clams.push({ x: 120 + i * 260, y: H - 36, state:'closed', t: Math.random() * 180 });
  }
  // Initial fish cloud
  for(let i = 0; i < 18; i++) spawnFish(true);
  // Pre-fill bubbles
  for(let i = 0; i < 14; i++) spawnBubble(true);
}

// ─── Spawning ───────────────────────────────────────────────
function spawnFish(initial){
  // Weight toward sizes near the player's size, with a tail going up (challenge).
  const playerS = state.player.size;
  const bias = Math.random();
  let kindIndex;
  if(bias < 0.55){
    // Smaller than player — tasty
    kindIndex = FISH_KINDS.findIndex(k => k.s <= playerS - EAT_MARGIN);
    if(kindIndex < 0) kindIndex = 0;
    kindIndex += Math.floor(Math.random() * Math.max(1, FISH_KINDS.findIndex(k => k.s > playerS - EAT_MARGIN)));
    kindIndex = Math.min(kindIndex, FISH_KINDS.length - 1);
  } else if(bias < 0.85){
    // Near-size neutral/slightly over
    kindIndex = Math.max(0, Math.min(FISH_KINDS.length - 1, FISH_KINDS.findIndex(k => k.s >= playerS - 4)));
  } else {
    // Definitely bigger — predator threat
    kindIndex = Math.min(FISH_KINDS.length - 1, FISH_KINDS.findIndex(k => k.s > playerS + DEATH_MARGIN));
    if(kindIndex < 0) kindIndex = FISH_KINDS.length - 1;
  }
  const kind = FISH_KINDS[kindIndex];
  const fromLeft = Math.random() < 0.5;
  const x = initial ? Math.random() * W : (fromLeft ? -kind.s - 10 : W + kind.s + 10);
  const y = 40 + Math.random() * (H - 80);
  const sp = 0.4 + Math.random() * 1.3 + kind.s * 0.015;
  state.fish.push({
    x, y,
    vx: fromLeft ? sp : -sp,
    vy: 0,
    size: kind.s,
    kind,
    wobble: Math.random() * Math.PI * 2,
    wobSpeed: 0.08 + Math.random() * 0.06,
    poisonous: kind.s === 28 && Math.random() < 0.15,  // small chance any purple is pufferfish
    puff: 0,
  });
}

function spawnBubble(initial){
  state.bubbles.push({
    x: Math.random() * W,
    y: initial ? Math.random() * H : H + 10,
    r: 2 + Math.random() * 6,
    vy: -0.3 - Math.random() * 0.7,
  });
}

function spawnSubmarine(){
  const fromLeft = Math.random() < 0.5;
  state.subs.push({
    x: fromLeft ? -120 : W + 120,
    y: 120 + Math.random() * (H - 240),
    vx: fromLeft ? 1.6 : -1.6,
    w: 100, h: 44,
    bob: 0,
  });
}

function spawnMine(){
  state.mines.push({
    x: 60 + Math.random() * (W - 120),
    y: 90 + Math.random() * (H - 180),
    r: 14,
    flash: 0,
    life: 600 + Math.random() * 400,
  });
}

// ─── Input ──────────────────────────────────────────────────
C.addEventListener('mousemove', e => {
  const r = C.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
  mouse.active = true;
});
C.addEventListener('mouseleave', () => mouse.active = false);
C.addEventListener('touchstart', e => {
  e.preventDefault();
  if(e.touches.length){
    const r = C.getBoundingClientRect();
    mouse.x = (e.touches[0].clientX - r.left) * (W / r.width);
    mouse.y = (e.touches[0].clientY - r.top) * (H / r.height);
    mouse.active = true;
  }
}, { passive: false });
C.addEventListener('touchmove', e => {
  e.preventDefault();
  if(e.touches.length){
    const r = C.getBoundingClientRect();
    mouse.x = (e.touches[0].clientX - r.left) * (W / r.width);
    mouse.y = (e.touches[0].clientY - r.top) * (H / r.height);
  }
}, { passive: false });
addEventListener('keydown', e => {
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
});
addEventListener('keyup', e => keys[e.code] = false);

// ─── Core game logic ────────────────────────────────────────
function update(){
  if(state.phase !== 'play') return;
  const p = state.player;
  state.frame++;

  // Player movement — mouse lerp or arrow keys (keyboard wins while held)
  const kx = (keys.ArrowRight||keys.KeyD?1:0) - (keys.ArrowLeft||keys.KeyA?1:0);
  const ky = (keys.ArrowDown||keys.KeyS?1:0) - (keys.ArrowUp||keys.KeyW?1:0);
  if(kx || ky){
    const ln = Math.hypot(kx, ky) || 1;
    p.vx = (kx/ln) * 4.5;
    p.vy = (ky/ln) * 4.5;
  } else if(mouse.active){
    const dx = mouse.x - p.x, dy = mouse.y - p.y;
    const d = Math.hypot(dx, dy);
    if(d > 3){
      const speed = Math.min(5, d * 0.08);
      p.vx = (dx/d) * speed;
      p.vy = (dy/d) * speed;
    } else {
      p.vx *= 0.8; p.vy *= 0.8;
    }
  } else {
    p.vx *= 0.9; p.vy *= 0.9;
  }
  p.x += p.vx; p.y += p.vy;
  p.x = Math.max(p.size, Math.min(W - p.size, p.x));
  p.y = Math.max(p.size, Math.min(H - p.size, p.y));
  if(Math.abs(p.vx) > 0.3) p.facing = p.vx > 0 ? 1 : -1;
  p.wiggle += 0.3;
  if(p.invuln > 0) p.invuln--;
  if(p.eatBlink > 0) p.eatBlink--;

  // Fish update
  for(const f of state.fish){
    f.x += f.vx;
    f.wobble += f.wobSpeed;
    f.y += Math.sin(f.wobble) * 0.3;
    if(f.poisonous){ f.puff = (f.puff + 1) % 180; }
  }
  // Prune fish that have swum off-screen
  state.fish = state.fish.filter(f => f.x > -80 && f.x < W + 80);

  // Steady spawning
  state.waveCool--;
  if(state.waveCool <= 0 && state.fish.length < 28){
    spawnFish();
    state.waveCool = 25 + Math.floor(Math.random() * 20);
  }

  // Bubbles
  for(const b of state.bubbles){
    b.y += b.vy;
    b.x += Math.sin(b.y * 0.02) * 0.2;
  }
  state.bubbles = state.bubbles.filter(b => b.y > -10);
  if(Math.random() < 0.08) spawnBubble();

  // Clams — slow open/close cycle. Closing while player is inside = death.
  for(const cl of state.clams){
    cl.t++;
    if(cl.state === 'closed' && cl.t > 240){ cl.state = 'opening'; cl.t = 0; }
    else if(cl.state === 'opening' && cl.t > 30){ cl.state = 'open'; cl.t = 0; }
    else if(cl.state === 'open' && cl.t > 150){ cl.state = 'closing'; cl.t = 0; }
    else if(cl.state === 'closing' && cl.t > 20){ cl.state = 'closed'; cl.t = 0; }
  }

  // Mines — bomb timer; occasionally spawn more as difficulty scales
  for(const m of state.mines){ m.flash += 0.14; m.life--; }
  state.mines = state.mines.filter(m => m.life > 0);
  if(p.tier >= 1 && state.mines.length < Math.min(1 + p.tier, 4) && Math.random() < 0.004) spawnMine();

  // Submarines — periodic cross-screen hazard, more frequent at higher tiers
  state.subCool--;
  if(state.subCool <= 0){
    spawnSubmarine();
    state.subCool = 400 - p.tier * 60 + Math.random() * 180;
  }
  for(const s of state.subs){ s.x += s.vx; s.bob += 0.08; s.y += Math.sin(s.bob) * 0.2; }
  state.subs = state.subs.filter(s => s.x > -200 && s.x < W + 200);

  // Particles
  for(const pa of state.particles){
    pa.x += pa.vx; pa.y += pa.vy; pa.vy += 0.05; pa.life--;
  }
  state.particles = state.particles.filter(pa => pa.life > 0);

  // Score popups
  for(const pp of state.popups){ pp.y -= 0.7; pp.life--; }
  state.popups = state.popups.filter(pp => pp.life > 0);

  // ─── Collisions ──────────────────────────────────────────
  // Player vs fish
  if(p.invuln === 0){
    for(let i = state.fish.length - 1; i >= 0; i--){
      const f = state.fish[i];
      const d = Math.hypot(p.x - f.x, p.y - f.y);
      if(d > p.size + f.size - 2) continue;
      if(f.size <= p.size - EAT_MARGIN){
        // EAT
        eatFish(f);
        state.fish.splice(i, 1);
      } else if(f.size >= p.size + DEATH_MARGIN){
        // DIE — bigger fish eats us
        return die('🦈 Eaten by a bigger fish!');
      }
      // Else: neutral bump (do nothing)
    }
  }

  // Poisonous pufferfish spikes (when puff phase is active, radius grows)
  if(p.invuln === 0){
    for(const f of state.fish){
      if(!f.poisonous || f.puff < 90) continue;
      const puffR = f.size + 8;
      const d = Math.hypot(p.x - f.x, p.y - f.y);
      if(d < p.size + puffR){ return die('☠️ Poisoned by a pufferfish!'); }
    }
  }

  // Clams — contact with closed/closing clam at the pearl spot is lethal
  if(p.invuln === 0){
    for(const cl of state.clams){
      const d = Math.hypot(p.x - cl.x, p.y - (cl.y - 20));
      if(d < p.size + 8 && (cl.state === 'closing' || (cl.state === 'closed' && cl.t < 20))){
        return die('🦪 Snapped by a clam!');
      }
      // Eating the pearl (open state): +15
      if(cl.state === 'open' && cl.pearl !== false && d < p.size + 10){
        cl.pearl = false;
        p.score += 25; p.xp += 10;
        pushPopup(cl.x, cl.y - 24, '+25 🦪');
        spawnBurst(cl.x, cl.y - 20, '#fef3c7', 10);
      }
    }
    // Reset pearls when clam reopens
    for(const cl of state.clams) if(cl.state === 'opening' && cl.pearl === false) cl.pearl = true;
  }

  // Mines
  if(p.invuln === 0){
    for(const m of state.mines){
      if(Math.hypot(p.x - m.x, p.y - m.y) < p.size + m.r){
        return die('💥 Mine! Boom.');
      }
    }
  }

  // Submarines — big instant death (not fish-sized, treat as predator)
  if(p.invuln === 0){
    for(const s of state.subs){
      if(p.x > s.x - s.w/2 && p.x < s.x + s.w/2 &&
         p.y > s.y - s.h/2 && p.y < s.y + s.h/2){
        return die('🚤 Hit by a submarine!');
      }
    }
  }

  // Check tier-up
  const nextTier = TIERS[p.tier];
  if(nextTier && p.xp >= nextTier.xpNeeded && p.tier < TIERS.length - 1){
    p.tier++;
    p.xp = 0;
    p.size = TIERS[p.tier].size;
    pushPopup(p.x, p.y - 40, '✨ EVOLVED!');
    spawnBurst(p.x, p.y, '#fde047', 30);
    p.invuln = 60;
  }

  updateHUD();
}

function eatFish(f){
  const p = state.player;
  // XP and score scale with victim size
  const pts = Math.round(f.size * 1.5);
  p.score += pts;
  p.xp += Math.max(1, Math.round(f.size / 4));
  p.eatBlink = 8;
  pushPopup(f.x, f.y - 10, '+' + pts);
  spawnBurst(f.x, f.y, f.kind.color, 8);
}

function die(msg){
  const p = state.player;
  spawnBurst(p.x, p.y, '#ef4444', 30);
  p.lives--;
  if(p.lives <= 0){
    state.phase = 'dead';
    showOv('💀 Game Over', `${msg}\n\nFinal score: ${p.score}\nTier reached: ${TIERS[p.tier].label}`, true);
    const key = 'frenzy_best';
    const best = +(localStorage[key] || 0);
    if(p.score > best){
      localStorage[key] = p.score;
      document.getElementById('ov-msg').textContent += '\n🏆 New best score!';
    } else {
      document.getElementById('ov-msg').textContent += `\nBest: ${best}`;
    }
  } else {
    // Respawn mid-arena with brief invulnerability
    p.x = W/2; p.y = H/2; p.vx = 0; p.vy = 0;
    p.invuln = 90;
    pushPopup(W/2, H/2 - 60, msg);
  }
}

function spawnBurst(x, y, color, n){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 3;
    state.particles.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 24 + Math.random()*16,
      color, r: 2 + Math.random() * 2,
    });
  }
}
function pushPopup(x, y, text){ state.popups.push({ x, y, text, life: 50 }); }

function updateHUD(){
  const p = state.player;
  const t = TIERS[p.tier];
  document.getElementById('sc').textContent = p.score;
  const pct = p.tier < TIERS.length - 1 ? Math.min(100, (p.xp / t.xpNeeded) * 100) : 100;
  document.getElementById('xpBar').style.width = pct + '%';
  document.getElementById('tierTxt').textContent = t.label;
  document.getElementById('lives').textContent = '🐟'.repeat(Math.max(0, p.lives));
}

// ─── Rendering ──────────────────────────────────────────────
function drawFish(x, y, size, color, finColor, facing, wiggle, isPlayer){
  ctx.save();
  ctx.translate(x, y);
  if(facing < 0) ctx.scale(-1, 1);

  // Tail (sways with wiggle)
  const tailOff = Math.sin(wiggle) * 0.35;
  ctx.fillStyle = finColor;
  ctx.beginPath();
  ctx.moveTo(-size * 0.7, 0);
  ctx.lineTo(-size * 1.4, -size * 0.5 + tailOff * size);
  ctx.lineTo(-size * 1.2, 0);
  ctx.lineTo(-size * 1.4,  size * 0.5 - tailOff * size);
  ctx.closePath();
  ctx.fill();

  // Body — ellipse with soft shadow + highlight (micro 3D)
  const grad = ctx.createRadialGradient(-size*0.2, -size*0.3, size*0.1, 0, 0, size*1.1);
  grad.addColorStop(0, lighten(color, 0.35));
  grad.addColorStop(0.5, color);
  grad.addColorStop(1, darken(color, 0.3));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, size, size * 0.72, 0, 0, Math.PI*2);
  ctx.fill();

  // Outline
  ctx.strokeStyle = darken(color, 0.5);
  ctx.lineWidth = Math.max(1.5, size * 0.06);
  ctx.stroke();

  // Top fin
  ctx.fillStyle = finColor;
  ctx.beginPath();
  ctx.moveTo(-size * 0.2, -size * 0.65);
  ctx.quadraticCurveTo(0, -size * 1.05, size * 0.2, -size * 0.65);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Belly fin (small)
  ctx.beginPath();
  ctx.moveTo(-size * 0.05, size * 0.55);
  ctx.quadraticCurveTo(-size * 0.25, size * 0.9, -size * 0.35, size * 0.6);
  ctx.closePath();
  ctx.fill();

  // Eye — big white circle + black pupil, chibi style
  const eyeX = size * 0.42, eyeY = -size * 0.12, er = size * 0.26;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(eyeX, eyeY, er, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(eyeX + er*0.3, eyeY, er*0.55, 0, Math.PI*2); ctx.fill();
  // Shine
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.arc(eyeX + er*0.15, eyeY - er*0.3, er*0.3, 0, Math.PI*2); ctx.fill();

  // Mouth — simple smile; player mouth OPENS briefly after eating
  ctx.strokeStyle = darken(color, 0.55);
  ctx.lineWidth = Math.max(1.2, size * 0.05);
  ctx.beginPath();
  if(isPlayer && state.player.eatBlink > 0){
    ctx.arc(size*0.78, size*0.05, size*0.18, 0, Math.PI, false);
  } else {
    ctx.moveTo(size*0.75, size*0.08);
    ctx.quadraticCurveTo(size*0.88, size*0.14, size*0.96, size*0.04);
  }
  ctx.stroke();

  ctx.restore();
}

function lighten(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (n>>16) + Math.floor(255*amt));
  const g = Math.min(255, ((n>>8)&255) + Math.floor(255*amt));
  const b = Math.min(255, (n&255) + Math.floor(255*amt));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function darken(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, (n>>16) - Math.floor(255*amt));
  const g = Math.max(0, ((n>>8)&255) - Math.floor(255*amt));
  const b = Math.max(0, (n&255) - Math.floor(255*amt));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function drawClam(cl){
  const x = cl.x, y = cl.y;
  // Shell bottom
  ctx.fillStyle = '#92400e';
  ctx.beginPath();
  ctx.ellipse(x, y, 40, 14, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Open-ness: closed=0, opening/open=1, closing=0 (linear)
  let openness = 0;
  if(cl.state === 'opening') openness = cl.t / 30;
  else if(cl.state === 'open') openness = 1;
  else if(cl.state === 'closing') openness = 1 - (cl.t / 20);

  // Top shell lifts
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-openness * 0.9);
  // Draw as half-ellipse
  const gradS = ctx.createLinearGradient(0, -40, 0, 10);
  gradS.addColorStop(0, '#fde68a');
  gradS.addColorStop(1, '#b45309');
  ctx.fillStyle = gradS;
  ctx.beginPath();
  ctx.ellipse(0, 0, 40, 20, 0, Math.PI, 0);
  ctx.fill();
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Ridges
  ctx.strokeStyle = 'rgba(120,53,15,.55)';
  ctx.lineWidth = 1;
  for(let i = -3; i <= 3; i++){
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(i*6, -14 + Math.abs(i)*1.5, i*10, -18 + Math.abs(i)*3);
    ctx.stroke();
  }
  ctx.restore();

  // Pearl if open & not eaten yet
  if(openness > 0.5 && cl.pearl !== false){
    const pg = ctx.createRadialGradient(x - 2, y - 22, 1, x, y - 20, 7);
    pg.addColorStop(0, '#fff');
    pg.addColorStop(1, '#f1e9c7');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(x, y - 20, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Warning flash if closing soon
  if(cl.state === 'open' && cl.t > 120){
    ctx.strokeStyle = `rgba(239,68,68,${0.3 + Math.sin(cl.t * 0.3) * 0.3})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y - 10, 46, Math.PI, 0); ctx.stroke();
  }
}

function drawMine(m){
  const alpha = 0.6 + Math.sin(m.flash) * 0.4;
  ctx.save();
  ctx.translate(m.x, m.y);
  // Spikes
  ctx.fillStyle = '#334155';
  for(let i = 0; i < 8; i++){
    const a = (i / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * m.r, Math.sin(a) * m.r);
    ctx.lineTo(Math.cos(a + 0.12) * (m.r + 8), Math.sin(a + 0.12) * (m.r + 8));
    ctx.lineTo(Math.cos(a - 0.12) * (m.r + 8), Math.sin(a - 0.12) * (m.r + 8));
    ctx.closePath();
    ctx.fill();
  }
  // Core
  const grad = ctx.createRadialGradient(-3, -3, 2, 0, 0, m.r);
  grad.addColorStop(0, '#64748b');
  grad.addColorStop(1, '#1e293b');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, m.r, 0, Math.PI*2); ctx.fill();
  // Red LED
  ctx.fillStyle = `rgba(239,68,68,${alpha})`;
  ctx.beginPath(); ctx.arc(4, -3, 3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawSub(s){
  ctx.save();
  ctx.translate(s.x, s.y);
  if(s.vx < 0) ctx.scale(-1, 1);
  // Body
  const grad = ctx.createLinearGradient(0, -s.h/2, 0, s.h/2);
  grad.addColorStop(0, '#fef08a');
  grad.addColorStop(0.5, '#fbbf24');
  grad.addColorStop(1, '#a16207');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, s.w/2, s.h/2, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 3;
  ctx.stroke();
  // Window
  ctx.fillStyle = '#0891b2';
  ctx.beginPath(); ctx.arc(s.w*0.25, -2, 7, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#78350f'; ctx.lineWidth = 2; ctx.stroke();
  // Propeller
  ctx.fillStyle = '#334155';
  ctx.beginPath(); ctx.ellipse(-s.w/2 - 6, 0, 3, 10 + Math.sin(s.bob*4)*2, 0, 0, Math.PI*2); ctx.fill();
  // Periscope
  ctx.fillStyle = '#a16207';
  ctx.fillRect(-4, -s.h/2 - 10, 5, 10);
  ctx.beginPath(); ctx.arc(-1, -s.h/2 - 12, 4, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawPufferSpikes(f){
  if(f.puff < 90) return;
  const t = (f.puff - 90) / 90;
  const r = f.size + 4 + t * 4;
  ctx.strokeStyle = `rgba(167,139,250,${0.6 + Math.sin(f.puff*0.2)*0.3})`;
  ctx.lineWidth = 2;
  for(let i = 0; i < 12; i++){
    const a = (i/12) * Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(f.x + Math.cos(a) * f.size, f.y + Math.sin(a) * f.size);
    ctx.lineTo(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r);
    ctx.stroke();
  }
}

function draw(){
  // Water depth gradient (drawn each frame for safety)
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#2dd4bf');
  sky.addColorStop(0.3, '#0891b2');
  sky.addColorStop(0.7, '#075985');
  sky.addColorStop(1, '#082f49');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Light rays
  for(let i = 0; i < 3; i++){
    const x = (i + 1) * W/4;
    const gr = ctx.createLinearGradient(x, 0, x, H);
    gr.addColorStop(0, 'rgba(255,255,255,.14)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.moveTo(x - 50, 0);
    ctx.lineTo(x + 50, 0);
    ctx.lineTo(x + 120, H);
    ctx.lineTo(x - 120, H);
    ctx.closePath();
    ctx.fill();
  }

  // Sand floor
  ctx.fillStyle = '#d4a373';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for(let x = 0; x <= W; x += 20){
    ctx.lineTo(x, H - 20 - Math.sin(x * 0.03 + state.frame * 0.01) * 4);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  // Bubbles (behind fish)
  ctx.strokeStyle = 'rgba(255,255,255,.6)';
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  for(const b of state.bubbles){
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }

  // Clams on floor
  for(const cl of state.clams) drawClam(cl);

  // Mines
  for(const m of state.mines) drawMine(m);

  // Fish — sorted by size so bigger ones render on top
  state.fish.sort((a,b) => a.size - b.size);
  for(const f of state.fish){
    drawFish(f.x, f.y, f.size, f.kind.color, f.kind.fin, f.vx > 0 ? 1 : -1, f.wobble, false);
    if(f.poisonous) drawPufferSpikes(f);
  }

  // Submarines
  for(const s of state.subs) drawSub(s);

  // Player — blink while invulnerable, white halo makes it unmistakable
  const p = state.player;
  if(!(p.invuln > 0 && Math.floor(p.invuln / 5) % 2 === 0)){
    const tier = TIERS[p.tier];
    // Soft white halo so the player is always distinguishable from prey
    ctx.save();
    const halo = ctx.createRadialGradient(p.x, p.y, p.size * 0.6, p.x, p.y, p.size * 1.6);
    halo.addColorStop(0, 'rgba(255,255,255,0.4)');
    halo.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 1.6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    drawFish(p.x, p.y, p.size, tier.color, tier.fin, p.facing, p.wiggle, true);
  }

  // Particles
  for(const pa of state.particles){
    ctx.fillStyle = pa.color;
    ctx.globalAlpha = Math.min(1, pa.life / 24);
    ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Score popups
  ctx.font = 'bold 15px Verdana';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(const pp of state.popups){
    const a = Math.min(1, pp.life / 30);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.strokeStyle = `rgba(0,0,0,${a*0.6})`;
    ctx.lineWidth = 3;
    ctx.strokeText(pp.text, pp.x, pp.y);
    ctx.fillText(pp.text, pp.x, pp.y);
  }
}

// ─── UI overlays ────────────────────────────────────────────
function showOv(title, msg, lose){
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-title').className = lose ? 'lose' : '';
  document.getElementById('ov-msg').textContent = msg;
  document.getElementById('ov-btn').textContent = lose ? 'Try Again' : 'Dive In';
  document.getElementById('ov').classList.add('show');
}
function hideOv(){ document.getElementById('ov').classList.remove('show'); }

// ─── Main loop ──────────────────────────────────────────────
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

// Initial intro screen on page load
start();
state.phase = 'intro';
showOv('🐠 Feeding Frenzy', 'Eat smaller fish to grow through 4 tiers.\nAvoid bigger fish, snapping clams, mines, pufferfish and submarines.', false);
loop();
</script>
