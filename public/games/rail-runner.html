<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rail Runner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0612;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;user-select:none}
body{position:relative}
canvas#c{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.hbtn{position:fixed;top:10px;left:10px;z-index:20;background:rgba(0,0,0,.6);color:#e2e8f0;text-decoration:none;padding:6px 14px;border-radius:20px;font-size:13px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);pointer-events:auto}
.hbtn:hover{background:rgba(139,92,246,.5)}
#dist{position:absolute;top:12px;left:12px;font:900 26px system-ui;color:#fef3c7;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#dist small{display:block;font:600 11px system-ui;color:#c7d2fe;letter-spacing:.15em;margin-top:2px}
#coins{position:absolute;top:12px;right:14px;font:900 22px system-ui;color:#fbbf24;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#speedbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:200px;height:6px;background:rgba(0,0,0,0.4);border-radius:4px;overflow:hidden;border:1px solid rgba(139,92,246,.4)}
#speedfill{height:100%;width:0%;background:linear-gradient(90deg,#22d3ee,#a855f7,#ec4899);transition:width .2s}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(30,27,75,.7),rgba(10,6,18,.92));backdrop-filter:blur(6px);z-index:10;pointer-events:auto}
.overlay h1{font:900 clamp(40px,7vw,64px) system-ui;background:linear-gradient(90deg,#22d3ee,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(139,92,246,.4);letter-spacing:.02em;margin-bottom:8px}
.overlay h2{font:900 36px system-ui;color:#f43f5e;text-shadow:0 0 20px rgba(244,63,94,.5);margin-bottom:10px}
.overlay p{color:#cbd5e1;font-size:14px;margin-bottom:6px;letter-spacing:.05em;text-align:center}
.overlay .stat{color:#fbbf24;font:900 24px system-ui;margin:6px 0}
.overlay button{margin-top:16px;padding:12px 30px;font:900 15px system-ui;letter-spacing:.15em;text-transform:uppercase;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;border:none;border-radius:10px;cursor:pointer;box-shadow:0 6px 20px rgba(168,85,247,.45);transition:.15s}
.overlay button:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(168,85,247,.6)}
.hidden{display:none!important}
.hint{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font-size:12px;color:#94a3b8;letter-spacing:.1em}
</style>
</head>
<body>
<a href="/" class="hbtn">← Games</a>
<canvas id="c"></canvas>

<div id="hud">
  <div id="dist">0m<small>DISTANCE</small></div>
  <div id="coins">◉ 0</div>
  <div id="speedbar"><div id="speedfill"></div></div>
</div>

<div class="overlay" id="ov-title">
  <h1>RAIL RUNNER</h1>
  <p>Left / Right — swap lane · Space — jump · Down — slide</p>
  <p style="color:#94a3b8">Obstacles come fast. React faster.</p>
  <button onclick="startGame()">▶ RUN</button>
  <p class="hint">Tap or swipe on mobile</p>
</div>

<div class="overlay hidden" id="ov-end">
  <h2>💥 WIPEOUT</h2>
  <div class="stat"><span id="end-dist">0</span>m · <span id="end-coins">0</span> coins</div>
  <p>BEST: <span id="end-best">0</span>m</p>
  <button onclick="startGame()">🔁 RUN AGAIN</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═════════════════════════════════════════════════════════════
//   RAIL RUNNER — 3D endless-lane runner (Three.js)
//   100% original: mechanics only. No third-party art or code
//   from any commercial runner game.
// ═════════════════════════════════════════════════════════════

const cv = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1b4b);
scene.fog = new THREE.Fog(0x4c1d95, 22, 90);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 4.5, -8);
camera.lookAt(0, 1.5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, canvas: cv });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Lighting ────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x8899cc, 0.6));
const sun = new THREE.DirectionalLight(0xfef3c7, 0.9);
sun.position.set(6, 12, 4);
scene.add(sun);
const rim = new THREE.DirectionalLight(0xec4899, 0.4);
rim.position.set(-6, 4, -2);
scene.add(rim);

// ── Ground (long dark strip) ────────────────────────────────
const GROUND_LEN = 200;
const groundMat = new THREE.MeshLambertMaterial({ color: 0x0a0612 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, GROUND_LEN), groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.z = GROUND_LEN/2 - 10;
scene.add(ground);

// ── Rails — silver strips down each side of the track ──────
const railMat = new THREE.MeshStandardMaterial({ color: 0xc0c0d0, metalness: 0.75, roughness: 0.35 });
for(const rx of [-4, 4]){
  const rail = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, GROUND_LEN), railMat);
  rail.position.set(rx, 0.08, GROUND_LEN/2 - 10);
  scene.add(rail);
}

// ── Wooden sleepers scrolling toward camera ────────────────
const sleeperMat = new THREE.MeshLambertMaterial({ color: 0x3a1d0a });
const sleepers = [];
for(let i = 0; i < 30; i++){
  const s = new THREE.Mesh(new THREE.BoxGeometry(9, 0.15, 0.7), sleeperMat);
  s.position.set(0, 0.06, i * 6);
  scene.add(s);
  sleepers.push(s);
}

// ── Lane dividers (glowing yellow segments) ────────────────
const dividerMat = new THREE.MeshStandardMaterial({
  color: 0xfbbf24, emissive: 0x92400e, emissiveIntensity: 1.2,
});
const dividers = [];
for(let lane of [-1.35, 1.35]){
  for(let i = 0; i < 40; i++){
    const d = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.02, 1.5), dividerMat);
    d.position.set(lane, 0.05, i * 5);
    scene.add(d);
    dividers.push(d);
  }
}

// ── Distant city (parallax silhouettes) ────────────────────
const cityGroup = new THREE.Group();
scene.add(cityGroup);
for(let i = 0; i < 40; i++){
  const w = 1.5 + Math.random() * 3;
  const h = 3 + Math.random() * 10;
  const bldg = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, 1),
    new THREE.MeshLambertMaterial({ color: 0x1a0d24 })
  );
  const side = Math.random() < 0.5 ? -1 : 1;
  bldg.position.set(side * (10 + Math.random() * 22), h/2 - 0.5, 10 + Math.random() * 70);
  cityGroup.add(bldg);
  // Random lit window on each side
  if(Math.random() < 0.7){
    const win = new THREE.Mesh(
      new THREE.PlaneGeometry(0.35, 0.35),
      new THREE.MeshBasicMaterial({ color: 0xfbbf24 })
    );
    win.position.set(bldg.position.x - side * 0.51, bldg.position.y + (Math.random()-0.5)*h*0.5, bldg.position.z);
    win.rotation.y = -side * Math.PI/2;
    cityGroup.add(win);
  }
}

// ── Streetlights whipping past ─────────────────────────────
const lightPosts = [];
const postMat = new THREE.MeshLambertMaterial({ color: 0x111827 });
const lampMat = new THREE.MeshStandardMaterial({
  color: 0xfef3c7, emissive: 0xfef3c7, emissiveIntensity: 1.4,
});
for(let i = 0; i < 12; i++){
  const post = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.10, 5, 6), postMat);
  pole.position.y = 2.5;
  post.add(pole);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.08), postMat);
  arm.position.set(-0.6, 4.8, 0);
  post.add(arm);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 6), lampMat);
  lamp.position.set(-1.1, 4.7, 0);
  post.add(lamp);
  post.position.set(6.2, 0, i * 16);
  scene.add(post);
  lightPosts.push(post);
  // Mirrored on the other side
  const post2 = post.clone();
  post2.position.x = -6.2;
  post2.rotation.y = Math.PI;
  scene.add(post2);
  lightPosts.push(post2);
}

// ── Sky stars ──────────────────────────────────────────────
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(400 * 3);
for(let i = 0; i < 400; i++){
  starPos[i*3+0] = (Math.random() - 0.5) * 300;
  starPos[i*3+1] = 20 + Math.random() * 80;
  starPos[i*3+2] = 30 + Math.random() * 200;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  color: 0xfefce8, size: 0.4, sizeAttenuation: true,
}));
scene.add(stars);

// ── Player ─────────────────────────────────────────────────
const playerGroup = new THREE.Group();
scene.add(playerGroup);
const bodyMat = new THREE.MeshLambertMaterial({ color: 0x22d3ee });
const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.4, 0.6), bodyMat);
body.position.y = 0.7;
playerGroup.add(body);
const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.4, 12, 10),
  new THREE.MeshLambertMaterial({ color: 0xf5d0a4 })
);
head.position.y = 1.75;
playerGroup.add(head);
const cap = new THREE.Mesh(
  new THREE.CylinderGeometry(0.42, 0.42, 0.15, 12),
  new THREE.MeshLambertMaterial({ color: 0xf43f5e })
);
cap.position.y = 2.05;
playerGroup.add(cap);
// Legs
const legMat = new THREE.MeshLambertMaterial({ color: 0x1e3a8a });
const legL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 0.35), legMat);
const legR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 0.35), legMat);
legL.position.set(-0.24, 0.3, 0);
legR.position.set(0.24, 0.3, 0);
playerGroup.add(legL); playerGroup.add(legR);
// Arms
const armMat = new THREE.MeshLambertMaterial({ color: 0x22d3ee });
const armL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.9, 0.3), armMat);
const armR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.9, 0.3), armMat);
armL.position.set(-0.6, 0.9, 0);
armR.position.set(0.6, 0.9, 0);
playerGroup.add(armL); playerGroup.add(armR);

playerGroup.position.set(0, 0, 0);

// ── State ──────────────────────────────────────────────────
const LANE_X = [-2.7, 0, 2.7];
let state, best = +(localStorage.getItem('rr3d_best') || 0);
function resetState(){
  state = {
    lane: 1, laneTween: 1,
    yVel: 0, y: 0,
    slideT: 0,
    speed: 20,           // world units per second toward camera
    distance: 0,
    coins: 0,
    spawnT: 0.5, coinT: 1.0,
    obstacles: [], coins3D: [],
    running: false, dead: false,
    tick: 0, shake: 0,
  };
}
resetState();

// ── Input ──────────────────────────────────────────────────
function jump(){
  if(!state.running || state.dead) return;
  // Can jump when grounded — either on the tracks or on top of
  // a train car. State.onTrain locks player's ground floor.
  const g = state.onTrain ? 1.8 : 0;
  if(state.y <= g + 0.05 && state.slideT <= 0) state.yVel = 10;
}
function slide(){
  if(!state.running || state.dead) return;
  if(state.slideT <= 0 && state.y <= 0.01) state.slideT = 0.55;
}
addEventListener('keydown', e => {
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  if(!state.running || state.dead){
    if(e.key===' ' || e.key==='Enter') startGame();
    return;
  }
  if(e.key==='ArrowLeft'  || e.code==='KeyA'){ if(state.lane>0) state.lane--; }
  if(e.key==='ArrowRight' || e.code==='KeyD'){ if(state.lane<2) state.lane++; }
  if(e.key==='ArrowUp'    || e.key===' ' || e.code==='KeyW') jump();
  if(e.key==='ArrowDown'  || e.code==='KeyS') slide();
});
// Touch swipe
let tx=null, ty=null;
addEventListener('touchstart', e => {
  const t = e.touches[0]; tx=t.clientX; ty=t.clientY;
  if(!state.running || state.dead){ startGame(); }
});
addEventListener('touchend', e => {
  if(tx==null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX-tx, dy = t.clientY-ty;
  tx=ty=null;
  if(Math.abs(dx) > Math.abs(dy)){
    if(dx > 30 && state.lane<2) state.lane++;
    else if(dx < -30 && state.lane>0) state.lane--;
  } else {
    if(dy < -30) jump(); else if(dy > 30) slide();
  }
});

// ── Spawners ───────────────────────────────────────────────
function spawnObstacle(){
  const clear = [0, 1, 2].filter(ln => {
    return !state.coins3D.some(c =>
      c.userData.lane === ln &&
      c.userData.z > 85 && c.userData.z < 130
    );
  });
  if(clear.length === 0) return;

  // 15% chance to drop a ramp+train combo in one clear lane (only
  // if we have at least 2 clear lanes so the player has an out).
  if(clear.length >= 2 && Math.random() < 0.15){
    const ln = clear[Math.floor(Math.random()*clear.length)];
    // Ramp at the front (closer to player z=115)
    const ramp = buildObstacle('ramp', ln);
    ramp.userData = { z: 115, lane: ln, kind: 'ramp' };
    ramp.position.set(LANE_X[ln], 0, 115);
    scene.add(ramp); state.obstacles.push(ramp);
    // Train immediately behind the ramp (train center 12u further away)
    const train = buildObstacle('train', ln);
    train.userData = { z: 105, lane: ln, kind: 'train' };
    train.position.set(LANE_X[ln], 0, 105);
    scene.add(train); state.obstacles.push(train);
    // Bonus: put a coin trail on top of the train
    for(let i=0; i<6; i++){
      const c = new THREE.Mesh(
        new THREE.TorusGeometry(0.35, 0.13, 8, 20),
        new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0xb45309, emissiveIntensity: 0.7, metalness: 0.6, roughness: 0.3 })
      );
      c.rotation.x = Math.PI/2;
      c.userData = { z: 108 - i*1.6, lane: ln, air: true, taken: false, onTrain: true };
      c.position.set(LANE_X[ln], 2.4, c.userData.z);
      scene.add(c); state.coins3D.push(c);
    }
    return;
  }

  const takeTwo = clear.length >= 2 && Math.random() < 0.45;
  const blocked = takeTwo ? shuffle(clear).slice(0, 2) : [clear[Math.floor(Math.random()*clear.length)]];
  if(blocked.length >= clear.length && clear.length >= 2) blocked.pop();
  const kind = pick(['lo','lo','hi','wall','train']);   // trains occasionally solo too
  for(const ln of blocked){
    const obj = buildObstacle(kind, ln);
    obj.userData = { z: 100, lane: ln, kind };
    obj.position.set(LANE_X[ln], 0, 100);
    scene.add(obj);
    state.obstacles.push(obj);
  }
}
function spawnCoinRun(){
  // Pick a lane that has NO obstacle in the incoming z-range
  // (85 -> 115 units, roughly where the coin train will unfold).
  // Otherwise the player would grab the coin only to eat an
  // obstacle immediately behind it.
  const count = 3 + Math.floor(Math.random()*4);
  const zStart = 100;
  const zEnd   = 100 + count * 2;
  const clear = [0, 1, 2].filter(ln => {
    return !state.obstacles.some(o =>
      o.userData.lane === ln &&
      o.userData.z > zStart - 8 && o.userData.z < zEnd + 8
    );
  });
  if(clear.length === 0) return;               // skip this cycle
  const ln = clear[Math.floor(Math.random()*clear.length)];
  const air = Math.random() < 0.35;
  for(let i=0; i<count; i++){
    const c = new THREE.Mesh(
      new THREE.TorusGeometry(0.35, 0.13, 8, 20),
      new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0xb45309, emissiveIntensity: 0.7, metalness: 0.6, roughness: 0.3 })
    );
    c.rotation.x = Math.PI/2;
    c.userData = { z: zStart + i*2, lane: ln, air, taken: false };
    c.position.set(LANE_X[ln], air ? 2.4 : 1.0, c.userData.z);
    scene.add(c);
    state.coins3D.push(c);
  }
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function buildObstacle(kind, ln){
  const g = new THREE.Group();
  if(kind === 'lo'){
    // Low striped barrier — jump over
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(1.7, 0.8, 0.6),
      new THREE.MeshLambertMaterial({ color: 0xf59e0b })
    );
    box.position.y = 0.4;
    g.add(box);
    // Diagonal stripes on the front
    for(let i=-2; i<=2; i++){
      const s = new THREE.Mesh(
        new THREE.BoxGeometry(0.25, 0.75, 0.02),
        new THREE.MeshBasicMaterial({ color: 0x1c1917 })
      );
      s.position.set(i*0.35, 0.4, -0.31);
      s.rotation.z = Math.PI/6;
      g.add(s);
    }
  } else if(kind === 'hi'){
    // Overhead bar — slide under. Bar is placed at ~1.4y so a
    // standing player (head at ~2.15) hits it; a sliding player
    // (~0.7 tall) passes clean under. Standing tall = fail.
    const bar = new THREE.Mesh(
      new THREE.BoxGeometry(2.4, 0.4, 0.5),
      new THREE.MeshLambertMaterial({ color: 0xdc2626 })
    );
    bar.position.y = 1.4;
    g.add(bar);
    for(const px of [-1.15, 1.15]){
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.08, 1.6, 6),
        new THREE.MeshLambertMaterial({ color: 0x94a3b8 })
      );
      post.position.set(px, 0.8, 0);
      g.add(post);
    }
    // Warning stripes on the bar itself
    for(let i=-3; i<=3; i++){
      if(i%2){
        const s = new THREE.Mesh(
          new THREE.BoxGeometry(0.3, 0.36, 0.02),
          new THREE.MeshBasicMaterial({ color: 0xfef3c7 })
        );
        s.position.set(i*0.35, 1.4, -0.26);
        g.add(s);
      }
    }
  } else if(kind === 'wall'){
    // Wall — change lane
    const wall = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 3.0, 0.6),
      new THREE.MeshLambertMaterial({ color: 0x374151 })
    );
    wall.position.y = 1.5;
    g.add(wall);
    const xMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });
    for(const rot of [Math.PI/4, -Math.PI/4]){
      const bar = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.2, 0.02), xMat);
      bar.position.set(0, 1.5, -0.32);
      bar.rotation.z = rot;
      g.add(bar);
    }
  } else if(kind === 'train'){
    // Long subway car — top surface at y=1.8. Player crashes at
    // ground level; if they get on top (via a jump or ramp) they
    // can run the length of the car.
    const car = new THREE.Mesh(
      new THREE.BoxGeometry(2.0, 1.7, 12),
      new THREE.MeshLambertMaterial({ color: 0x475569 })
    );
    car.position.y = 0.9;
    g.add(car);
    // Yellow stripe down each side
    for(const sx of [-1.02, 1.02]){
      const stripe = new THREE.Mesh(
        new THREE.BoxGeometry(0.05, 0.28, 11.6),
        new THREE.MeshBasicMaterial({ color: 0xfbbf24 })
      );
      stripe.position.set(sx, 0.85, 0);
      g.add(stripe);
    }
    // Window band
    for(const sx of [-1.02, 1.02]){
      const winBand = new THREE.Mesh(
        new THREE.BoxGeometry(0.04, 0.55, 11.4),
        new THREE.MeshBasicMaterial({ color: 0x1e293b })
      );
      winBand.position.set(sx, 1.25, 0);
      g.add(winBand);
      // Individual window mullions
      for(let i=-5; i<=5; i++){
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(0.05, 0.55, 0.15),
          new THREE.MeshBasicMaterial({ color: 0x475569 })
        );
        m.position.set(sx, 1.25, i*1.1);
        g.add(m);
      }
    }
    // Roof detail (a rounded ridge in the middle)
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 0.15, 11.6),
      new THREE.MeshLambertMaterial({ color: 0x334155 })
    );
    roof.position.y = 1.82;
    g.add(roof);
    // Cab window at the front (facing camera)
    const cabWin = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 0.5, 0.05),
      new THREE.MeshBasicMaterial({ color: 0x1e40af })
    );
    cabWin.position.set(0, 1.15, 6.01);
    g.add(cabWin);
    // Two red brake lights
    for(const lx of [-0.55, 0.55]){
      const light = new THREE.Mesh(
        new THREE.SphereGeometry(0.10, 8, 6),
        new THREE.MeshBasicMaterial({ color: 0xff2a2a })
      );
      light.position.set(lx, 0.55, 6.02);
      g.add(light);
    }
  } else if(kind === 'ramp'){
    // Wedge ramp — flat top runs from y=1.8 at the front to y=0
    // at the back over 4 z-units. Player running into it at
    // ground level auto-climbs to train-top height.
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.lineTo(4, 0);          // 4u along z (back edge)
    shape.lineTo(4, 1.8);        // vertical face at the back? no — front
    shape.lineTo(0, 0);
    shape.closePath();
    // Actually simpler: build with a BufferGeometry manually.
    // We want the FRONT (z=+2) to be tall (y=1.8) and the BACK
    // (z=-2) to be at ground. Player runs from front to back.
    const wedge = buildWedge(2.0, 1.8, 4.0);
    wedge.material = new THREE.MeshLambertMaterial({ color: 0xf59e0b });
    g.add(wedge);
    // Yellow warning stripes on the sloped face
    for(let i=-1; i<=1; i++){
      const s = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.06, 0.02),
        new THREE.MeshBasicMaterial({ color: 0x1c1917 })
      );
      // approximate — attach flat labels near the ramp's front top
      s.position.set(i*0.55, 1.65, 1.95);
      g.add(s);
    }
    // "RAMP" text is skipped — the shape reads clearly enough
  }
  return g;
}

// Helper — a triangular prism (wedge) that reads as a ramp
// going from y=0 at z=-halfZ (back) up to y=height at z=+halfZ (front).
function buildWedge(halfX, height, len){
  const halfZ = len / 2;
  const verts = new Float32Array([
    // Sloped top (from back-ground to front-top), 2 tris
    -halfX, 0, -halfZ,     halfX, 0, -halfZ,    halfX, height, halfZ,
    -halfX, 0, -halfZ,     halfX, height, halfZ, -halfX, height, halfZ,
    // Bottom
    -halfX, 0, -halfZ,     -halfX, 0, halfZ,     halfX, 0, halfZ,
    -halfX, 0, -halfZ,      halfX, 0, halfZ,     halfX, 0, -halfZ,
    // Front (vertical face at +halfZ, height rectangle)
    -halfX, 0, halfZ,      -halfX, height, halfZ, halfX, height, halfZ,
    -halfX, 0, halfZ,       halfX, height, halfZ, halfX, 0, halfZ,
    // Left triangle
    -halfX, 0, -halfZ,     -halfX, 0, halfZ,     -halfX, height, halfZ,
    // Right triangle
     halfX, 0, -halfZ,      halfX, height, halfZ, halfX, 0, halfZ,
  ]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo);
}

// ── Game start / end ───────────────────────────────────────
function startGame(){
  resetState();
  // Purge any old obstacles/coins from a previous run
  for(const o of scene.children.slice()){
    if(o.userData && (o.userData.kind || o.userData.air !== undefined)){
      scene.remove(o);
    }
  }
  state.running = true;
  document.getElementById('ov-title').classList.add('hidden');
  document.getElementById('ov-end').classList.add('hidden');
}
window.startGame = startGame;
function endGame(){
  state.dead = true;
  state.running = false;
  state.shake = 0.6;
  const d = Math.floor(state.distance);
  if(d > best){ best = d; localStorage.setItem('rr3d_best', best); }
  document.getElementById('end-dist').textContent = d;
  document.getElementById('end-coins').textContent = state.coins;
  document.getElementById('end-best').textContent = best;
  document.getElementById('ov-end').classList.remove('hidden');
}

// ── Main loop ──────────────────────────────────────────────
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt){
  state.tick += dt;
  // Twinkle stars (rotate slowly for parallax)
  stars.rotation.y += dt * 0.02;

  if(!state.running || state.dead) return;

  // Speed ramp
  state.speed = Math.min(60, 20 + state.distance * 0.05);
  state.distance += state.speed * dt * 0.5;   // "metres"

  // Lane tween
  state.laneTween += (state.lane - state.laneTween) * Math.min(1, dt * 10);
  playerGroup.position.x = LANE_X[0] + (LANE_X[2] - LANE_X[0]) * (state.laneTween / 2);

  // Vertical physics — ground floor is normally 0 but a train
  // or ramp under the player raises it to 1.8.
  let ground = 0;
  state.onTrain = false;
  for(const o of state.obstacles){
    if(o.userData.lane !== state.lane) continue;
    const z = o.userData.z, k = o.userData.kind;
    if(k === 'train'){
      // Train footprint z in [-6, 6] around its center
      if(z + 6 >= 0 && z - 6 <= 0){
        // Only "on top" if we arrived from above (y >= ~1.5) OR
        // we're already elevated (came off a ramp / another train).
        if(state.y >= 1.4){ ground = 1.8; state.onTrain = true; }
      }
    } else if(k === 'ramp'){
      // Ramp footprint z in [-2, 2] around its center; it always
      // lifts us (whether ground or airborne).
      if(z + 2 >= 0 && z - 2 <= 0){
        // The wedge's top slopes from y=0 at z=-2 (back) up to
        // y=1.8 at z=+2 (front). Player at z=0, so:
        //   local z = 0 - z_ramp   (where along the wedge we are)
        //   slope-top = ((local z + 2) / 4) * 1.8
        // localZ interpretation: player enters ramp at its front
        // (z=+2 → localZ=+2 → top = 1.8) and rides down the slope
        // as ramp scrolls past (localZ decreases toward -2).
        const localZ = 0 - z;
        const slopeTop = Math.max(0, Math.min(1.8, ((localZ + 2) / 4) * 1.8));
        ground = Math.max(ground, slopeTop);
        state.onTrain = true;
      }
    }
  }

  state.yVel -= 24 * dt;
  state.y += state.yVel * dt;
  if(state.y < ground){ state.y = ground; state.yVel = 0; }
  playerGroup.position.y = state.y;

  // Slide
  if(state.slideT > 0){
    state.slideT -= dt;
    body.scale.y = 0.5; body.position.y = 0.35;
    head.visible = false; cap.visible = false;
    armL.rotation.z = -1.4; armR.rotation.z = 1.4;
  } else {
    body.scale.y = 1; body.position.y = 0.7;
    head.visible = true; cap.visible = true;
    armL.rotation.z = 0; armR.rotation.z = 0;
  }

  // Running animation (legs + arms swing)
  const swing = Math.sin(state.tick * 15) * 0.6;
  if(state.y <= 0.01 && state.slideT <= 0){
    legL.rotation.x = swing;
    legR.rotation.x = -swing;
    armL.rotation.x = -swing * 0.7;
    armR.rotation.x = swing * 0.7;
  } else if(state.slideT <= 0){
    // Jumping pose
    legL.rotation.x = -0.4; legR.rotation.x = 0.4;
    armL.rotation.x = -0.7; armR.rotation.x = -0.7;
  }

  // Scroll ground textures — sleepers, dividers, streetlights, city
  const scroll = state.speed * dt;
  for(const s of sleepers){
    s.position.z -= scroll;
    if(s.position.z < -12) s.position.z += sleepers.length * 6;
  }
  for(const d of dividers){
    d.position.z -= scroll;
    if(d.position.z < -12) d.position.z += 200;   // 40 * 5
  }
  for(const p of lightPosts){
    p.position.z -= scroll;
    if(p.position.z < -12) p.position.z += 12 * 16;
  }
  for(const b of cityGroup.children){
    b.position.z -= scroll * 0.35;               // parallax slower
    if(b.position.z < -20){ b.position.z += 100; }
  }

  // Spawn
  state.spawnT -= dt; state.coinT -= dt;
  const spawnEvery = Math.max(0.35, 1.2 - state.distance * 0.001);
  if(state.spawnT <= 0){ spawnObstacle(); state.spawnT = spawnEvery; }
  if(state.coinT  <= 0){ spawnCoinRun();  state.coinT  = 1.6 + Math.random() * 1.8; }

  // Move obstacles / coins toward camera
  for(const o of state.obstacles){
    o.position.z -= scroll;
    o.userData.z = o.position.z;
  }
  for(const c of state.coins3D){
    c.position.z -= scroll;
    c.userData.z = c.position.z;
    c.rotation.z += dt * 5;                      // spin
  }

  // Collision — narrow z window centred on the player.
  for(const o of state.obstacles){
    if(o.userData.hit) continue;
    const z = o.userData.z, k = o.userData.kind;
    // Trains use a WIDE window (their full 12u length); ramps use
    // their own 4u length; other obstacles are point-like.
    let inRange;
    if(k === 'train') inRange = (z + 6 >= -0.5 && z - 6 <= 0.5);
    else if(k === 'ramp') inRange = (z + 2 >= -0.5 && z - 2 <= 0.5);
    else inRange = (z >= -0.35 && z <= 0.55);
    if(!inRange) continue;
    if(o.userData.lane !== state.lane) continue;
    let hit = true;
    if(k === 'lo'){
      if(state.y > 0.85) hit = false;
    } else if(k === 'hi'){
      if(state.slideT > 0) hit = false;
    } else if(k === 'train'){
      // Crash only if the player is at ground level under the
      // train. On top (y ~ 1.8) is safe — that's the mechanic.
      if(state.y >= 1.4) hit = false;
    } else if(k === 'ramp'){
      // Ramps never kill; they just lift the player.
      hit = false;
    }
    // 'wall' has no evasion — must have already switched lane
    if(hit){ o.userData.hit = true; endGame(); return; }
    if(!o.userData.dodged){
      o.userData.dodged = true;
      o.traverse(m => { if(m.material && m.material.color){ m.userData.orig = m.material.color.getHex(); m.material.color.setHex(0x22c55e); } });
      setTimeout(() => o.traverse(m => { if(m.material && m.userData.orig != null){ m.material.color.setHex(m.userData.orig); } }), 180);
    }
  }
  // Coin collection — same tightened window
  for(const c of state.coins3D){
    if(c.userData.taken) continue;
    const z = c.userData.z;
    if(z < -0.35 || z > 0.55) continue;
    if(c.userData.lane !== state.lane) continue;
    if(c.userData.air && state.y < 1.2) continue;
    if(!c.userData.air && state.slideT > 0) continue;
    c.userData.taken = true;
    state.coins++;
    scene.remove(c);
  }

  // Cull passed items
  state.obstacles = state.obstacles.filter(o => {
    if(o.position.z < -12){ scene.remove(o); return false; }
    return true;
  });
  state.coins3D = state.coins3D.filter(c => {
    if(c.userData.taken || c.position.z < -12){ scene.remove(c); return false; }
    return true;
  });

  // Screen shake
  if(state.shake > 0){
    const s = state.shake;
    camera.position.x = (Math.random()-0.5) * s * 0.5;
    camera.position.y = 4.5 + (Math.random()-0.5) * s * 0.4;
    state.shake *= Math.exp(-dt * 3);
  } else {
    camera.position.x = 0; camera.position.y = 4.5;
  }

  // HUD
  document.getElementById('dist').innerHTML = Math.floor(state.distance) + 'm<small>DISTANCE</small>';
  document.getElementById('coins').textContent = '◉ ' + state.coins;
  document.getElementById('speedfill').style.width = ((state.speed - 20) / 40 * 100) + '%';
}
</script>
</body>
</html>
