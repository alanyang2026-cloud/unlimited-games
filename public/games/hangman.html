<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hangman</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* Old-west wanted-poster aesthetic — parchment on dark wood */
body{background:
  radial-gradient(ellipse at top,#3a2615 0%,#1a1008 70%,#0a0603 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;
  font-family:'Georgia','Times New Roman',serif;user-select:none;color:#fef3c7;padding:20px 12px 40px;gap:12px;overflow-x:hidden}
h1{color:#fde68a;font-size:1.9rem;font-weight:900;text-shadow:0 2px 0 #78350f,0 0 20px rgba(251,191,36,.3);letter-spacing:.08em;margin-top:28px}
.top{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.box{background:rgba(0,0,0,.35);border:1px solid rgba(251,191,36,.35);border-radius:8px;padding:6px 14px;text-align:center;backdrop-filter:blur(4px);min-width:62px}
.box .lbl{font-size:10px;color:#fde68a;text-transform:uppercase;letter-spacing:.15em}
.box .val{font-size:18px;font-weight:800;color:#fbbf24}
.diff{display:flex;gap:6px}
.diff button{background:rgba(0,0,0,.3);color:#fde68a;border:1px solid rgba(251,191,36,.3);padding:5px 12px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.08em;transition:.15s;text-transform:uppercase}
.diff button.active{background:linear-gradient(180deg,#fbbf24,#d97706);color:#4a2510;border-color:#78350f}
.diff button:hover:not(.active){background:rgba(120,53,15,.5)}

/* Parchment paper that holds the gallows + word */
.sheet{background:
  linear-gradient(180deg,#fefce8,#f5e6c8);
  border:2px solid #78350f;
  border-radius:4px;
  padding:16px 20px;
  box-shadow:
    0 8px 30px rgba(0,0,0,.6),
    inset 0 0 0 4px #e5d3ac,
    inset 0 0 60px rgba(120,53,15,.08);
  max-width:360px;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  color:#4a3618;position:relative}
.sheet::before,.sheet::after{content:"";position:absolute;width:24px;height:24px;background:
  radial-gradient(circle,#78350f 20%,transparent 60%);opacity:.55;border-radius:50%}
.sheet::before{top:4px;left:4px}
.sheet::after{bottom:4px;right:4px}

canvas{display:block;background:transparent}

.word{font-family:'Courier New',monospace;font-size:28px;font-weight:900;letter-spacing:.22em;color:#4a3618;text-align:center;min-height:36px;line-height:1.4;word-spacing:4px}
.hint{font-size:12px;color:#78350f;font-style:italic;text-align:center;letter-spacing:.05em}
.wrong-letters{font-family:'Courier New',monospace;font-size:14px;color:#991b1b;letter-spacing:.2em;min-height:18px;font-weight:800}

/* QWERTY key pad */
.kbd{display:flex;flex-direction:column;gap:5px;align-items:center;margin-top:4px}
.kbd-row{display:flex;gap:4px}
.key{background:linear-gradient(180deg,#fef9c3,#fde68a);border:1px solid #78350f;color:#4a2510;
  min-width:28px;height:34px;padding:0 6px;border-radius:5px;cursor:pointer;
  font-family:'Courier New',monospace;font-weight:900;font-size:15px;transition:.1s;
  box-shadow:0 2px 0 #78350f}
.key:hover:not(.used):not(:disabled){background:linear-gradient(180deg,#fef08a,#fbbf24);transform:translateY(-1px)}
.key:active:not(.used):not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 #78350f}
.key.used{opacity:.3;cursor:not-allowed;box-shadow:none}
.key.good{background:linear-gradient(180deg,#86efac,#22c55e);color:#052e16;border-color:#15803d}
.key.bad{background:linear-gradient(180deg,#fca5a5,#ef4444);color:#450a0a;border-color:#7f1d1d}

.btn{background:linear-gradient(180deg,#fbbf24,#d97706);color:#4a2510;border:1px solid #78350f;
  padding:10px 24px;border-radius:8px;font-weight:900;cursor:pointer;font-size:13px;
  transition:.15s;letter-spacing:.12em;text-transform:uppercase;font-family:inherit;box-shadow:0 3px 0 #78350f;margin-top:4px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #78350f,0 0 14px rgba(251,191,36,.5)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #78350f}

.ov{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(58,38,21,.96),rgba(10,6,3,.99));display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:1000;padding:20px}
.ov.show{display:flex}
.ov h2{font-size:2.4rem;color:#fbbf24;text-shadow:0 2px 0 #78350f,0 0 22px rgba(251,191,36,.5);letter-spacing:.06em}
.ov h2.lose{color:#f87171;text-shadow:0 2px 0 #7f1d1d,0 0 22px rgba(248,113,113,.4)}
.ov p{color:#fde68a;font-size:15px;text-align:center}
.ov .word-reveal{font-family:'Courier New',monospace;font-size:22px;letter-spacing:.2em;color:#fef3c7;background:rgba(0,0,0,.4);padding:8px 16px;border-radius:6px;border:1px solid rgba(251,191,36,.3)}

.hbtn{position:fixed;top:12px;left:12px;z-index:999;background:rgba(0,0,0,.55);color:#fde68a;text-decoration:none;padding:6px 14px;border-radius:20px;font-size:13px;font-family:'Georgia',serif;backdrop-filter:blur(8px);border:1px solid rgba(251,191,36,.35);transition:.2s}
.hbtn:hover{background:rgba(120,53,15,.7);color:#fef3c7}

@media (max-width:420px){
  .key{min-width:24px;height:30px;padding:0 4px;font-size:13px}
  .word{font-size:22px;letter-spacing:.18em}
  h1{font-size:1.5rem}
}
</style>
</head>
<body>
<a href="/" class="hbtn">← Games</a>
<h1>⚰️ Hangman</h1>

<div class="top">
  <div class="box"><div class="lbl">Score</div><div class="val" id="sc">0</div></div>
  <div class="box"><div class="lbl">Streak</div><div class="val" id="st">0</div></div>
  <div class="box"><div class="lbl">Best</div><div class="val" id="bst">0</div></div>
</div>

<div class="diff" id="diff">
  <button data-d="easy" class="active">Easy</button>
  <button data-d="normal">Normal</button>
  <button data-d="hard">Hard</button>
</div>

<div class="sheet">
  <canvas id="gal" width="220" height="200"></canvas>
  <div class="hint" id="hint">Category: Animal</div>
  <div class="word" id="word">_ _ _</div>
  <div class="wrong-letters" id="wrong"></div>
</div>

<div class="kbd" id="kbd"></div>
<button class="btn" onclick="newRound()">New Word</button>

<div class="ov" id="ov">
  <h2 id="ov-title">Nice Work!</h2>
  <p id="ov-msg">You cracked it in 3 guesses.</p>
  <div class="word-reveal" id="ov-word">E X A M P L E</div>
  <button class="btn" onclick="hideOv();newRound()">Next Word</button>
</div>

<script src="_esc-back.js"></script>
<script>
// Each difficulty is a list of {word, hint}. Hints are short & vague
// so the game stays guess-it-letter-by-letter, not trivia.
const WORDS = {
  easy: [
    {w:'APPLE',h:'Fruit, crunchy'},
    {w:'TIGER',h:'Big cat'},
    {w:'OCEAN',h:'Water, huge'},
    {w:'CLOCK',h:'Tells time'},
    {w:'PIANO',h:'Keys & keys'},
    {w:'BREAD',h:'Bakery staple'},
    {w:'SNAKE',h:'No legs'},
    {w:'LEMON',h:'Yellow sour'},
    {w:'HOUSE',h:'Where you live'},
    {w:'CLOUD',h:'Sky, white'},
    {w:'TRAIN',h:'Rides on rails'},
    {w:'STARS',h:'Night sky'},
    {w:'GHOST',h:'Spooky sheet'},
    {w:'PIZZA',h:'Round & cheesy'},
    {w:'SMILE',h:'Facial, happy'},
    {w:'ROBOT',h:'Beep boop'},
    {w:'WATER',h:'H2O'},
    {w:'MOUSE',h:'Rodent / clicker'},
    {w:'BRICK',h:'Building block'},
    {w:'CANDY',h:'Sweet treat'},
  ],
  normal: [
    {w:'GUITAR',h:'Six strings'},
    {w:'ROCKET',h:'To the moon'},
    {w:'CASTLE',h:'Royal home'},
    {w:'DRAGON',h:'Breathes fire'},
    {w:'WIZARD',h:'Pointy hat'},
    {w:'PLANET',h:'Orbits a star'},
    {w:'SPIDER',h:'Eight legs'},
    {w:'NINJA',h:'Stealthy warrior'},
    {w:'GARDEN',h:'Flowers & veg'},
    {w:'BRIDGE',h:'Spans a river'},
    {w:'SUNSET',h:'End of day'},
    {w:'VOLCANO',h:'Molten rock'},
    {w:'DOLPHIN',h:'Smart sea mammal'},
    {w:'RAINBOW',h:'After the rain'},
    {w:'MYSTERY',h:'Something unknown'},
    {w:'MAGICAL',h:'Fairy-tale feel'},
    {w:'LIBRARY',h:'Hush — books'},
    {w:'KITCHEN',h:'Room with the stove'},
    {w:'COMPUTER',h:'This machine'},
    {w:'ELEPHANT',h:'Has a trunk'},
  ],
  hard: [
    {w:'SYMPHONY',h:'Orchestra piece'},
    {w:'BUTTERFLY',h:'Was a caterpillar'},
    {w:'JUBILANT',h:'Very joyful'},
    {w:'QUARTZ',h:'Clear crystal'},
    {w:'XYLOPHONE',h:'Wooden-bar instrument'},
    {w:'ZEPHYR',h:'A soft breeze'},
    {w:'OBSIDIAN',h:'Volcanic glass'},
    {w:'KALEIDOSCOPE',h:'Tube of mirrors'},
    {w:'PNEUMONIA',h:'Lung infection'},
    {w:'RHYTHMIC',h:'In perfect time'},
    {w:'QUIZZICAL',h:'A puzzled look'},
    {w:'JAZZ',h:'Smoky-club music'},
    {w:'JIGSAW',h:'Interlocking pieces'},
    {w:'ECCENTRIC',h:'Pleasantly odd'},
    {w:'LABYRINTH',h:'Maze with one path'},
    {w:'TURQUOISE',h:'Blue-green hue'},
    {w:'WHIMSY',h:'Playful notion'},
    {w:'YACHT',h:'Fancy sailing vessel'},
    {w:'ZODIAC',h:'12 star signs'},
    {w:'VELVET',h:'Soft rich fabric'},
  ],
};

const MAX_WRONG = 6;      // 6 body parts → full hangman
let difficulty = 'easy';
let word = '', hint = '', revealed = [], wrong = [], misses = 0;
let score = 0, streak = 0, best = +(localStorage.hangman_best || 0);
let locked = false;       // after win/lose, keys ignored until next round

const canvas = document.getElementById('gal');
const g = canvas.getContext('2d');

function drawGallows(){
  g.clearRect(0,0,canvas.width,canvas.height);
  // Wood posts
  g.strokeStyle = '#4a2510';
  g.lineWidth = 6;
  g.lineCap = 'round';
  // Base
  g.beginPath(); g.moveTo(20,185); g.lineTo(160,185); g.stroke();
  // Upright
  g.beginPath(); g.moveTo(50,185); g.lineTo(50,20); g.stroke();
  // Crossbeam
  g.beginPath(); g.moveTo(46,23); g.lineTo(150,23); g.stroke();
  // Rope
  g.strokeStyle = '#78350f';
  g.lineWidth = 2;
  g.beginPath(); g.moveTo(140,25); g.lineTo(140,55); g.stroke();
  // Wood grain detail
  g.strokeStyle = 'rgba(74,37,16,.3)';
  g.lineWidth = 1;
  for(let y = 40; y < 180; y += 18){
    g.beginPath(); g.moveTo(46,y); g.lineTo(54,y); g.stroke();
  }
}

function drawBody(parts){
  // Draws the first N body parts (0 to 6).
  g.strokeStyle = '#1a1a1a';
  g.fillStyle = '#1a1a1a';
  g.lineWidth = 3;
  g.lineCap = 'round';
  // 1 head
  if(parts >= 1){
    g.beginPath(); g.arc(140,70,15,0,Math.PI*2); g.stroke();
    // Sad-face when fully hanged
    if(parts === MAX_WRONG){
      g.fillStyle = '#1a1a1a';
      g.beginPath(); g.arc(135,68,1.6,0,Math.PI*2); g.fill();
      g.beginPath(); g.arc(145,68,1.6,0,Math.PI*2); g.fill();
      g.strokeStyle = '#1a1a1a'; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(133,78); g.quadraticCurveTo(140,74,147,78); g.stroke();
    }
  }
  g.strokeStyle = '#1a1a1a'; g.lineWidth = 3;
  // 2 body
  if(parts >= 2){ g.beginPath(); g.moveTo(140,85); g.lineTo(140,135); g.stroke(); }
  // 3 left arm
  if(parts >= 3){ g.beginPath(); g.moveTo(140,100); g.lineTo(122,120); g.stroke(); }
  // 4 right arm
  if(parts >= 4){ g.beginPath(); g.moveTo(140,100); g.lineTo(158,120); g.stroke(); }
  // 5 left leg
  if(parts >= 5){ g.beginPath(); g.moveTo(140,135); g.lineTo(125,165); g.stroke(); }
  // 6 right leg
  if(parts >= 6){ g.beginPath(); g.moveTo(140,135); g.lineTo(155,165); g.stroke(); }
}

function render(){
  drawGallows();
  drawBody(misses);
  document.getElementById('word').textContent = revealed.join(' ');
  document.getElementById('wrong').textContent = wrong.length ? 'Missed: ' + wrong.join(' ') : '';
  document.getElementById('hint').textContent = 'Clue: ' + hint;
  document.getElementById('sc').textContent = score;
  document.getElementById('st').textContent = streak;
  document.getElementById('bst').textContent = best;
}

function buildKbd(){
  const kb = document.getElementById('kbd');
  kb.innerHTML = '';
  const rows = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  for(const row of rows){
    const r = document.createElement('div');
    r.className = 'kbd-row';
    for(const ch of row){
      const b = document.createElement('button');
      b.className = 'key';
      b.textContent = ch;
      b.addEventListener('click', () => guess(ch));
      r.appendChild(b);
    }
    kb.appendChild(r);
  }
}

function newRound(){
  const pool = WORDS[difficulty];
  const pick = pool[Math.floor(Math.random() * pool.length)];
  word = pick.w;
  hint = pick.h;
  revealed = word.split('').map(() => '_');
  wrong = [];
  misses = 0;
  locked = false;
  // Reset keyboard visual state
  document.querySelectorAll('.key').forEach(k => {
    k.classList.remove('used','good','bad');
    k.disabled = false;
  });
  render();
}

function guess(letter){
  if(locked) return;
  const key = [...document.querySelectorAll('.key')].find(k => k.textContent === letter);
  if(!key || key.classList.contains('used')) return;
  key.classList.add('used');
  key.disabled = true;

  if(word.includes(letter)){
    // Fill every occurrence
    for(let i = 0; i < word.length; i++){
      if(word[i] === letter) revealed[i] = letter;
    }
    key.classList.add('good');
    if(!revealed.includes('_')) return win();
  } else {
    wrong.push(letter);
    misses++;
    key.classList.add('bad');
    if(misses >= MAX_WRONG) return lose();
  }
  render();
}

function win(){
  locked = true;
  // Reward: 10 base + 2 per unused life + difficulty bonus
  const bonus = {easy:0, normal:5, hard:10}[difficulty];
  const earned = 10 + (MAX_WRONG - misses) * 2 + bonus;
  score += earned;
  streak++;
  if(score > best){ best = score; localStorage.hangman_best = best; }
  render();
  showOv('🎉 Saved!', `+${earned} points · ${MAX_WRONG - misses} lives left`);
}

function lose(){
  locked = true;
  streak = 0;
  render();
  showOv('💀 Hanged!', 'The word was:', true);
}

function showOv(title, msg, lose){
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-title').className = lose ? 'lose' : '';
  document.getElementById('ov-msg').textContent = msg;
  document.getElementById('ov-word').textContent = word.split('').join(' ');
  document.getElementById('ov').classList.add('show');
}
function hideOv(){ document.getElementById('ov').classList.remove('show'); }

// Physical keyboard input
addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if(k.length === 1 && k >= 'A' && k <= 'Z') guess(k);
  if(e.key === 'Enter' && locked){ hideOv(); newRound(); }
});

// Difficulty switcher
document.getElementById('diff').addEventListener('click', e => {
  if(e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#diff button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  difficulty = e.target.dataset.d;
  streak = 0;
  newRound();
});

buildKbd();
newRound();
</script>
</body>
</html>
